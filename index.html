<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f7f7">
<link rel="manifest" href="manifest.webmanifest">
<title>Guitar Fretboard Trainer</title>
<style>
:root{
  --bg:#f6f6f4;
  --panel:#ffffff;
  --line:#d7d7d7;
  --text:#1f2328;
  --muted:#6b7280;
  --dark:#262a2f;
  --yellow:#f1b937;
  --purple:#b45bbd;
  --cyan:#58b9c7;
  --orange:#f29a45;
  --blue:#4b78b9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
body{overflow:auto}
.app{min-width:1180px;min-height:100vh;background:linear-gradient(#fafafa,#f3f3f1)}
.topbar{
  display:grid;
  grid-template-columns: 160px 500px 130px 290px 170px;
  gap:18px;align-items:end;
  padding:18px 36px 20px;
  background:#fff;border-bottom:1px solid #ddd;
  position:sticky;top:0;z-index:50
}
.group label{display:block;font-size:16px;font-weight:700;margin:0 0 8px 2px}
select,.seg button,.sound-btn{
  height:56px;border:1px solid #cfd3d8;background:#fff;border-radius:10px;
  font-size:18px;color:#1f2328
}
select{width:100%;padding:0 16px}
.seg{display:flex}
.seg button{border-radius:0;min-width:108px;padding:0 18px}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0}
.seg button+button{border-left:0}
.seg button.active{background:#2c3035;color:#fff;box-shadow:inset 0 0 0 1px #2c3035}
.sound-btn{width:104px;font-size:28px;cursor:pointer}
.main{padding:28px 24px 24px}
.board-wrap{overflow-x:auto;padding-bottom:10px}
.board-area{position:relative;width:1510px;height:520px;margin:0 auto}
.string-name{
  position:absolute;left:0;width:74px;text-align:left;font-size:25px;font-weight:700;transform:translateY(-50%);
}
.string-name .ord{font-size:18px;color:#111;margin-right:10px}
.string-name.s1 .note,.string-name.s6 .note{color:var(--yellow)}
.string-name.s2 .note{color:var(--purple)}
.string-name.s3 .note{color:var(--cyan)}
.string-name.s4 .note{color:var(--orange)}
.string-name.s5 .note{color:var(--blue)}

.fretboard{
  position:absolute;left:86px;top:8px;width:1400px;height:430px;
  background:#fff;border-right:2px solid #444
}
.nut{position:absolute;left:0;top:0;bottom:0;width:31px;background:linear-gradient(90deg,#111,#444,#111);border-radius:11px;z-index:8}
.fret{position:absolute;top:0;bottom:0;width:4px;background:linear-gradient(90deg,#444,#d7d7d7,#555);z-index:4}
.string{position:absolute;left:30px;right:0;background:#3c3c3c;z-index:6;box-shadow:0 1px 0 #f7f7f7}
.string.wound{background:repeating-linear-gradient(90deg,#777 0 3px,#e4e4e4 3px 5px,#666 5px 8px)}
.marker{position:absolute;width:25px;height:25px;border-radius:50%;background:#cfd4d7;box-shadow:inset 0 0 0 1px #b3b8bc;z-index:3}
.tapcell{
  position:absolute;border:0;background:transparent;z-index:12;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0
}
.bubble{
  min-width:42px;height:42px;padding:0 8px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#111;opacity:0;
  transform:scale(.8);transition:.12s
}
.tapcell.show .bubble{opacity:1;transform:scale(1)}
.tapcell.hit .bubble{opacity:1;transform:scale(1.08);box-shadow:0 0 0 4px rgba(30,30,30,.09)}
.bubble.root{background:#7dd4de}
.bubble.i2{background:#ffd45f}
.bubble.i3{background:#9bd06d}
.bubble.i4{background:#6ab6ea}
.bubble.i5{background:#ff9c9c}
.bubble.i6{background:#c59ae3}
.bubble.ib7{background:#f5a166}
.bubble.i7{background:#94a8e8}
.bubble.other{background:#e3e6e8}

.fret-num{position:absolute;top:446px;font-size:18px;transform:translateX(-50%);color:#24272b}
.fret-num.bold{font-weight:800}

.bottom{
  display:grid;grid-template-columns:1.7fr .75fr .95fr;gap:28px;
  margin:22px auto 8px;max-width:1460px
}
.card{background:#fff;border:1px solid #d9dce0;border-radius:10px;padding:20px 22px;min-height:245px;box-shadow:0 1px 3px rgba(0,0,0,.02)}
.card h3{margin:0 0 18px;font-size:22px}
.usage ul{margin:0;padding-left:22px;line-height:1.85;font-size:16px}
.tapped{text-align:center}
.tapped h3{color:#1e65c1}
.big-note{font-size:48px;font-weight:800;margin-top:38px}
.subnote{font-size:17px;color:#666;margin-top:8px}
.legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}
.legend-item{display:flex;align-items:center;gap:12px;font-size:18px}
.dot{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.footer{text-align:center;color:#777;padding:5px 0 24px}
.portrait-note{display:none}
@media(max-width:900px) and (orientation:portrait){
  .portrait-note{display:block;position:fixed;z-index:1000;left:50%;top:50%;transform:translate(-50%,-50%);background:#111;color:#fff;padding:18px 24px;border-radius:14px;font-size:18px}
}
</style>
</head>
<body>
<div class="portrait-note">iPadを横向きにしてください</div>
<div class="app">
  <div class="topbar">
    <div class="group"><label>Root（基準音）</label><select id="root"></select></div>
    <div class="group"><label>表示モード</label><div class="seg">
      <button data-mode="none" class="active">非表示</button>
      <button data-mode="note">音名</button>
      <button data-mode="interval">度数</button>
      <button data-mode="both">音名＋度数</button>
    </div></div>
    <div class="group"><label>音のオン/オフ</label><button class="sound-btn" id="sound">🔊</button></div>
    <div class="group"><label>チューニング</label><select id="tuning"><option>標準（E A D G B E）</option></select></div>
    <div class="group"><label>フレット範囲</label><select id="range"><option value="24">0 - 24</option><option value="15">0 - 15</option><option value="12">0 - 12</option></select></div>
  </div>

  <div class="main">
    <div class="board-wrap">
      <div class="board-area" id="boardArea">
        <div class="fretboard" id="fretboard"></div>
      </div>
    </div>

    <div class="bottom">
      <div class="card usage">
        <h3>使い方</h3>
        <ul>
          <li>指板のフレットをタップすると、その音が鳴ります。</li>
          <li>上の設定で「Root（基準音）」と「表示モード」を変更できます。</li>
          <li>「音名」モードでは音名を、「度数」モードでは基準音に対する度数を表示します。</li>
          <li>「音名＋度数」モードでは両方を表示します。</li>
          <li>表示を非表示にすると、暗記練習モードになります。</li>
        </ul>
      </div>
      <div class="card tapped">
        <h3>タップした音</h3>
        <div class="big-note" id="bigNote">−</div>
        <div class="subnote" id="subNote">（フレットをタップしてください）</div>
      </div>
      <div class="card">
        <h3>度数の凡例（Root: <span id="legendRoot">C</span>）</h3>
        <div class="legend-grid">
          <div class="legend-item"><span class="dot" style="background:#7dd4de">R</span>ルート</div>
          <div class="legend-item"><span class="dot" style="background:#ff9c9c">5</span>5th</div>
          <div class="legend-item"><span class="dot" style="background:#ffd45f">2</span>2nd</div>
          <div class="legend-item"><span class="dot" style="background:#c59ae3">6</span>6th</div>
          <div class="legend-item"><span class="dot" style="background:#9bd06d">3</span>3rd</div>
          <div class="legend-item"><span class="dot" style="background:#f5a166">♭7</span>♭7th</div>
          <div class="legend-item"><span class="dot" style="background:#6ab6ea">4</span>4th</div>
          <div class="legend-item"><span class="dot" style="background:#94a8e8">7</span>7th</div>
        </div>
      </div>
    </div>
    <div class="footer">Guitar Fretboard Trainer</div>
  </div>
</div>

<script>
const NOTES=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
const INTERVALS=["R","♭2","2","♭3","3","4","♯4","5","♭6","6","♭7","7"];
const OPEN_MIDI=[64,59,55,50,45,40]; // 1弦→6弦
const STRING_LABELS=[["1弦","E","s1"],["2弦","B","s2"],["3弦","G","s3"],["4弦","D","s4"],["5弦","A","s5"],["6弦","E","s6"]];
let mode="none", soundOn=true, maxFret=24, audioCtx=null;

const rootSel=document.getElementById("root");
NOTES.forEach((n,i)=>rootSel.add(new Option(n,i)));
const boardArea=document.getElementById("boardArea");
const fretboard=document.getElementById("fretboard");

function noteName(m){return NOTES[(m%12+12)%12]}
function intervalName(m){
  const root=Number(rootSel.value);
  return INTERVALS[((m%12)-root+12)%12];
}
function bubbleClass(i){
  return ({R:"root","2":"i2","3":"i3","4":"i4","5":"i5","6":"i6","♭7":"ib7","7":"i7"})[i]||"other";
}
function labelFor(m){
  const n=noteName(m), i=intervalName(m);
  if(mode==="note") return n;
  if(mode==="interval") return i;
  if(mode==="both") return n+" "+i;
  return "";
}
function play(midi){
  if(!soundOn)return;
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  const t=audioCtx.currentTime;
  const f=440*Math.pow(2,(midi-69)/12);
  const o=audioCtx.createOscillator(), o2=audioCtx.createOscillator();
  const g=audioCtx.createGain(), g2=audioCtx.createGain(), lp=audioCtx.createBiquadFilter();
  o.type="triangle"; o.frequency.value=f;
  o2.type="sine"; o2.frequency.value=f*2; g2.gain.value=.05;
  lp.type="lowpass"; lp.frequency.value=2400;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.22,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+1.0);
  o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(audioCtx.destination);
  o.start(t); o2.start(t); o.stop(t+1.05); o2.stop(t+1.05);
}
function render(){
  document.getElementById("legendRoot").textContent=NOTES[rootSel.value];
  boardArea.querySelectorAll(".string-name,.fret-num").forEach(x=>x.remove());
  fretboard.innerHTML="";
  const boardLeft=86, boardWidth=maxFret===24?1400:(maxFret===15?1000:850);
  const fretW=(boardWidth-31)/maxFret;
  fretboard.style.width=boardWidth+"px";
  boardArea.style.width=(boardLeft+boardWidth+20)+"px";
  const nut=document.createElement("div"); nut.className="nut"; fretboard.appendChild(nut);

  const yPositions=[28,110,192,274,356,426];
  STRING_LABELS.forEach((sl,i)=>{
    const d=document.createElement("div"); d.className=`string-name ${sl[2]}`;
    d.style.top=(8+yPositions[i])+"px";
    d.innerHTML=`<span class="ord">${sl[0]}</span><span class="note">${sl[1]}</span>`;
    boardArea.appendChild(d);
  });

  for(let f=1;f<=maxFret;f++){
    const x=31+f*fretW;
    const fr=document.createElement("div"); fr.className="fret"; fr.style.left=x+"px"; fretboard.appendChild(fr);
  }

  // strings
  yPositions.forEach((y,s)=>{
    const st=document.createElement("div"); st.className="string"+(s>=3?" wound":"");
    st.style.top=y+"px"; st.style.height=(s<3?3:(s===3?5:s===4?7:9))+"px"; fretboard.appendChild(st);
  });

  // markers
  [3,5,7,9,15,17,19,21].filter(f=>f<=maxFret).forEach(f=>{
    const m=document.createElement("div"); m.className="marker"; m.style.left=(31+(f-.5)*fretW-12)+"px"; m.style.top="215px"; fretboard.appendChild(m);
  });
  [12,24].filter(f=>f<=maxFret).forEach(f=>{
    [84,348].forEach(y=>{
      const m=document.createElement("div"); m.className="marker"; m.style.left=(31+(f-.5)*fretW-12)+"px"; m.style.top=y+"px"; fretboard.appendChild(m);
    })
  });

  // fret numbers
  for(let f=0;f<=maxFret;f++){
    const n=document.createElement("div"); n.className="fret-num"+([3,5,7,9,12,15,17,19,21,24].includes(f)?" bold":"");
    n.style.left=(boardLeft+(f===0?12:31+(f-.5)*fretW))+"px"; n.textContent=f; boardArea.appendChild(n);
  }

  // tap cells
  yPositions.forEach((y,s)=>{
    for(let f=0;f<=maxFret;f++){
      const midi=OPEN_MIDI[s]+f;
      const cell=document.createElement("button");
      cell.className="tapcell"+(mode!=="none"?" show":"");
      const x0=f===0?0:(31+(f-1)*fretW), x1=f===0?31:(31+f*fretW);
      cell.style.left=x0+"px"; cell.style.top=(y-34)+"px"; cell.style.width=(x1-x0)+"px"; cell.style.height="68px";
      const bub=document.createElement("span"); bub.className="bubble "+bubbleClass(intervalName(midi)); bub.textContent=labelFor(midi);
      cell.appendChild(bub);
      cell.onclick=()=>{
        play(midi);
        const n=noteName(midi), iv=intervalName(midi);
        document.getElementById("bigNote").textContent=n+" / "+iv;
        document.getElementById("subNote").textContent=`${s+1}弦 ${f}フレット`;
        cell.classList.add("hit"); setTimeout(()=>cell.classList.remove("hit"),180);
      };
      fretboard.appendChild(cell);
    }
  });
}
document.querySelectorAll(".seg button").forEach(btn=>{
  btn.onclick=()=>{
    mode=btn.dataset.mode;
    document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("active",b===btn));
    render();
  }
});
document.getElementById("sound").onclick=function(){soundOn=!soundOn;this.textContent=soundOn?"🔊":"🔇"};
rootSel.onchange=render;
document.getElementById("range").onchange=function(){maxFret=Number(this.value);render()};
render();
</script>
</body>
</html>
