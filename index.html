<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>指板ファンクション・トレーナー</title>
<style>
:root{--bg:#0b0d10;--panel:#171b21;--text:#f7f9fc;--muted:#9aa4b2;--blue:#238cff;--green:#2ec774;--red:#ff5967;--line:#626b78}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1100px;margin:auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}
.panel{background:var(--panel);border-radius:18px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:6px;color:var(--muted);font-size:13px}
select,button{font:inherit;border:0;border-radius:13px;padding:12px}
select{background:#262c35;color:white}
button{background:var(--blue);color:white;font-weight:700}
button.secondary{background:#303741}
.question{text-align:center}
.root{font-size:50px;font-weight:800}
.target{font-size:38px;font-weight:800;color:var(--blue);margin-top:4px}
.sub,.stats{color:var(--muted);margin-top:8px}
.stats{display:flex;justify-content:center;gap:18px}
.board-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.board{min-width:900px}
.row{display:flex}
.label,.cell{flex:0 0 60px;height:56px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.label{flex-basis:58px;background:#101319;color:var(--muted);font-weight:700}
.cell{position:relative;background:#11151a;touch-action:manipulation}
.cell.selected{background:rgba(35,140,255,.28)}
.cell.correct{background:rgba(46,199,116,.38)}
.cell.wrong{background:rgba(255,89,103,.38)}
.badge{position:absolute;min-width:34px;height:34px;padding:0 7px;border-radius:18px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.dot::after{content:"";width:9px;height:9px;border-radius:50%;background:#77808d}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
#message{text-align:center;min-height:24px;font-weight:700;margin-bottom:10px}
.checks{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.checks label{display:block;background:#262c35;padding:8px 10px;border-radius:12px;color:white}
.small{font-size:12px;color:var(--muted)}
@media(max-width:650px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.actions button:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<main>
<h1>指板ファンクション・トレーナー</h1>

<section class="panel grid">
<label>出題モード
<select id="mode">
<option value="interval">ルート＋機能</option>
<option value="chord">コード＋構成音</option>
</select></label>
<label>回答
<select id="answerMode">
<option value="all">該当位置を全部</option>
<option value="one">どれか1か所</option>
</select></label>
<label>開始フレット<select id="startFret"></select></label>
<label>終了フレット<select id="endFret"></select></label>
</section>

<section class="panel question">
<div class="root" id="rootText"></div>
<div class="target" id="targetText"></div>
<div class="sub" id="subText"></div>
<div class="stats"><span>正解 <b id="okCount">0</b></span><span>不正解 <b id="ngCount">0</b></span><span>連続 <b id="streakCount">0</b></span></div>
</section>

<section class="panel board-scroll">
<div class="board" id="board"></div>
</section>

<section class="panel">
<div id="message">該当する位置をタップしてください。</div>
<div class="actions">
<button id="checkBtn">答え合わせ</button>
<button class="secondary" id="showBtn">答えを見る</button>
<button class="secondary" id="nextBtn">次の問題</button>
</div>
</section>

<details class="panel">
<summary><b>出題する機能・コード</b></summary>
<div class="small" style="margin-top:12px">機能</div>
<div class="checks" id="intervalChecks"></div>
<div class="small" style="margin-top:12px">コード</div>
<div class="checks" id="chordChecks"></div>
</details>

<section class="panel small">
標準チューニング E–A–D–G–B–E。Safariで共有ボタンから「ホーム画面に追加」すると使いやすくなります。
</section>
</main>

<script>
const NOTES=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
const OPEN=[4,9,2,7,11,4];
const STRINGS=["6:E","5:A","4:D","3:G","2:B","1:E"];
const INTERVALS=["R","♭9","9","♯9","3","11","♯11","5","♭13","13","♭7","7"];
const SEMI={"R":0,"♭9":1,"9":2,"♯9":3,"♭3":3,"3":4,"11":5,"♯11":6,"♭5":6,"5":7,"♭13":8,"6":9,"13":9,"♭7":10,"7":11};
const CHORDS=[
{name:"Maj7",tones:["R","3","5","7"]},{name:"7",tones:["R","3","5","♭7"]},
{name:"m7",tones:["R","♭3","5","♭7"]},{name:"m7♭5",tones:["R","♭3","♭5","♭7"]},
{name:"dim7",tones:["R","♭3","♭5","6"]},{name:"7(♭9)",tones:["R","3","5","♭7","♭9"]},
{name:"7(♯9)",tones:["R","3","5","♭7","♯9"]},{name:"7(♯11)",tones:["R","3","5","♭7","♯11"]},
{name:"7(♭13)",tones:["R","3","5","♭7","♭13"]}
];
let state={root:0,target:"♭13",selected:new Set(),revealed:false,ok:0,ng:0,streak:0,chord:null};
const $=x=>document.getElementById(x);

function setup(){
 for(let i=0;i<=24;i++){startFret.add(new Option(i,i));endFret.add(new Option(i,i))}
 startFret.value=0;endFret.value=12;
 INTERVALS.forEach(v=>intervalChecks.insertAdjacentHTML("beforeend",`<label><input type="checkbox" value="${v}" checked> ${v}</label>`));
 CHORDS.forEach(v=>chordChecks.insertAdjacentHTML("beforeend",`<label><input type="checkbox" value="${v.name}" checked> ${v.name}</label>`));
 buildBoard();newQuestion();
}
function buildBoard(){
 board.innerHTML="";
 for(let s=0;s<6;s++){
  const row=document.createElement("div");row.className="row";
  const lab=document.createElement("div");lab.className="label";lab.textContent=STRINGS[s];row.appendChild(lab);
  for(let f=0;f<=24;f++){
   const c=document.createElement("div");c.className="cell";c.dataset.s=s;c.dataset.f=f;
   if([3,5,7,9,12,15,17,19,21,24].includes(f))c.classList.add("dot");
   c.onclick=()=>toggle(c);row.appendChild(c);
  }
  board.appendChild(row);
 }
 applyRange();
}
function applyRange(){
 const a=+startFret.value,b=+endFret.value;
 document.querySelectorAll("[data-f]").forEach(el=>{const f=+el.dataset.f;el.style.display=(f>=a&&f<=b)?"flex":"none"});
}
function toggle(c){
 if(state.revealed)return;
 const k=`${c.dataset.s}-${c.dataset.f}`;
 if(state.selected.has(k)){state.selected.delete(k);c.classList.remove("selected")}
 else{state.selected.add(k);c.classList.add("selected")}
}
function checked(container){return [...container.querySelectorAll("input:checked")].map(x=>x.value)}
function newQuestion(){
 clearBoard();state.revealed=false;state.root=Math.floor(Math.random()*12);
 if(mode.value==="interval"){
  let pool=checked(intervalChecks);if(!pool.length)pool=["R"];
  state.target=pool[Math.floor(Math.random()*pool.length)];state.chord=null;
  rootText.textContent=NOTES[state.root];targetText.textContent=state.target;subText.textContent=`${NOTES[state.root]}を基準に${state.target}を探す`;
 }else{
  let pool=checked(chordChecks);if(!pool.length)pool=["7"];
  state.chord=CHORDS.find(x=>x.name===pool[Math.floor(Math.random()*pool.length)]);
  const tones=state.chord.tones.filter(x=>x!=="R");state.target=tones[Math.floor(Math.random()*tones.length)];
  rootText.textContent=NOTES[state.root]+state.chord.name;targetText.textContent=state.target;subText.textContent=`${NOTES[state.root]}${state.chord.name}の${state.target}を探す`;
 }
 message.textContent="該当する位置をタップしてください。";
}
function solutions(){
 const pc=(state.root+SEMI[state.target])%12,a=+startFret.value,b=+endFret.value,out=[];
 for(let s=0;s<6;s++)for(let f=a;f<=b;f++)if((OPEN[s]+f)%12===pc)out.push(`${s}-${f}`);
 return new Set(out);
}
function reveal(markWrong){
 const sol=solutions();
 document.querySelectorAll(".cell").forEach(c=>{
  const k=`${c.dataset.s}-${c.dataset.f}`;
  if(sol.has(k)){c.classList.add("correct");const b=document.createElement("div");b.className="badge";b.textContent=state.target;c.appendChild(b)}
  else if(markWrong&&state.selected.has(k))c.classList.add("wrong");
 });
 state.revealed=true;
}
function check(){
 if(!state.selected.size){message.textContent="まず位置をタップしてください。";return}
 const sol=solutions();let good=false;
 if(answerMode.value==="all")good=sol.size===state.selected.size&&[...sol].every(k=>state.selected.has(k));
 else good=state.selected.size===1&&[...state.selected].some(k=>sol.has(k));
 if(good){state.ok++;state.streak++;message.textContent="正解！"}
 else{state.ng++;state.streak=0;message.textContent="惜しい。緑が正解、赤が誤答です。"}
 reveal(!good);updateStats();
}
function clearBoard(){state.selected.clear();document.querySelectorAll(".cell").forEach(c=>{c.classList.remove("selected","correct","wrong");c.querySelectorAll(".badge").forEach(x=>x.remove())})}
function updateStats(){okCount.textContent=state.ok;ngCount.textContent=state.ng;streakCount.textContent=state.streak}
checkBtn.onclick=check;showBtn.onclick=()=>{reveal(false);message.textContent="答えを表示しました。"};nextBtn.onclick=newQuestion;
mode.onchange=newQuestion;answerMode.onchange=newQuestion;
startFret.onchange=()=>{if(+startFret.value>+endFret.value)endFret.value=startFret.value;applyRange();newQuestion()};
endFret.onchange=()=>{if(+endFret.value<+startFret.value)startFret.value=endFret.value;applyRange();newQuestion()};
setup();
</script>
</body>
</html>
