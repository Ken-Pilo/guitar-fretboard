<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>THR Pitch Diagnostic</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:820px;margin:auto;padding:12px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:14px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:44px;padding:8px;font:inherit}.btn{font-weight:700}.blue{color:#58a6ff}.small{font-size:12px;color:#aaa}.big{text-align:center;font-size:42px;font-weight:900}.hz{text-align:center;font-size:25px;font-weight:800}.meter{height:9px;background:#222;border-radius:8px;overflow:hidden;margin-top:8px}.meter div{height:100%;background:#aaa}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{border:1px solid #333;border-radius:11px;padding:9px}.card b{font-size:18px}.good{color:#6ee787}.warn{color:#ffb86c}.bad{color:#ff7b72}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 4px;border-bottom:1px solid #292929;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.big{font-size:36px}}</style></head><body><div class="app"><div class="p"><div class="row"><b style="font-size:21px">THR 生音程 診断</b><button id="on" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:8px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ AudioContext sampleRate：<b id="sr" class="blue">—</b> Hz</div><div class="small">キャリブレーション補正は一切使用しません。ブラウザが受け取った音をそのまま測定します。</div></div><div class="p"><div class="big" id="note">—</div><div class="hz"><span id="hz">—</span> Hz　<span id="cent" class="blue">—</span></div><div class="small" style="text-align:center">confidence <span id="conf">—</span>% ／ RMS <span id="rms">—</span></div><div class="meter"><div id="lev" style="width:0"></div></div></div><div class="p"><div class="small" style="margin-bottom:8px">① 下の弦を選ぶ → ② 開放弦を普通に1回弾く → ③ 約1.2秒そのまま伸ばす。アタック・0.3秒・1.0秒を自動記録します。</div><div class="grid" id="strings"></div><div class="row" style="margin-top:9px"><button id="clear" class="btn">記録クリア</button><span id="status" class="small">弦を選んでください。</span></div></div><div class="p"><table><thead><tr><th>弦 / 基準</th><th>Attack</th><th>+0.3s</th><th>+1.0s</th></tr></thead><tbody id="rows"></tbody></table><div class="small" style="margin-top:9px">表示：測定Hz（基準からのcent）。±20cent以内=緑、±20〜50=橙、±50超=赤。3回程度繰り返すと傾向が分かります。</div></div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x);const S=[{s:'6弦',n:'E2',f:82.4069},{s:'5弦',n:'A2',f:110},{s:'4弦',n:'D3',f:146.8324},{s:'3弦',n:'G3',f:195.9977},{s:'2弦',n:'B3',f:246.9417},{s:'1弦',n:'E4',f:329.6276}];let ctx,an,buf,stream,raf=0,target=-1,trial=null,prevR=0,lastQuiet=0,records=S.map(()=>[]);function yin(x,sr){let n=x.length,mean=0;for(let v of x)mean+=v;mean/=n;let rms=0,y=new Float32Array(n);for(let i=0;i<n;i++){y[i]=x[i]-mean;rms+=y[i]*y[i]}rms=Math.sqrt(rms/n);if(rms<.00025)return{f:-1,r:rms,p:0};let min=Math.floor(sr/1400),max=Math.min(Math.floor(sr/70),n>>1),d=new Float32Array(max+1),c=new Float32Array(max+1);for(let t=1;t<=max;t++){let z=0;for(let i=0;i<n-t;i++){let q=y[i]-y[i+t];z+=q*q}d[t]=z}let run=0,b=-1,bv=1;for(let t=1;t<=max;t++){run+=d[t];c[t]=run?d[t]*t/run:1;if(t>=min&&c[t]<.18){while(t+1<=max&&c[t+1]<c[t])t++;b=t;bv=c[t];break}if(t>=min&&c[t]<bv){b=t;bv=c[t]}}if(b<0||bv>.45)return{f:-1,r:rms,p:1-bv};let tau=b;if(b>1&&b<max){let a=c[b-1],z=c[b+1],den=a+z-2*c[b];if(Math.abs(den)>1e-9)tau=b+(a-z)/(2*den)}return{f:sr/tau,r:rms,p:1-bv}}function cents(f,t){return 1200*Math.log2(f/t)}function cls(c){c=Math.abs(c);return c<=20?'good':c<=50?'warn':'bad'}function fmt(v,t){if(!v)return '—';let c=cents(v,t);return `<span class="${cls(c)}">${v.toFixed(1)}<br><small>${c>=0?'+':''}${Math.round(c)}c</small></span>`}function draw(){let box=$('strings');box.innerHTML='';S.forEach((x,i)=>{let b=document.createElement('button');b.className='btn card';b.innerHTML=`<b>${x.s} ${x.n}</b><br><span class="small">${x.f.toFixed(2)} Hz</span>`;if(i===target)b.style.borderColor='#58a6ff';b.onclick=()=>{target=i;trial=null;$('status').textContent=x.s+' '+x.n+' を普通に1回弾いてください。';draw()};box.appendChild(b)});$('rows').innerHTML=S.map((x,i)=>{let r=records[i].at(-1)||{};return `<tr><td>${x.s} ${x.n}<br><span class="small">${x.f.toFixed(2)}</span></td><td>${fmt(r.a,x.f)}</td><td>${fmt(r.b,x.f)}</td><td>${fmt(r.c,x.f)}</td></tr>`}).join('')}function nearest(f){let m=Math.round(69+12*Math.log2(f/440)),names=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];return{n:names[(m%12+12)%12]+(Math.floor(m/12)-1),c:100*(69+12*Math.log2(f/440)-m)}}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let p=yin(buf,ctx.sampleRate),now=performance.now(),r=p.r;$('rms').textContent=r.toFixed(5);$('lev').style.width=Math.min(100,r*2500)+'%';if(r<.0004)lastQuiet=now;if(p.f>65&&p.f<1400){let q=nearest(p.f);$('note').textContent=q.n;$('hz').textContent=p.f.toFixed(2);$('cent').textContent=(q.c>=0?'+':'')+Math.round(q.c)+' cent';$('conf').textContent=Math.round(p.p*100)}let attack=target>=0&&!trial&&r>.00055&&(now-lastQuiet<220||r>prevR*1.55);if(attack){trial={t:now,s:[],a:null,b:null,c:null};$('status').textContent='測定中… 音を1秒伸ばしてください。'}if(trial&&p.f>65&&p.f<1400&&p.p>.35){let dt=now-trial.t;trial.s.push({dt,f:p.f});function med(lo,hi){let a=trial.s.filter(x=>x.dt>=lo&&x.dt<=hi).map(x=>x.f).sort((a,b)=>a-b);return a.length?a[Math.floor(a.length/2)]:null}if(dt>130&&!trial.a)trial.a=med(40,130);if(dt>420&&!trial.b)trial.b=med(260,420);if(dt>1120&&!trial.c){trial.c=med(900,1120);records[target].push({a:trial.a,b:trial.b,c:trial.c});$('status').textContent='記録しました。同じ弦をもう一度弾くか、次の弦を選んでください。';trial=null;draw()}}if(trial&&now-trial.t>1400){records[target].push({a:trial.a,b:trial.b,c:trial.c});trial=null;draw()}prevR=r;raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('dev').innerHTML='';ds.forEach((d,i)=>$('dev').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('dev').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('dev').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('sr').textContent=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);lastQuiet=performance.now();loop();await list(set.deviceId||id||'')} $('on').onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}$('on').textContent='ギター入力 ON'}else try{await open('');$('on').textContent='ギター入力 OFF'}catch(e){$('status').textContent='入力エラー：'+e.message}};$('dev').onchange=()=>open($('dev').value);$('clear').onclick=()=>{records=S.map(()=>[]);trial=null;draw()};draw()})();</script></body></html>
