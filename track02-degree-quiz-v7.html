<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Track 02 v7</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:800px;margin:auto;padding:10px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:13px;margin-bottom:9px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:43px;padding:8px;font:inherit}.btn.on{background:#12351f;border-color:#2d7b46}.song{font-size:21px;font-weight:900}.small{font-size:12px;color:#aaa}.ok{color:#6ee787}.warn{color:#ff7b72}.blue{color:#58a6ff;font-weight:800}.state.on{color:#6ee787;font-weight:900}.state.off{color:#ff7b72;font-weight:900}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{border:1px solid #333;border-radius:12px;padding:10px;min-height:135px}.chord{text-align:center;font-size:25px;font-weight:900}.root{text-align:center;color:#58a6ff;font-size:12px;font-weight:800}.degs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}.d{font-size:22px;font-weight:850;color:#555;min-width:40px;text-align:center}.d.now{color:#168bff}.d.ok{color:#fff}.detect{text-align:center;margin-top:14px;font-size:17px}.meter,.prog{height:8px;background:#222;border-radius:9px;overflow:hidden;margin-top:9px}.meter div{height:100%;background:#888}.prog div{height:100%;background:#fff}.nav{display:flex;gap:6px;margin-top:10px}.nav button{flex:1}</style></head><body><div class="app"><div class="p"><div class="row"><div class="song">Track 02 度数テスト <span class="blue">v7</span></div><button id="inputBtn" class="btn" style="margin-left:auto">入力を開始</button></div><select id="device" style="width:100%;margin-top:8px" disabled><option>入力開始後に取得</option></select><div class="small">入力状態：<span id="inputState" class="state off">OFF</span> ／ 使用中：<b id="activeDevice">—</b></div><div class="row" style="margin-top:10px"><select id="refNote"><option value="130.8128">C3（5弦3F）</option><option value="82.4069">E2（6弦開放）</option><option value="110">A2（5弦開放）</option><option value="146.8324">D3（4弦開放）</option><option value="195.9977">G3（3弦開放）</option><option value="246.9417">B3（2弦開放）</option><option value="329.6276">E4（1弦開放）</option></select><button id="calBtn" class="btn">安定値で補正</button><button id="clearBtn" class="btn">解除</button></div><div class="small">生Hz：<span id="rawHz" class="blue">—</span> ／ 安定Hz：<span id="stableHz" class="blue">—</span> ／ 補正：<span id="calVal" class="blue">0 cent</span></div><div id="calMsg" class="small">C3なら5弦3Fを1秒ほど伸ばしてから補正。</div></div><div class="p"><div id="pageInfo" class="small" style="text-align:center"></div><div class="bars"><div class="bar"><div id="barNo1" class="small"></div><div id="chord1" class="chord"></div><div id="root1" class="root"></div><div id="deg1" class="degs"></div></div><div class="bar"><div id="barNo2" class="small"></div><div id="chord2" class="chord"></div><div id="root2" class="root"></div><div id="deg2" class="degs"></div></div></div><div class="detect">検出：<b id="note">—</b>　Chord:<b id="degreeNow">—</b></div><div class="meter"><div id="level" style="width:0"></div></div><div id="diag" class="small" style="text-align:center;margin-top:6px">入力OFF</div><div class="prog"><div id="progress" style="width:0"></div></div><div class="nav"><button id="prevBtn" class="btn">← 前</button><button id="retryBtn" class="btn">やり直し</button><button id="nextBtn" class="btn">次 →</button></div></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id);const N=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];const D=['R','m2','△2','m3','△3','P4','♭5','P5','m6','△6','m7','△7'];const CH=['CMaj7','A7(E♭m7)','Dm7','G7(D♭m7)','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7(FMaj7♯5)','G7','CMaj7(G)','A7','Dm7','G7','CMaj7','A7(E♭)','Dm7','G7(D♭dim7)'];const TAB=[[[1,10],[1,7],[2,8],[3,9]],[[3,8],[2,7],[1,6],[1,9]],[[1,8],[1,5],[2,6],[3,7]],[[3,6],[2,5],[1,4],[1,7]],[[1,8],[1,7],[2,8],[2,6]],[[2,5],[3,7],[3,6],[2,5]],[[3,7],[2,5],[2,6],[2,8]],[[2,9],[2,7],[2,8],[2,6]],[[2,5],[2,6],[2,7],[1,5]],[[2,8],[2,6],[3,8],[3,6]],[[3,7],[4,7],[3,5],[4,7]],[[3,4],[4,7],[4,6],[4,4]],[[4,5],[5,8],[5,7],[5,5]],[[5,4],[5,6],[5,7],[4,5]],[[5,8],[4,7],[3,6],[2,5]],[[3,7],[2,6],[2,9],[2,7]],[[2,8],[1,7],[1,10],[1,8]],[[1,9],[1,6],[1,5],[2,8]],[[2,6],[1,5],[1,8],[1,6]],[[1,7],[2,9],[2,8],[3,10]],[[3,9],[2,8],[1,7],[2,10]],[[1,6],[2,8],[2,6],[3,8]],[[3,7],[2,6],[1,5],[1,8]],[[1,9],[2,8],[1,6],[1,9]]];const OPEN=[0,4,9,2,7,11,4];function rootPc(s){const m=s.match(/^([A-G])([♯#♭b]?)/);let p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='♯'||m[2]==='#')p++;if(m[2]==='♭'||m[2]==='b')p--;return(p+12)%12}function altRootPc(s){const m=s.match(/\(([A-G])([♯#♭b]?)/);if(!m)return null;let p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='♯'||m[2]==='#')p++;if(m[2]==='♭'||m[2]==='b')p--;return(p+12)%12}const BARS=TAB.map((bar,i)=>bar.map(([s,f])=>{const pc=(OPEN[s]+f)%12,r=rootPc(CH[i]),a=altRootPc(CH[i]),main=D[(pc-r+12)%12];return{pc,label:a===null?main:main+'('+D[(pc-a+12)%12]+')'}}));let pageIndex=0,seq=[],split=0,index=0,ctx=null,analyser=null,stream=null,buf=null,raf=0,match=0,armed=true,lastPc=-1,recent=[],calCents=0;try{calCents=Number(localStorage.getItem('guitarPitchCalCentsV6')||0)}catch(e){}const e={inputBtn:$('inputBtn'),device:$('device'),inputState:$('inputState'),active:$('activeDevice'),ref:$('refNote'),calBtn:$('calBtn'),clearBtn:$('clearBtn'),raw:$('rawHz'),stable:$('stableHz'),calVal:$('calVal'),calMsg:$('calMsg'),page:$('pageInfo'),barNo1:$('barNo1'),barNo2:$('barNo2'),chord1:$('chord1'),chord2:$('chord2'),root1:$('root1'),root2:$('root2'),deg1:$('deg1'),deg2:$('deg2'),note:$('note'),degreeNow:$('degreeNow'),level:$('level'),diag:$('diag'),progress:$('progress'),prev:$('prevBtn'),retry:$('retryBtn'),next:$('nextBtn')};function showCal(){e.calVal.textContent=(calCents>=0?'+':'')+Math.round(calCents)+' cent'}function renderPage(){const a=BARS[pageIndex*2]||[],b=BARS[pageIndex*2+1]||[];seq=[...a,...b];split=a.length;index=0;match=0;armed=true;e.page.textContent=(pageIndex*2+1)+'–'+Math.min(pageIndex*2+2,BARS.length)+'小節 ／ 全24小節';e.barNo1.textContent=(pageIndex*2+1)+'小節目';e.barNo2.textContent=(pageIndex*2+2)+'小節目';e.chord1.textContent=CH[pageIndex*2]||'—';e.chord2.textContent=CH[pageIndex*2+1]||'—';e.root1.textContent='R = '+N[rootPc(CH[pageIndex*2])];e.root2.textContent='R = '+N[rootPc(CH[pageIndex*2+1])];draw()}function draw(){e.deg1.innerHTML='';e.deg2.innerHTML='';seq.forEach((x,i)=>{const s=document.createElement('span');s.className='d'+(i<index?' ok':i===index?' now':'');s.textContent=x.label;(i<split?e.deg1:e.deg2).appendChild(s)});e.progress.style.width=((pageIndex*8+index)/(BARS.length*4)*100)+'%';if(index>=seq.length&&(pageIndex+1)*2<BARS.length){pageIndex++;renderPage();return}e.prev.disabled=pageIndex===0;e.next.disabled=(pageIndex+1)*2>=BARS.length}function currentBar(){return index<split?pageIndex*2:pageIndex*2+1}function accept(pc){if(index>=seq.length||!armed)return;if(pc===seq[index].pc){if(++match>=4){index++;match=0;armed=false;draw()}}else match=0}function yin(x,sr){const n=x.length;let mean=0;for(let v of x)mean+=v;mean/=n;let rms=0,y=new Float32Array(n);for(let i=0;i<n;i++){y[i]=x[i]-mean;rms+=y[i]*y[i]}rms=Math.sqrt(rms/n);if(rms<.0004)return{f:-1,r:rms,p:0};const mn=Math.floor(sr/1400),mx=Math.min(Math.floor(sr/75),n>>1),d=new Float32Array(mx+1),c=new Float32Array(mx+1);for(let t=1;t<=mx;t++){let s=0;for(let i=0;i<n-t;i++){const q=y[i]-y[i+t];s+=q*q}d[t]=s}let run=0,best=-1,bv=1;for(let t=1;t<=mx;t++){run+=d[t];c[t]=run?d[t]*t/run:1;if(t>=mn&&c[t]<.18){while(t+1<=mx&&c[t+1]<c[t])t++;best=t;bv=c[t];break}if(t>=mn&&c[t]<bv){best=t;bv=c[t]}}if(best<0||bv>.45)return{f:-1,r:rms,p:1-bv};let tau=best;if(best>1&&best<mx){const a=c[best-1],z=c[best+1],den=a+z-2*c[best];if(Math.abs(den)>1e-9)tau=best+(a-z)/(2*den)}return{f:sr/tau,r:rms,p:1-bv}}function stableFor(target){const now=performance.now(),arr=recent.filter(x=>now-x.t<1600&&x.p>.45).map(x=>x.f);let use=arr.filter(f=>Math.abs(1200*Math.log2(f/target))<=100);if(use.length<2)return null;use.sort((a,b)=>a-b);return use[Math.floor(use.length/2)]}function loop(){if(!analyser)return;analyser.getFloatTimeDomainData(buf);const p=yin(buf,ctx.sampleRate),pct=Math.min(100,p.r*2500);e.level.style.width=pct+'%';if(p.r<.001){armed=true;lastPc=-1;match=0}if(p.f>75&&p.f<1400){const now=performance.now();recent.push({t:now,f:p.f,p:p.p});recent=recent.filter(x=>now-x.t<1800);e.raw.textContent=p.f.toFixed(1);const sv=stableFor(+e.ref.value);e.stable.textContent=sv?sv.toFixed(1):'—';const f=p.f*Math.pow(2,calCents/1200),m=69+12*Math.log2(f/440),mr=Math.round(m),pc=(mr%12+12)%12,cent=Math.round(100*(m-mr));e.note.textContent=N[pc];const bi=currentBar(),r=rootPc(CH[bi]),a=altRootPc(CH[bi]);e.degreeNow.textContent=D[(pc-r+12)%12]+(a===null?'':'('+D[(pc-a+12)%12]+')');e.diag.textContent='補正後 '+f.toFixed(1)+'Hz ／ '+cent+' cent ／ 信頼 '+Math.round(p.p*100)+'%';if(!armed&&lastPc!==-1&&pc!==lastPc)armed=true;lastPc=pc;if(p.p>.5&&Math.abs(cent)<48)accept(pc)}else e.diag.textContent='入力 '+pct.toFixed(0)+'% ／ 検出待ち';raf=requestAnimationFrame(loop)}async function listDevices(id){const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');e.device.innerHTML='';ds.forEach((d,i)=>e.device.add(new Option(d.label||'入力 '+(i+1),d.deviceId)));e.device.disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))e.device.value=id}async function openInput(id){if(stream)stream.getTracks().forEach(t=>t.stop());const audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});const tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};e.active.textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();const src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=4096;buf=new Float32Array(analyser.fftSize);src.connect(analyser);recent=[];cancelAnimationFrame(raf);loop();await listDevices(set.deviceId||id||'');e.inputBtn.textContent='入力を停止';e.inputBtn.classList.add('on');e.inputState.textContent='ON';e.inputState.className='state on'}function stopInput(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;analyser=null;if(ctx){ctx.close();ctx=null}recent=[];e.raw.textContent='—';e.stable.textContent='—';e.note.textContent='—';e.degreeNow.textContent='—';e.diag.textContent='入力OFF';e.level.style.width='0';e.active.textContent='—';e.inputBtn.textContent='入力を開始';e.inputBtn.classList.remove('on');e.inputState.textContent='OFF';e.inputState.className='state off'}e.inputBtn.onclick=async()=>{if(stream){stopInput();return}try{await openInput('')}catch(err){e.inputState.textContent='ERROR';e.calMsg.textContent='入力エラー：'+err.message;e.calMsg.className='small warn'}};e.device.onchange=()=>openInput(e.device.value);e.calBtn.onclick=()=>{if(!stream){e.calMsg.textContent='入力がOFFです。';e.calMsg.className='small warn';return}const target=+e.ref.value,sv=stableFor(target);if(!sv){e.calMsg.textContent='安定Hzが出るまで基準音を1秒ほど伸ばしてください。';e.calMsg.className='small warn';return}const cents=1200*Math.log2(target/sv);if(Math.abs(cents)>100){e.calMsg.textContent='基準音から離れすぎています。';e.calMsg.className='small warn';return}calCents=cents;try{localStorage.setItem('guitarPitchCalCentsV6',String(calCents))}catch(err){}showCal();e.calMsg.textContent='✓ 補正完了：安定 '+sv.toFixed(1)+'Hz → '+target.toFixed(1)+'Hz（'+Math.round(calCents)+' cent）';e.calMsg.className='small ok'};e.clearBtn.onclick=()=>{calCents=0;try{localStorage.removeItem('guitarPitchCalCentsV6')}catch(err){}showCal();e.calMsg.textContent='補正を解除しました';e.calMsg.className='small'};e.retry.onclick=renderPage;e.prev.onclick=()=>{if(pageIndex){pageIndex--;renderPage()}};e.next.onclick=()=>{if((pageIndex+1)*2<BARS.length){pageIndex++;renderPage()}};showCal();renderPage()})();</script></body></html>
