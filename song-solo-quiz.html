<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>曲ソロ・度数クイズ</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:800px;margin:auto;padding:10px}.panel{background:#0c0c0c;border:1px solid #303030;border-radius:16px;padding:14px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ctl{min-height:44px;border:1px solid #444;background:#171717;color:#fff;border-radius:10px;padding:0 12px;font:inherit}.ctl.on{background:#fff;color:#000}.field{display:flex;flex-direction:column;gap:4px}.field span,.small{font-size:12px;color:#aaa}.wide{width:100%}.wide select,.wide input{width:100%}.song{font-size:22px;font-weight:900}.page{text-align:center;color:#aaa;font-size:12px}.root{text-align:center;font-size:58px;font-weight:900}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{border:1px solid #333;border-radius:12px;padding:10px;min-height:105px}.barTitle{font-size:12px;color:#888}.degrees{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px}.deg{font-size:27px;font-weight:850;color:#555;min-width:32px;text-align:center}.deg.current{color:#168bff;transform:scale(1.15)}.deg.done{color:#fff}.detect{text-align:center;font-size:17px;margin-top:14px}.meter,.progress{height:8px;background:#222;border-radius:999px;overflow:hidden;margin-top:10px}.meter>div{height:100%;background:#888;width:0}.progress>div{height:100%;background:#fff;width:0}.status{text-align:center;color:#aaa;font-size:12px;margin-top:7px}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.nav button{flex:1}.clear{font-size:25px;font-weight:900;text-align:center;margin-top:10px;display:none}.clear.show{display:block}.calval{color:#58a6ff;font-weight:800}.editor textarea{width:100%;min-height:110px;background:#151515;color:#fff;border:1px solid #444;border-radius:10px;padding:10px;font:14px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5}.editor input{background:#151515;color:#fff;border:1px solid #444;border-radius:10px;padding:0 10px;min-height:44px}.editorGrid{display:grid;grid-template-columns:2fr 1fr;gap:8px}.hint{font-size:11px;color:#888;line-height:1.5;margin-top:6px}@media(max-width:560px){.app{padding:7px}.panel{padding:11px}.root{font-size:48px}.deg{font-size:24px;min-width:28px}.degrees{gap:6px}.bars{gap:6px}.song{font-size:19px}}</style></head><body><div class="app"><div class="panel"><div class="row"><div class="song" id="songTitle">ソロ練習 1</div><button id="inputBtn" class="ctl" style="margin-left:auto">ギター入力 ON</button></div><label class="field wide" style="margin-top:8px"><span>入力デバイス</span><select id="device" class="ctl" disabled><option>入力ON後に取得</option></select></label><div class="small">使用中：<b id="active">—</b>　<span id="inputStatus">入力OFF</span>　／ 補正 <span id="calValue" class="calval">0 cent</span></div></div><div class="panel"><div class="page" id="pageLabel">1–2小節</div><div class="root" id="rootBig">C</div><div class="page">KEY / ROOT</div><div class="bars"><div class="bar"><div class="barTitle" id="barTitle1">1小節目</div><div id="bar1" class="degrees"></div></div><div class="bar"><div class="barTitle" id="barTitle2">2小節目</div><div id="bar2" class="degrees"></div></div></div><div class="detect">検出：<b id="detNote">—</b> <span id="detFreq">— Hz</span> <span id="detDeg">—</span></div><div class="meter"><div id="level"></div></div><div id="diag" class="status">入力レベル 0%</div><div class="progress"><div id="progress"></div></div><div id="clear" class="clear">2小節クリア ✓</div><div class="nav"><button id="prev" class="ctl">← 前の2小節</button><button id="retry" class="ctl">この2小節を最初から</button><button id="next" class="ctl">次の2小節 →</button></div></div><div class="panel editor"><div style="font-weight:800;margin-bottom:8px">曲データ編集</div><div class="editorGrid"><label class="field"><span>曲名</span><input id="titleInput" value="ソロ練習 1"></label><label class="field"><span>Key / Root</span><select id="root"></select></label></div><label class="field" style="margin-top:8px"><span>度数データ：1行＝1小節</span><textarea id="data">R △2 △3 P5
△6 P5 △3 R
R m3 P4 P5
m7 P5 P4 m3
R △3 P5 △7
△6 P5 △3 △2</textarea></label><button id="apply" class="ctl" style="margin-top:8px">曲データを反映</button><div class="hint">2小節ずつ表示します。使える度数：R m2 △2 m3 △3 P4 ♭5 P5 m6 △6 m7 △7。ここへ自分で分析した曲の度数列を貼り付ければ、そのまま曲ソロクイズになります。</div></div></div><script>(()=>{'use strict';const N=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],D=['R','m2','△2','m3','△3','P4','♭5','P5','m6','△6','m7','△7'],M={'R':0,'m2':1,'△2':2,'m3':3,'△3':4,'P4':5,'♭5':6,'b5':6,'P5':7,'m6':8,'△6':9,'m7':10,'△7':11},$=x=>document.getElementById(x),root=$('root');N.forEach((n,i)=>root.add(new Option(n,i)));let bars=[],page=0,seq=[],split=0,index=0,ctx,analyser,stream,buf,raf=0,match=0,armed=true,lastPc=-1;let cal=0;try{cal=Number(localStorage.getItem('guitarPitchCalCentsV3')||0)}catch(e){}$('calValue').textContent=(cal>=0?'+':'')+Math.round(cal)+' cent';function apply(){const lines=$('data').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),out=[];for(const line of lines){const a=line.split(/\s+/).filter(Boolean);if(a.some(x=>M[x]===undefined)){alert('使えない度数記号があります：'+line);return}out.push(a.map(x=>({label:x,semi:M[x]})))}bars=out;$('songTitle').textContent=$('titleInput').value||'ソロ練習';page=0;loadPage()}function loadPage(){const a=bars[page*2]||[],b=bars[page*2+1]||[];seq=[...a,...b];split=a.length;index=0;match=0;armed=true;$('pageLabel').textContent=(page*2+1)+'–'+Math.min(page*2+2,bars.length)+'小節';$('barTitle1').textContent=(page*2+1)+'小節目';$('barTitle2').textContent=(page*2+2)+'小節目';$('rootBig').textContent=N[+root.value];draw()}function draw(){for(const id of ['bar1','bar2'])$(id).innerHTML='';seq.forEach((x,i)=>{const s=document.createElement('span');s.className='deg'+(i<index?' done':i===index?' current':'');s.textContent=x.label;$(i<split?'bar1':'bar2').appendChild(s)});$('progress').style.width=(seq.length?index/seq.length*100:0)+'%';$('clear').classList.toggle('show',seq.length>0&&index>=seq.length);$('prev').disabled=page<=0;$('next').disabled=(page+1)*2>=bars.length}function accept(pc){if(index>=seq.length||!armed)return;const target=(+root.value+seq[index].semi)%12;if(pc===target){if(++match>=4){index++;match=0;armed=false;draw()}}else match=0}function yin(x,sr){const n=x.length;let mean=0;for(let v of x)mean+=v;mean/=n;let rms=0,y=new Float32Array(n);for(let i=0;i<n;i++){y[i]=x[i]-mean;rms+=y[i]*y[i]}rms=Math.sqrt(rms/n);if(rms<.0005)return{f:-1,r:rms,p:0};const min=Math.floor(sr/1400),max=Math.min(Math.floor(sr/75),n>>1),d=new Float32Array(max+1),c=new Float32Array(max+1);for(let t=1;t<=max;t++){let s=0;for(let i=0;i<n-t;i++){const q=y[i]-y[i+t];s+=q*q}d[t]=s}let run=0,best=-1,bv=1;for(let t=1;t<=max;t++){run+=d[t];c[t]=run?d[t]*t/run:1;if(t>=min&&c[t]<.18){while(t+1<=max&&c[t+1]<c[t])t++;best=t;bv=c[t];break}if(t>=min&&c[t]<bv){best=t;bv=c[t]}}if(best<0||bv>.4)return{f:-1,r:rms,p:1-bv};let tau=best;if(best>1&&best<max){const a=c[best-1],b=c[best],z=c[best+1],den=a+z-2*b;if(Math.abs(den)>1e-9)tau=best+(a-z)/(2*den)}return{f:sr/tau,r:rms,p:1-bv}}function loop(){if(!analyser)return;analyser.getFloatTimeDomainData(buf);const p=yin(buf,ctx.sampleRate),pct=Math.min(100,p.r*2500);$('level').style.width=pct+'%';if(p.r<.0012){armed=true;lastPc=-1;match=0}if(p.f>75&&p.f<1400){const f=p.f*Math.pow(2,cal/1200),m=69+12*Math.log2(f/440),mr=Math.round(m),pc=(mr%12+12)%12,cent=Math.round(100*(m-mr));$('detNote').textContent=N[pc];$('detFreq').textContent=f.toFixed(1)+' Hz';$('detDeg').textContent=D[(pc-root.value+12)%12];$('diag').textContent='入力 '+pct.toFixed(0)+'% ／ 信頼 '+Math.round(p.p*100)+'% ／ '+cent+' cent';if(!armed&&lastPc!==-1&&pc!==lastPc)armed=true;lastPc=pc;if(p.p>.55&&Math.abs(cent)<48)accept(pc)}else $('diag').textContent='入力 '+pct.toFixed(0)+'% ／ 検出待ち';raf=requestAnimationFrame(loop)}async function list(id){const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('device').innerHTML='';ds.forEach((d,i)=>$('device').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('device').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('device').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());const audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});const tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();const src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=4096;buf=new Float32Array(analyser.fftSize);src.connect(analyser);cancelAnimationFrame(raf);loop();await list(set.deviceId||id||'')}async function toggle(){if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;analyser=null;if(ctx){await ctx.close();ctx=null}$('inputBtn').textContent='ギター入力 ON';$('inputBtn').classList.remove('on');$('inputStatus').textContent='入力OFF';return}try{await open('');$('inputBtn').textContent='ギター入力 OFF';$('inputBtn').classList.add('on');$('inputStatus').textContent='入力中'}catch(e){$('inputStatus').textContent='入力エラー '+e.message}}$('inputBtn').onclick=toggle;$('device').onchange=()=>open($('device').value);$('retry').onclick=loadPage;$('prev').onclick=()=>{if(page>0){page--;loadPage()}};$('next').onclick=()=>{if((page+1)*2<bars.length){page++;loadPage()}};$('apply').onclick=apply;root.onchange=loadPage;apply()})();</script></body></html>
