<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Track 02 v5</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:800px;margin:auto;padding:10px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:13px;margin-bottom:9px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:43px;padding:8px;font:inherit}.song{font-size:21px;font-weight:900}.small{font-size:12px;color:#aaa}.ok{color:#6ee787}.warn{color:#ff7b72}.blue{color:#58a6ff;font-weight:800}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{border:1px solid #333;border-radius:12px;padding:10px;min-height:135px}.chord{text-align:center;font-size:25px;font-weight:900}.root{text-align:center;color:#58a6ff;font-size:12px;font-weight:800}.degs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}.d{font-size:22px;font-weight:850;color:#555;min-width:40px;text-align:center}.d.now{color:#168bff}.d.ok{color:#fff}.detect{text-align:center;margin-top:14px;font-size:17px}.meter,.prog{height:8px;background:#222;border-radius:9px;overflow:hidden;margin-top:9px}.meter div{height:100%;background:#888}.prog div{height:100%;background:#fff}.nav{display:flex;gap:6px;margin-top:10px}.nav button{flex:1}</style></head><body><div class="app"><div class="p"><div class="row"><div class="song">Track 02 度数テスト v5</div><button id="on" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:8px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ <span id="st">入力OFF</span></div><div class="row" style="margin-top:10px"><select id="ref"><option value="130.8128">C3（5弦3F）</option><option value="82.4069">E2（6弦開放）</option><option value="110">A2（5弦開放）</option><option value="146.8324">D3（4弦開放）</option><option value="195.9977">G3（3弦開放）</option><option value="246.9417">B3（2弦開放）</option><option value="329.6276">E4（1弦開放）</option></select><button id="cal" class="btn">1.5秒で自動補正</button><button id="clear" class="btn">解除</button></div><div class="small">生Hz：<span id="rawHz" class="blue">—</span> ／ 補正：<span id="calVal" class="blue">0 cent</span></div><div id="calMsg" class="small">C3なら5弦3Fを鳴らし続けてから「1.5秒で自動補正」。</div></div><div class="p"><div id="page" class="small" style="text-align:center"></div><div class="bars"><div class="bar"><div id="bn1" class="small"></div><div id="c1" class="chord"></div><div id="r1" class="root"></div><div id="d1" class="degs"></div></div><div class="bar"><div id="bn2" class="small"></div><div id="c2" class="chord"></div><div id="r2" class="root"></div><div id="d2" class="degs"></div></div></div><div class="detect">検出：<b id="note">—</b>　Chord:<b id="deg">—</b></div><div class="meter"><div id="level" style="width:0"></div></div><div id="diag" class="small" style="text-align:center;margin-top:6px">入力待ち</div><div class="prog"><div id="prog" style="width:0"></div></div><div class="nav"><button id="prev" class="btn">← 前</button><button id="retry" class="btn">やり直し</button><button id="next" class="btn">次 →</button></div></div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),N=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],D=['R','m2','△2','m3','△3','P4','♭5','P5','m6','△6','m7','△7'];const CH=['CMaj7','A7(E♭m7)','Dm7','G7(D♭m7)','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7(FMaj7♯5)','G7','CMaj7(G)','A7','Dm7','G7','CMaj7','A7(E♭)','Dm7','G7(D♭dim7)'];const TAB=[[[1,10],[1,7],[2,8],[3,9]],[[3,8],[2,7],[1,6],[1,9]],[[1,8],[1,5],[2,6],[3,7]],[[3,6],[2,5],[1,4],[1,7]],[[1,8],[1,7],[2,8],[2,6]],[[2,5],[3,7],[3,6],[2,5]],[[3,7],[2,5],[2,6],[2,8]],[[2,9],[2,7],[2,8],[2,6]],[[2,5],[2,6],[2,7],[1,5]],[[2,8],[2,6],[3,8],[3,6]],[[3,7],[4,7],[3,5],[4,7]],[[3,4],[4,7],[4,6],[4,4]],[[4,5],[5,8],[5,7],[5,5]],[[5,4],[5,6],[5,7],[4,5]],[[5,8],[4,7],[3,6],[2,5]],[[3,7],[2,6],[2,9],[2,7]],[[2,8],[1,7],[1,10],[1,8]],[[1,9],[1,6],[1,5],[2,8]],[[2,6],[1,5],[1,8],[1,6]],[[1,7],[2,9],[2,8],[3,10]],[[3,9],[2,8],[1,7],[2,10]],[[1,6],[2,8],[2,6],[3,8]],[[3,7],[2,6],[1,5],[1,8]],[[1,9],[2,8],[1,6],[1,9]]],OPEN=[0,4,9,2,7,11,4];function rp(s){let m=s.match(/^([A-G])([♯#♭b]?)/),p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]=='♯'||m[2]=='#')p++;if(m[2]=='♭'||m[2]=='b')p--;return(p+12)%12}function ap(s){let m=s.match(/\(([A-G])([♯#♭b]?)/);if(!m)return null;let p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]=='♯'||m[2]=='#')p++;if(m[2]=='♭'||m[2]=='b')p--;return(p+12)%12}const B=TAB.map((bar,i)=>bar.map(([s,f])=>{let pc=(OPEN[s]+f)%12,r=rp(CH[i]),a=ap(CH[i]),x=D[(pc-r+12)%12];return{pc,l:a==null?x:x+'('+D[(pc-a+12)%12]+')'}}));let page=0,seq=[],split=0,idx=0,ctx,an,stream,buf,raf=0,match=0,armed=true,lastPc=-1,calC=0,calibrating=false,samples=[];try{calC=Number(localStorage.getItem('guitarPitchCalCentsV5')||localStorage.getItem('guitarPitchCalCentsV3')||0)}catch(e){}function showCal(){calVal.textContent=(calC>=0?'+':'')+Math.round(calC)+' cent'}showCal();function load(){let a=B[page*2]||[],b=B[page*2+1]||[];seq=[...a,...b];split=a.length;idx=0;match=0;armed=true;pageEl();draw()}function pageEl(){page.textContent=(page*2+1)+'–'+Math.min(page*2+2,B.length)+'小節 ／ 全24小節';bn1.textContent=(page*2+1)+'小節目';bn2.textContent=(page*2+2)+'小節目';c1.textContent=CH[page*2]||'—';c2.textContent=CH[page*2+1]||'—';r1.textContent=CH[page*2]?'R = '+N[rp(CH[page*2])]:' ';r2.textContent=CH[page*2+1]?'R = '+N[rp(CH[page*2+1])]:' '}function draw(){d1.innerHTML='';d2.innerHTML='';seq.forEach((x,i)=>{let s=document.createElement('span');s.className='d'+(i<idx?' ok':i===idx?' now':'');s.textContent=x.l;(i<split?d1:d2).appendChild(s)});prog.style.width=((page*8+idx)/(B.length*4)*100)+'%';if(idx>=seq.length&&(page+1)*2<B.length){page++;load();return}prev.disabled=page===0;next.disabled=(page+1)*2>=B.length}function curBar(){return idx<split?page*2:page*2+1}function accept(pc){if(idx>=seq.length||!armed||calibrating)return;if(pc===seq[idx].pc){if(++match>=4){idx++;match=0;armed=false;draw()}}else match=0}function yin(x,sr){let n=x.length,m=0;for(let v of x)m+=v;m/=n;let rms=0,y=new Float32Array(n);for(let i=0;i<n;i++){y[i]=x[i]-m;rms+=y[i]*y[i]}rms=Math.sqrt(rms/n);if(rms<.0005)return{f:-1,r:rms,p:0};let mn=Math.floor(sr/1400),mx=Math.min(Math.floor(sr/75),n>>1),d=new Float32Array(mx+1),c=new Float32Array(mx+1);for(let t=1;t<=mx;t++){let s=0;for(let i=0;i<n-t;i++){let q=y[i]-y[i+t];s+=q*q}d[t]=s}let run=0,b=-1,bv=1;for(let t=1;t<=mx;t++){run+=d[t];c[t]=run?d[t]*t/run:1;if(t>=mn&&c[t]<.18){while(t+1<=mx&&c[t+1]<c[t])t++;b=t;bv=c[t];break}if(t>=mn&&c[t]<bv){b=t;bv=c[t]}}if(b<0||bv>.4)return{f:-1,r:rms,p:1-bv};return{f:sr/b,r:rms,p:1-bv}}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let p=yin(buf,ctx.sampleRate),pct=Math.min(100,p.r*2500);level.style.width=pct+'%';if(p.r<.0012){armed=true;lastPc=-1;match=0}if(p.f>75&&p.f<1400){rawHz.textContent=p.f.toFixed(1);if(calibrating&&p.p>.55&&p.r>.001)samples.push(p.f);let f=p.f*Math.pow(2,calC/1200),m=69+12*Math.log2(f/440),mr=Math.round(m),pc=(mr%12+12)%12,cent=Math.round(100*(m-mr));note.textContent=N[pc];let bi=curBar(),r=rp(CH[bi]),a=ap(CH[bi]);deg.textContent=D[(pc-r+12)%12]+(a==null?'':'('+D[(pc-a+12)%12]+')');diag.textContent='補正後 '+f.toFixed(1)+'Hz ／ '+cent+' cent ／ 信頼 '+Math.round(p.p*100)+'%';if(!armed&&lastPc!==-1&&pc!==lastPc)armed=true;lastPc=pc;if(p.p>.55&&Math.abs(cent)<48)accept(pc)}else diag.textContent='入力 '+pct.toFixed(0)+'% ／ 検出待ち';raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');dev.innerHTML='';ds.forEach((d,i)=>dev.add(new Option(d.label||'入力 '+(i+1),d.deviceId)));dev.disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))dev.value=id}async function openInput(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};active.textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);loop();await list(set.deviceId||id||'')}on.onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}on.textContent='ギター入力 ON';st.textContent='入力OFF'}else try{await openInput('');on.textContent='ギター入力 OFF';st.textContent='入力中'}catch(e){st.textContent='入力エラー '+e.message}};dev.onchange=()=>openInput(dev.value);cal.onclick=async()=>{if(!stream){calMsg.textContent='先にギター入力をONにしてください。';calMsg.className='small warn';return}samples=[];calibrating=true;calMsg.textContent='測定中…同じ音を1.5秒伸ばしてください';calMsg.className='small';await new Promise(r=>setTimeout(r,1500));calibrating=false;if(samples.length<10){calMsg.textContent='測定不足。音量を少し上げ、基準音を伸ばしてもう一度。';calMsg.className='small warn';return}let target=+ref.value;let norm=samples.map(f=>{let x=f;while(x<target/1.5)x*=2;while(x>target*1.5)x/=2;return x}).filter(f=>f>target*.75&&f<target*1.25);if(norm.length<8){calMsg.textContent='基準音以外を多く検出しました。C3なら5弦3Fを単音で弾いてください。';calMsg.className='small warn';return}norm.sort((a,b)=>a-b);let lo=Math.floor(norm.length*.2),hi=Math.ceil(norm.length*.8),mid=norm.slice(lo,hi),med=mid[Math.floor(mid.length/2)],spread=(mid[mid.length-1]-mid[0])/med;if(spread>.08){calMsg.textContent='音程が安定していません。弾いた直後0.2秒待ってから補正を押してください。';calMsg.className='small warn';return}calC=1200*Math.log2(target/med);if(Math.abs(calC)>300){calMsg.textContent='補正量が大きすぎます（'+Math.round(calC)+' cent）。基準音を確認してください。';calMsg.className='small warn';return}try{localStorage.setItem('guitarPitchCalCentsV5',String(calC));localStorage.setItem('guitarPitchCalCentsV3',String(calC))}catch(e){}showCal();calMsg.textContent='✓ 補正完了：生 '+med.toFixed(1)+'Hz → '+target.toFixed(1)+'Hz（'+Math.round(calC)+' cent）';calMsg.className='small ok'};clear.onclick=()=>{calC=0;try{localStorage.removeItem('guitarPitchCalCentsV5');localStorage.removeItem('guitarPitchCalCentsV3')}catch(e){}showCal();calMsg.textContent='補正を解除しました';calMsg.className='small'};retry.onclick=load;prev.onclick=()=>{if(page){page--;load()}};next.onclick=()=>{if((page+1)*2<B.length){page++;load()}};load()})();</script></body></html>
