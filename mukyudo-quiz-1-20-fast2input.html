<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>無窮動 Track 01-20</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:820px;margin:auto;padding:9px}
.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:12px;margin-bottom:9px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:42px;padding:8px;font:inherit}
.btn{font-weight:750}
.song{font-size:20px;font-weight:900}
.small{font-size:12px;color:#aaa}
.key{text-align:center;font-size:46px;font-weight:900;line-height:1}
.trackSel{min-width:125px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px}
.tab{background:#111;color:#aaa;border:1px solid #333;border-radius:12px;padding:12px 6px;font-weight:850;font-size:16px}
.tab.active{background:#242424;color:#fff;border-color:#666}
.view{display:none}.view.active{display:block}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bar{border:1px solid #333;border-radius:12px;padding:10px;min-height:134px}
.chord{text-align:center;font-size:25px;font-weight:900;margin:4px}
.degs{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.d{font-size:25px;font-weight:850;color:#555;min-width:32px;text-align:center}
.d.now{color:#168bff;transform:scale(1.15)}
.d.ok{color:#fff}
.kind{font-size:10px;display:block;color:#888;margin-top:2px}
.d.now .kind{color:#65b7ff}.d.ok .kind{color:#ccc}
.detect{text-align:center;margin-top:14px;font-size:18px}
.meter{height:10px;background:#222;border-radius:9px;overflow:hidden;margin-top:9px}
.meter div{height:100%;background:#aaa}
.nav{display:flex;gap:6px;margin-top:10px}.nav button{flex:1}
.setting-title{font-size:15px;font-weight:850;margin-bottom:8px}
.statusbox{background:#080808;border:1px solid #2c2c2c;border-radius:10px;padding:10px;margin-top:10px;line-height:1.55}
@media(max-width:560px){.d{font-size:22px}.key{font-size:40px}.bar{padding:8px}.song{font-size:17px}}
</style>
</head>
<body>
<div class="app">
  <div class="p">
    <div class="row">
      <div class="song">無窮動 Track 01–20</div>
      <select id="track" class="trackSel"></select>
      <div class="small" style="margin-left:auto">MPM FAST2</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="practice">練習</button>
    <button class="tab" data-view="training">トレーニング</button>
    <button class="tab" data-view="settings">設定</button>
  </div>

  <section id="practice" class="view active">
    <div class="p">
      <div id="pgP" class="small" style="text-align:center"></div>
      <div id="keyP" class="key">C</div>
      <div class="small" style="text-align:center;margin-top:5px">コードRoot基準。コードトーンはコード内の度数、非コードトーンは9/11/13系で表示。</div>
      <div class="bars">
        <div class="bar"><div id="bt1P" class="small"></div><div id="c1P" class="chord">—</div><div id="b1P" class="degs"></div></div>
        <div class="bar"><div id="bt2P" class="small"></div><div id="c2P" class="chord">—</div><div id="b2P" class="degs"></div></div>
      </div>
      <div class="detect">検出：<b id="noteP">—</b>　Chord:<b id="cdP">—</b></div>
      <div class="nav">
        <button id="prevP" class="btn">← 前</button><button id="retryP" class="btn">やり直し</button><button id="nextP" class="btn">次 →</button>
      </div>
    </div>
  </section>

  <section id="training" class="view">
    <div class="p">
      <div id="pgT" class="small" style="text-align:center"></div>
      <div id="keyT" class="key">C</div>
      <div class="small" style="text-align:center;margin-top:5px">音を正しく弾くと青いターゲットが次へ進みます。</div>
      <div class="bars">
        <div class="bar"><div id="bt1T" class="small"></div><div id="c1T" class="chord">—</div><div id="b1T" class="degs"></div></div>
        <div class="bar"><div id="bt2T" class="small"></div><div id="c2T" class="chord">—</div><div id="b2T" class="degs"></div></div>
      </div>
      <div class="detect">検出：<b id="noteT">—</b>　Chord:<b id="cdT">—</b></div>
      <div class="nav">
        <button id="prevT" class="btn">← 前</button><button id="retryT" class="btn">やり直し</button><button id="nextT" class="btn">次 →</button>
      </div>
    </div>
  </section>

  <section id="settings" class="view">
    <div class="p">
      <div class="setting-title">ギター入力</div>
      <button id="ib" class="btn" style="width:100%">ギター入力 ON</button>
      <div class="small" style="margin-top:10px">入力デバイス</div>
      <select id="dev" style="width:100%;margin-top:4px" disabled><option>入力ON後に取得</option></select>
      <div class="small" style="margin-top:7px">入力：<b id="active">—</b> ／ <span id="st">入力OFF</span></div>

      <div class="setting-title" style="margin-top:16px">THR入力レベル（RMS）</div>
      <div class="meter"><div id="lev" style="width:0"></div></div>
      <div class="statusbox small">
        <div id="diag">入力待ち</div>
      </div>
      <div class="small" style="margin-top:8px">iPhone/Safariでは AudioSession を内部で play-and-record に自動設定します。接続中のstreamは画面切替では切断しません。</div>
    </div>
  </section>
</div>

function makeDegrees(container,arr,offset=0){container.innerHTML='';arr.forEach((x,j)=>{let i=j+offset,s=document.createElement('span');s.className='d'+(i<idx?' ok':i===idx?' now':'');s.innerHTML='<span>'+x.label+'</span><span class="kind">'+x.kind+'</span>';container.appendChild(s)})}
function fill(prefix){const d=current(),ca=d.chords[page*2]||'',cb=d.chords[page*2+1]||'';$("pg"+prefix).textContent='Track '+String(track).padStart(2,'0')+' ／ '+(page*2+1)+'–'+Math.min(page*2+2,d.bars.length)+'小節';$("key"+prefix).textContent=d.key;$("bt1"+prefix).textContent=(page*2+1)+'小節目';$("bt2"+prefix).textContent=(page*2+2<=d.bars.length?(page*2+2)+'小節目':'');$("c1"+prefix).textContent=ca||'—';$("c2"+prefix).textContent=cb||'—';makeDegrees($("b1"+prefix),seq.slice(0,split),0);makeDegrees($("b2"+prefix),seq.slice(split),split);$("prev"+prefix).disabled=page===0;$("next"+prefix).disabled=(page+1)*2>=d.bars.length}

function prep(x){let n=x.length,m=0;for(let v of x)m+=v;m/=n;let y=new Float32Array(n),r=0;for(let i=0;i<n;i++){y[i]=x[i]-m;r+=y[i]*y[i]}return{y,r:Math.sqrt(r/n)}}
