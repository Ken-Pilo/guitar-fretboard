<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Track02 MPM Pitch Class Fast2</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.a{max-width:760px;margin:auto;padding:14px}.p{background:#0d0d0d;border:1px solid #333;border-radius:16px;padding:15px;margin-bottom:11px}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{background:#181818;color:#fff;border:1px solid #444;border-radius:10px;min-height:46px;padding:9px;font:inherit}.blue{color:#58a6ff}.green{color:#6ee787}.orange{color:#ffb86c}.small{font-size:13px;color:#aaa}.bars{display:grid;grid-template-columns:1fr 1fr;gap:9px}.bar{border:1px solid #333;border-radius:13px;padding:12px;text-align:center}.ch{font-size:25px;font-weight:900}.deg{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.d{font-size:25px;font-weight:900;color:#555}.d.now{color:#168bff;transform:scale(1.15)}.d.ok{color:#fff}.detect{text-align:center;margin-top:14px;font-size:24px}.meter{height:10px;background:#222;border-radius:10px;overflow:hidden;margin-top:12px}.meter div{height:100%;background:#aaa}.diag{text-align:center;line-height:1.7;margin-top:9px}</style></head><body><div class="a"><div class="p"><div class="r"><b style="font-size:22px">Track 02 <span class="blue">MPM FAST2</span></b><button id="on" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:9px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ sampleRate <b id="sr" class="blue">—</b> Hz</div></div><div class="p"><div class="bars"><div class="bar"><div>1小節目</div><div class="ch">CMaj7</div><div class="small blue">R = C</div><div id="b1" class="deg"></div></div><div class="bar"><div>2小節目</div><div class="ch">A7(E♭m7)</div><div class="small blue">R = A</div><div id="b2" class="deg"></div></div></div><div id="det" class="detect">検出：—</div><div class="meter"><div id="lev" style="width:0"></div></div><div class="diag small">RMS <b id="rms">—</b> ／ window <b id="win">—</b> ／ clarity <b id="clar">—</b> ／ Hz <b id="hz">—</b> ／ cent <b id="cent">—</b><br><span id="st">入力待ち</span></div><div class="r" style="margin-top:10px"><button id="back">←1音</button><button id="reset">最初から</button></div></div><div class="p small">前版の判定条件はほぼ維持。RMS 0.00025以上は4096サンプルで高速判定、0.00025未満だけ8192サンプルに切り替えます。弱音は2回一致、通常音は3回一致。オクターブは無視してpitch classのみ比較します。</div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),NN=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];const T=[{pc:2,n:'D',d:'△2'},{pc:11,n:'B',d:'△7'},{pc:7,n:'G',d:'P5'},{pc:4,n:'E',d:'△3'},{pc:3,n:'E♭',d:'♭5(R)'},{pc:6,n:'F♯',d:'△6(m3)'},{pc:10,n:'B♭',d:'m2(P5)'},{pc:1,n:'C♯',d:'△3(m7)'}];let idx=0,ctx,an,buf,stream,raf=0,hist=[],sil=0,armed=true,lastAcceptedPc=null;function draw(){for(let k=1;k<=2;k++)$('b'+k).innerHTML='';T.forEach((x,i)=>{let s=document.createElement('span');s.className='d'+(i<idx?' ok':i===idx?' now':'');s.textContent=x.d;(i<4?$('b1'):$('b2')).appendChild(s)});if(idx>=T.length)$('st').innerHTML='<span class="green">✓ 8音完了</span>'}function prep(x){let n=x.length,m=0;for(let v of x)m+=v;m/=n;let y=new Float32Array(n),r=0;for(let i=0;i<n;i++){y[i]=x[i]-m;r+=y[i]*y[i]}return{y,r:Math.sqrt(r/n)}}function nsdf(y,t){let ac=0,m=0,lim=y.length-t;for(let i=0;i<lim;i++){let a=y[i],b=y[i+t];ac+=a*b;m+=a*a+b*b}return m?2*ac/m:0}function mpm(y,sr,weak){let min=Math.max(2,Math.floor(sr/700)),max=Math.min(Math.floor(sr/70),Math.floor(y.length/2)),vals=new Float32Array(max+1),maxv=-1;for(let t=min;t<=max;t++){let v=nsdf(y,t);vals[t]=v;if(v>maxv)maxv=v}let floor=weak?.34:.45;if(maxv<floor)return null;let cutoff=Math.max(weak?.50:.62,maxv*(weak?.80:.86)),peaks=[];for(let t=min+1;t<max;t++)if(vals[t]>vals[t-1]&&vals[t]>=vals[t+1]&&vals[t]>=cutoff)peaks.push(t);if(!peaks.length)return null;let t=peaks[0],a=vals[t-1],b=vals[t],c=vals[t+1],den=a-2*b+c,sh=den?0.5*(a-c)/den:0,lag=t+Math.max(-.5,Math.min(.5,sh)),f=sr/lag;if(f<70||f>700)return null;return{f,clar:b}}function info(f){let mf=69+12*Math.log2(f/440),m=Math.round(mf),c=100*(mf-m);return{pc:(m%12+12)%12,n:NN[(m%12+12)%12],oct:Math.floor(m/12)-1,c}}function med(a){let z=[...a].sort((a,b)=>a-b);return z[Math.floor(z.length/2)]}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let q=prep(buf),weak=q.r<.00050,short=q.r>=.00025;$('rms').textContent=q.r.toFixed(5);$('win').textContent=short?'4096':'8192';$('lev').style.width=Math.min(100,q.r/.0012*100)+'%';if(q.r<.00010){sil++;if(sil>4){hist=[];armed=true;lastAcceptedPc=null;$('st').textContent=idx<T.length?'入力待ち':'✓ 8音完了'}raf=requestAnimationFrame(loop);return}sil=0;let y=short?q.y.subarray(q.y.length-4096):q.y,p=mpm(y,ctx.sampleRate,weak);$('clar').textContent=p?p.clar.toFixed(2):'—';if(!p||p.clar<(weak?.40:.58)){$('st').textContent='不安定・無視';raf=requestAnimationFrame(loop);return}let i=info(p.f);$('det').textContent='検出：'+i.n+i.oct+'（'+i.n+'）';$('hz').textContent=p.f.toFixed(2);$('cent').textContent=(i.c>=0?'+':'')+Math.round(i.c)+'c';hist.push({pc:i.pc,f:p.f,c:i.c});if(hist.length>5)hist.shift();if(!armed){if(i.pc!==lastAcceptedPc){armed=true;hist=[];$('st').textContent='次音受付'}else{$('st').textContent='同じ音保持中';raf=requestAnimationFrame(loop);return}}if(idx<T.length){let same=hist.filter(x=>x.pc===i.pc),need=weak?2:3;if(same.length>=need){let use=same.slice(-need),cspread=Math.max(...use.map(x=>x.c))-Math.min(...use.map(x=>x.c));if(cspread<=30&&Math.abs(med(use.map(x=>x.c)))<=40){if(i.pc===T[idx].pc){lastAcceptedPc=i.pc;armed=false;idx++;hist=[];$('st').innerHTML='<span class="green">✓ '+i.n+' OK</span>';draw()}else $('st').textContent='別音：'+i.n}}else $('st').textContent=weak?'弱音確認中…':'確認中…'}raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('dev').innerHTML='';ds.forEach((d,i)=>$('dev').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('dev').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('dev').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('sr').textContent=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=8192;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);loop();await list(set.deviceId||id||'')}$('on').onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}$('on').textContent='ギター入力 ON'}else try{await open('');$('on').textContent='ギター入力 OFF'}catch(e){$('st').textContent='入力エラー '+e.message}};$('dev').onchange=()=>open($('dev').value);$('reset').onclick=()=>{idx=0;hist=[];armed=true;lastAcceptedPc=null;draw();$('st').textContent='最初から'};$('back').onclick=()=>{idx=Math.max(0,idx-1);hist=[];armed=true;lastAcceptedPc=null;draw();$('st').textContent='1音戻る'};draw()})();</script></body></html>
