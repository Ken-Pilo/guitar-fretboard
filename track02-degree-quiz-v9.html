<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Track 02 v9</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:820px;margin:auto;padding:10px}.panel{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:13px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:10px;min-height:44px;padding:8px 12px;font:inherit}.btn.on{background:#12351f;border-color:#2d7b46}.song{font-size:23px;font-weight:900}.small{font-size:12px;color:#aaa}.blue{color:#58a6ff;font-weight:800}.oktxt{color:#6ee787}.warn{color:#ff7b72}.state.on{color:#6ee787;font-weight:900}.state.off{color:#ff7b72;font-weight:900}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{border:1px solid #333;border-radius:12px;padding:10px;min-height:150px}.chord{text-align:center;font-size:24px;font-weight:900}.root{text-align:center;color:#58a6ff;font-size:12px;font-weight:800}.degrees{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.deg{font-size:22px;font-weight:850;color:#555;min-width:42px;text-align:center}.deg.now{color:#168bff;transform:scale(1.08)}.deg.done{color:#fff}.detect{text-align:center;margin-top:14px;font-size:18px}.meter,.progress{height:8px;background:#222;border-radius:999px;overflow:hidden;margin-top:10px}.meter>div{height:100%;background:#888;width:0}.progress>div{height:100%;background:#fff;width:0}.nav{display:flex;gap:6px;margin-top:10px}.nav button{flex:1}@media(max-width:560px){.deg{font-size:19px;min-width:36px}.bar{padding:8px}.chord{font-size:21px}}</style></head><body><div class="app"><div class="panel"><div class="row"><div class="song">Track 02 度数テスト <span class="blue">v9 高感度</span></div><button id="inputBtn" class="btn" style="margin-left:auto">入力を開始</button></div><select id="device" style="width:100%;margin-top:8px" disabled><option>入力開始後に取得</option></select><div class="small">入力状態：<span id="inputState" class="state off">OFF</span> ／ 使用中：<b id="activeDevice">—</b></div><div class="row" style="margin-top:10px"><select id="refNote"><option value="130.8128">C3（5弦3F）</option><option value="82.4069">E2（6弦開放）</option><option value="110">A2（5弦開放）</option><option value="146.8324">D3（4弦開放）</option><option value="195.9977">G3（3弦開放）</option><option value="246.9417">B3（2弦開放）</option><option value="329.6276">E4（1弦開放）</option></select><button id="calBtn" class="btn">安定値で補正</button><button id="clearBtn" class="btn">解除</button></div><div class="small">生Hz：<span id="rawHz" class="blue">—</span> ／ 安定Hz：<span id="stableHz" class="blue">—</span> ／ 補正：<span id="calVal" class="blue">0 cent</span></div><div id="calMsg" class="small">v9は弱めのピッキングでも拾う高感度設定です。</div></div><div id="quiz" class="panel"><div id="pageInfo" class="small" style="text-align:center;margin-bottom:7px"></div><div class="bars"><div class="bar"><div id="barNo1" class="small"></div><div id="chord1" class="chord"></div><div id="root1" class="root"></div><div id="deg1" class="degrees"></div></div><div class="bar"><div id="barNo2" class="small"></div><div id="chord2" class="chord"></div><div id="root2" class="root"></div><div id="deg2" class="degrees"></div></div></div><div class="detect">検出：<b id="note">—</b>　Chord:<b id="degreeNow">—</b></div><div class="meter"><div id="level"></div></div><div id="diag" class="small" style="text-align:center;margin-top:7px">入力OFF</div><div class="progress"><div id="progress"></div></div><div class="nav"><button id="prevBtn" class="btn">← 前</button><button id="retryBtn" class="btn">やり直し</button><button id="nextBtn" class="btn">次 →</button></div><div class="small" style="margin-top:8px">※先ほど確認したTrack 02のTABテキストを実音化し、各小節のコードRoot基準で度数化。</div></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),NOTE=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],DEG=['R','m2','△2','m3','△3','P4','♭5','P5','m6','△6','m7','△7'];const DATA=[{c:'CMaj7',r:'C',pcs:[2,11,7,4],d:['△2','△7','P5','△3']},{c:'A7(E♭m7)',r:'A',pcs:[3,6,10,1],d:['♭5(R)','△6(m3)','m2(P5)','△3(m7)']},{c:'Dm7',r:'D',pcs:[10,9,5,2],d:['m7','P5','m3','R']},{c:'G7(D♭m7)',r:'G',pcs:[1,4,8,11],d:['♭5(R)','△6(m3)','m2(P5)','△3(m7)']},{c:'CMaj7',r:'C',pcs:[0,11,7,5],d:['R','△7','P5','P4']},{c:'A7',r:'A',pcs:[4,2,1,4],d:['P5','P4','△3','P5']},{c:'Dm7',r:'D',pcs:[2,4,5,7],d:['R','△2','m3','P4']},{c:'G7',r:'G',pcs:[8,6,7,5],d:['m2','△7','R','m7']},{c:'CMaj7',r:'C',pcs:[4,5,6,9],d:['△3','P4','♭5','△6']},{c:'A7',r:'A',pcs:[7,5,3,1],d:['m7','m6','♭5','△3']},{c:'Dm7',r:'D',pcs:[2,9,0,9],d:['R','P5','m7','P5']},{c:'G7',r:'G',pcs:[11,9,8,6],d:['△3','△2','m2','△7']},{c:'CMaj7',r:'C',pcs:[7,5,4,2],d:['P5','P4','△3','△2']},{c:'A7',r:'A',pcs:[1,3,4,7],d:['△3','♭5','P5','m7']},{c:'Dm7(FMaj7♯5)',r:'D',pcs:[5,9,1,4],d:['m3(R)','P5(△3)','△7(m6)','△2(△7)']},{c:'G7',r:'G',pcs:[2,5,8,6],d:['P5','m7','m2','△7']},{c:'CMaj7(G)',r:'C',pcs:[7,11,2,0],d:['P5(R)','△7(△3)','△2(P5)','R(P4)']},{c:'A7',r:'A',pcs:[1,10,9,7],d:['△3','m2','R','m7']},{c:'Dm7',r:'D',pcs:[5,9,0,10],d:['m3','P5','m7','m6']},{c:'G7',r:'G',pcs:[11,8,7,5],d:['△3','m2','R','m7']},{c:'CMaj7',r:'C',pcs:[4,7,11,9],d:['△3','P5','△7','△6']},{c:'A7(E♭)',r:'A',pcs:[10,7,5,3],d:['m2(P5)','m7(△3)','m6(△2)','♭5(R)']},{c:'Dm7',r:'D',pcs:[2,5,9,0],d:['R','m3','P5','m7']},{c:'G7(D♭dim7)',r:'G',pcs:[1,7,10,1],d:['♭5(R)','R(♭5)','m3(△6)','♭5(R)']}];const e={inputBtn:$('inputBtn'),device:$('device'),inputState:$('inputState'),active:$('activeDevice'),ref:$('refNote'),calBtn:$('calBtn'),clearBtn:$('clearBtn'),raw:$('rawHz'),stable:$('stableHz'),calVal:$('calVal'),calMsg:$('calMsg'),page:$('pageInfo'),barNo1:$('barNo1'),barNo2:$('barNo2'),chord1:$('chord1'),chord2:$('chord2'),root1:$('root1'),root2:$('root2'),deg1:$('deg1'),deg2:$('deg2'),note:$('note'),degreeNow:$('degreeNow'),level:$('level'),diag:$('diag'),progress:$('progress'),prev:$('prevBtn'),retry:$('retryBtn'),next:$('nextBtn')};let pageIndex=0,index=0,ctx=null,analyser=null,stream=null,buf=null,raf=0,recent=[],calCents=0,match=0,lastPc=-1,armed=true;try{calCents=Number(localStorage.getItem('guitarPitchCalCentsV6')||0)}catch(_){calCents=0}function showCal(){e.calVal.textContent=(calCents>=0?'+':'')+Math.round(calCents)+' cent'}function render(){const a=DATA[pageIndex*2],b=DATA[pageIndex*2+1];e.page.textContent=(pageIndex*2+1)+'–'+(pageIndex*2+2)+'小節 ／ 全24小節';e.barNo1.textContent=(pageIndex*2+1)+'小節目';e.barNo2.textContent=(pageIndex*2+2)+'小節目';e.chord1.textContent=a.c;e.chord2.textContent=b.c;e.root1.textContent='R = '+a.r;e.root2.textContent='R = '+b.r;e.deg1.innerHTML='';e.deg2.innerHTML='';[...a.d,...b.d].forEach((label,i)=>{const s=document.createElement('span');s.className='deg'+(i<index?' done':i===index?' now':'');s.textContent=label;(i<4?e.deg1:e.deg2).appendChild(s)});e.progress.style.width=((pageIndex*8+index)/96*100)+'%';e.prev.disabled=pageIndex===0;e.next.disabled=pageIndex===11}function resetPage(){index=0;match=0;armed=true;lastPc=-1;render()}function current(){const a=DATA[pageIndex*2],b=DATA[pageIndex*2+1];return index<4?{bar:a,pc:a.pcs[index]}:{bar:b,pc:b.pcs[index-4]}}function accept(pc){if(index>=8||!armed)return;const cur=current();if(pc===cur.pc){if(++match>=2){index++;match=0;armed=false;if(index>=8&&pageIndex<11){pageIndex++;resetPage();return}render()}}else match=0}function yin(x,sr){const n=x.length;let mean=0;for(let i=0;i<n;i++)mean+=x[i];mean/=n;let rms=0,y=new Float32Array(n);for(let i=0;i<n;i++){y[i]=x[i]-mean;rms+=y[i]*y[i]}rms=Math.sqrt(rms/n);if(rms<.00012)return{f:-1,r:rms,p:0};const mn=Math.floor(sr/1400),mx=Math.min(Math.floor(sr/75),n>>1),d=new Float32Array(mx+1),c=new Float32Array(mx+1);for(let t=1;t<=mx;t++){let sum=0;for(let i=0;i<n-t;i++){const q=y[i]-y[i+t];sum+=q*q}d[t]=sum}let run=0,best=-1,bv=1;for(let t=1;t<=mx;t++){run+=d[t];c[t]=run?d[t]*t/run:1;if(t>=mn&&c[t]<.24){while(t+1<=mx&&c[t+1]<c[t])t++;best=t;bv=c[t];break}if(t>=mn&&c[t]<bv){best=t;bv=c[t]}}if(best<0||bv>.58)return{f:-1,r:rms,p:1-bv};let tau=best;if(best>1&&best<mx){const a=c[best-1],z=c[best+1],den=a+z-2*c[best];if(Math.abs(den)>1e-9)tau=best+(a-z)/(2*den)}return{f:sr/tau,r:rms,p:1-bv}}function stableFor(target){const now=performance.now();let a=recent.filter(x=>now-x.t<1600&&x.p>.28).map(x=>x.f).filter(f=>Math.abs(1200*Math.log2(f/target))<=110);if(a.length<2)return null;a.sort((x,y)=>x-y);return a[Math.floor(a.length/2)]}function loop(){if(!analyser)return;analyser.getFloatTimeDomainData(buf);const p=yin(buf,ctx.sampleRate),pct=Math.min(100,p.r*5000);e.level.style.width=pct+'%';if(p.r<.00032){armed=true;lastPc=-1;match=0}if(p.f>75&&p.f<1400){const now=performance.now();recent.push({t:now,f:p.f,p:p.p});recent=recent.filter(x=>now-x.t<1800);e.raw.textContent=p.f.toFixed(1);const sv=stableFor(+e.ref.value);e.stable.textContent=sv?sv.toFixed(1):'—';const f=p.f*Math.pow(2,calCents/1200),m=69+12*Math.log2(f/440),mr=Math.round(m),pc=(mr%12+12)%12,cent=Math.round(100*(m-mr));e.note.textContent=NOTE[pc];const cur=current(),r=NOTE.indexOf(cur.bar.r),ar=(()=>{const m=cur.bar.c.match(/\(([A-G])([♯#♭b]?)/);if(!m)return null;let p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='♯'||m[2]==='#')p++;if(m[2]==='♭'||m[2]==='b')p--;return(p+12)%12})();e.degreeNow.textContent=DEG[(pc-r+12)%12]+(ar===null?'':'('+DEG[(pc-ar+12)%12]+')');e.diag.textContent='入力 '+pct.toFixed(0)+'% ／ '+f.toFixed(1)+'Hz ／ '+cent+' cent ／ 信頼 '+Math.round(p.p*100)+'%';if(!armed&&lastPc!==-1&&pc!==lastPc)armed=true;lastPc=pc;if(p.p>.28&&Math.abs(cent)<55)accept(pc)}else e.diag.textContent='入力 '+pct.toFixed(0)+'% ／ 検出待ち';raf=requestAnimationFrame(loop)}async function listDevices(id){const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');e.device.innerHTML='';ds.forEach((d,i)=>e.device.add(new Option(d.label||'入力 '+(i+1),d.deviceId)));e.device.disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))e.device.value=id}async function openInput(id){if(stream)stream.getTracks().forEach(t=>t.stop());const audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});const tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};e.active.textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();const src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=4096;buf=new Float32Array(analyser.fftSize);src.connect(analyser);recent=[];cancelAnimationFrame(raf);loop();await listDevices(set.deviceId||id||'');e.inputBtn.textContent='入力を停止';e.inputBtn.classList.add('on');e.inputState.textContent='ON';e.inputState.className='state on'}function stopInput(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;analyser=null;if(ctx){ctx.close();ctx=null}recent=[];e.raw.textContent='—';e.stable.textContent='—';e.note.textContent='—';e.degreeNow.textContent='—';e.diag.textContent='入力OFF';e.level.style.width='0';e.active.textContent='—';e.inputBtn.textContent='入力を開始';e.inputBtn.classList.remove('on');e.inputState.textContent='OFF';e.inputState.className='state off'}e.inputBtn.onclick=async()=>{if(stream){stopInput();return}try{await openInput('')}catch(err){e.calMsg.textContent='入力エラー：'+err.message;e.calMsg.className='small warn'}};e.device.onchange=()=>openInput(e.device.value);e.calBtn.onclick=()=>{if(!stream){e.calMsg.textContent='先に入力を開始してください。';e.calMsg.className='small warn';return}const target=+e.ref.value,sv=stableFor(target);if(!sv){e.calMsg.textContent='基準音を少し伸ばしてからもう一度。';e.calMsg.className='small warn';return}const cents=1200*Math.log2(target/sv);if(Math.abs(cents)>100){e.calMsg.textContent='基準音から離れすぎています。';e.calMsg.className='small warn';return}calCents=cents;try{localStorage.setItem('guitarPitchCalCentsV6',String(calCents))}catch(_){}showCal();e.calMsg.textContent='✓ 補正完了：'+sv.toFixed(1)+'Hz → '+target.toFixed(1)+'Hz（'+Math.round(calCents)+' cent）';e.calMsg.className='small oktxt'};e.clearBtn.onclick=()=>{calCents=0;try{localStorage.removeItem('guitarPitchCalCentsV6')}catch(_){}showCal();e.calMsg.textContent='補正を解除しました';e.calMsg.className='small'};e.prev.onclick=()=>{if(pageIndex>0){pageIndex--;resetPage()}};e.retry.onclick=resetPage;e.next.onclick=()=>{if(pageIndex<11){pageIndex++;resetPage()}};showCal();render()})();</script></body></html>
