<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Track02 Opening Pitch Test</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:820px;margin:auto;padding:12px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:14px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:44px;padding:8px;font:inherit}.small{font-size:12px;color:#aaa}.blue{color:#58a6ff}.seq{display:flex;gap:8px;flex-wrap:wrap}.n{min-width:58px;text-align:center;border:1px solid #333;border-radius:10px;padding:9px 6px;font-size:23px;font-weight:900;color:#777}.n.cur{color:#58a6ff;border-color:#58a6ff}.n.ok{color:#fff}.big{text-align:center;font-size:43px;font-weight:900}.hz{text-align:center;font-size:22px}.good{color:#6ee787}.bad{color:#ff7b72}.meter{height:9px;background:#222;border-radius:8px;overflow:hidden;margin-top:8px}.meter div{height:100%;background:#aaa}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 4px;border-bottom:1px solid #292929;text-align:center}</style></head><body><div class="app"><div class="p"><div class="row"><b style="font-size:21px">Track 02 冒頭 実音テスト</b><button id="on" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:8px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ sampleRate <b id="sr" class="blue">—</b> Hz ／ キャリブレーションなし</div></div><div class="p"><div class="small">Track 02の確認済みTAB冒頭2小節。順番に弾いてください。各音はピッキング検出→120ms待機→NCCF→オクターブ候補補正→1音確定です。</div><div style="margin-top:12px"><b>1 CMaj7</b><div class="seq" id="bar1"></div></div><div style="margin-top:12px"><b>2 A7(E♭m7)</b><div class="seq" id="bar2"></div></div><div class="row" style="margin-top:12px"><button id="retry" class="btn">最初から</button><span id="status" class="small">入力ON後、最初のDを弾いてください。</span></div></div><div class="p"><div class="big" id="note">—</div><div class="hz"><span id="hz">—</span> Hz　<span id="cent">—</span></div><div class="small" style="text-align:center">raw <span id="raw">—</span> Hz ／ octave <span id="oct">—</span> ／ score <span id="score">—</span>%</div><div class="meter"><div id="lev" style="width:0"></div></div></div><div class="p"><table><thead><tr><th>#</th><th>目標</th><th>確定Hz</th><th>cent</th><th>判定</th><th>補正</th></tr></thead><tbody id="log"></tbody></table></div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),NN=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];const Q=[{n:'D',pc:2},{n:'B',pc:11},{n:'G',pc:7},{n:'E',pc:4},{n:'E♭',pc:3},{n:'F♯',pc:6},{n:'B♭',pc:10},{n:'C♯',pc:1}];let ctx,an,buf,stream,raf=0,idx=0,armed=true,trial=null,prevR=0,lastQuiet=0,logs=[];function draw(){for(let b of ['bar1','bar2'])$(b).innerHTML='';Q.forEach((q,i)=>{let d=document.createElement('div');d.className='n '+(i<idx?'ok':i===idx?'cur':'');d.textContent=q.n;(i<4?$('bar1'):$('bar2')).appendChild(d)});$('log').innerHTML=logs.map((r,i)=>`<tr><td>${i+1}</td><td>${r.target}</td><td>${r.f.toFixed(1)}</td><td class="${Math.abs(r.c)<50?'good':'bad'}">${r.c>=0?'+':''}${Math.round(r.c)}c</td><td>${r.note}</td><td>${r.o}</td></tr>`).join('')}function prep(x){let n=x.length,m=0;for(let v of x)m+=v;m/=n;let y=new Float32Array(n),r=0;for(let i=0;i<n;i++){y[i]=x[i]-m;r+=y[i]*y[i]}return{y,r:Math.sqrt(r/n)}}function nccf(y,sr,r){if(r<.00025)return{f:-1,p:0};let n=y.length,min=Math.floor(sr/1400),max=Math.min(Math.floor(sr/65),n>>1),best=-1,bs=-1,s=new Float32Array(max+1);for(let t=min;t<=max;t++){let xy=0,aa=0,bb=0,lim=n-t;for(let i=0;i<lim;i++){let a=y[i],b=y[i+t];xy+=a*b;aa+=a*a;bb+=b*b}let v=aa&&bb?xy/Math.sqrt(aa*bb):0;s[t]=v;if(v>bs){bs=v;best=t}}if(best<0||bs<.35)return{f:-1,p:bs};let tau=best;if(best>min&&best<max){let a=s[best-1],b=s[best],c=s[best+1],den=a-2*b+c;if(Math.abs(den)>1e-9)tau=best+.5*(a-c)/den}return{f:sr/tau,p:bs}}function midiF(pc,oct){let midi=(oct+1)*12+pc;return 440*Math.pow(2,(midi-69)/12)}function nearest(f){let m=Math.round(69+12*Math.log2(f/440));return{pc:(m%12+12)%12,n:NN[(m%12+12)%12]+(Math.floor(m/12)-1),c:100*(69+12*Math.log2(f/440)-m)}}function choose(raw,pc){let candidates=[];for(let k of [.25,.5,1,2,4]){let f=raw*k;if(f<65||f>700)continue;let best=1e9;for(let o=2;o<=5;o++){let t=midiF(pc,o),c=1200*Math.log2(f/t);if(Math.abs(c)<Math.abs(best))best=c}candidates.push({f,k,c:best})}candidates.sort((a,b)=>Math.abs(a.c)-Math.abs(b.c));return candidates[0]}function median(a){let z=a.filter(x=>x>0).sort((x,y)=>x-y);return z.length?z[Math.floor(z.length/2)]:null}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let now=performance.now(),pr=prep(buf),p=nccf(pr.y,ctx.sampleRate,pr.r);$('lev').style.width=Math.min(100,pr.r*2500)+'%';if(pr.r<.0004){lastQuiet=now;if(!trial)armed=true}let attack=idx<Q.length&&armed&&!trial&&pr.r>.00055&&(now-lastQuiet<220||pr.r>prevR*1.5);if(attack){trial={t:now,s:[]};armed=false;$('status').textContent='ピッキング検出…120ms待機';}if(trial){let dt=now-trial.t;if(dt>=110&&dt<=250&&p.f>65&&p.f<1400&&p.p>.35)trial.s.push(p.f);if(dt>250){let raw=median(trial.s);if(raw){let q=Q[idx],z=choose(raw,q.pc),nn=nearest(z.f),targetHz=midiF(q.pc,Math.round(Math.log2(z.f/midiF(q.pc,4)))+4),c=z.c;$('note').textContent=nn.n;$('hz').textContent=z.f.toFixed(2);$('cent').textContent=(c>=0?'+':'')+Math.round(c)+' cent';$('raw').textContent=raw.toFixed(2);$('oct').textContent=z.k===1?'×1':z.k<1?'÷'+(1/z.k):'×'+z.k;$('score').textContent=Math.round(p.p*100);let ok=nn.pc===q.pc&&Math.abs(c)<50;logs.push({target:q.n,f:z.f,c,note:nn.n,o:z.k===1?'×1':z.k<1?'÷'+(1/z.k):'×'+z.k});if(ok){idx++;$('status').textContent=idx>=Q.length?'✓ 冒頭2小節 完了':'✓ OK。次：'+Q[idx].n}else $('status').textContent='✗ '+q.n+'ではありません。もう一度';draw()}else $('status').textContent='測定不足。もう一度弾いてください。';trial=null;setTimeout(()=>{armed=true},90)}}prevR=pr.r;raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('dev').innerHTML='';ds.forEach((d,i)=>$('dev').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('dev').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('dev').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('sr').textContent=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);lastQuiet=performance.now();loop();await list(set.deviceId||id||'')}$('on').onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}$('on').textContent='ギター入力 ON'}else try{await open('');$('on').textContent='ギター入力 OFF'}catch(e){$('status').textContent='入力エラー '+e.message}};$('dev').onchange=()=>open($('dev').value);$('retry').onclick=()=>{idx=0;logs=[];trial=null;armed=true;$('status').textContent='最初のDを弾いてください。';draw()};draw()})();</script></body></html>
