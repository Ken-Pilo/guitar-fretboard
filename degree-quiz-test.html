<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Degree Guitar Quiz v2</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:760px;margin:auto;padding:14px}.panel{border:1px solid #2c2c2c;border-radius:16px;padding:16px;margin-bottom:12px;background:#0c0c0c}.top,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top h1{font-size:20px;margin:0 auto 0 0}.ctl{min-height:44px;border:1px solid #444;background:#171717;color:#fff;border-radius:10px;padding:0 12px;font:inherit}.ctl.on{background:#fff;color:#000}.field{display:flex;flex-direction:column;gap:4px}.field span,.label{font-size:11px;color:#aaa}.device{width:100%;margin-top:10px}.device select{width:100%}.status,.small{font-size:12px;color:#999;line-height:1.6;margin-top:8px}.hero{text-align:center;padding:18px 8px 24px}.rootBig{font-size:72px;font-weight:900;line-height:1;margin:8px 0 4px}.rootSub{font-size:15px;color:#aaa}.bars{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.bar{border:1px solid #333;border-radius:14px;padding:14px;min-height:120px}.barTitle{font-size:12px;color:#888;text-align:left;margin-bottom:12px}.degrees{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}.deg{font-size:32px;font-weight:800;color:#5f5f5f;min-width:38px;text-align:center}.deg.current{color:#168bff;transform:scale(1.15)}.deg.done{color:#fff}.detect{margin-top:22px;font-size:15px;color:#aaa}.detect b{color:#fff}.progress,.meter{height:8px;background:#222;border-radius:999px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:#fff;width:0}.meter>div{height:100%;width:0;background:#888}.editor{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.editor input{width:100%;min-height:44px;border:1px solid #444;background:#151515;color:#fff;border-radius:10px;padding:0 12px;font-size:16px}.doneMsg{font-size:26px;font-weight:900;margin-top:18px;display:none}.doneMsg.show{display:block}.wrongMsg{height:20px;color:#ff6666;font-size:13px;margin-top:7px}.cal{border-color:#3b3b3b}.calValue{font-weight:800;color:#56a8ff}.ok{color:#6ee787}@media(max-width:560px){.app{padding:8px}.panel{padding:12px}.rootBig{font-size:60px}.bars{gap:8px}.bar{padding:10px}.deg{font-size:27px;min-width:32px}.degrees{gap:8px}.editor{grid-template-columns:1fr}.top h1{width:100%}}</style></head><body><div class="app"><div class="panel"><div class="top"><h1>🎸 2小節・度数ギタークイズ v2</h1><button id="inputBtn" class="ctl">ギター入力 ON</button><label class="field"><span>Root</span><select id="root" class="ctl"></select></label><button id="resetBtn" class="ctl">最初から</button></div><label class="field device"><span>入力デバイス</span><select id="device" class="ctl" disabled><option>入力ON後に取得</option></select></label><div class="status">使用中：<b id="activeInput">—</b>　<span id="status">入力OFF</span></div></div>
<div class="panel cal"><div class="label">ピッチ・キャリブレーション</div><div class="row" style="margin-top:8px"><label class="field"><span>基準音</span><select id="calNote" class="ctl"><option value="48">C3（5弦3F）</option><option value="40">E2（6弦開放）</option><option value="45">A2（5弦開放）</option><option value="50">D3（4弦開放）</option><option value="55">G3（3弦開放）</option><option value="59">B3（2弦開放）</option><option value="64">E4（1弦開放）</option></select></label><button id="calBtn" class="ctl">この音で補正</button><button id="calReset" class="ctl">補正解除</button></div><div class="small">基準音を鳴らして表示が安定したら「この音で補正」。現在の補正：<span id="calValue" class="calValue">0 cent</span>　<span id="calMsg"></span></div></div>
<div class="panel hero"><div class="label">ROOT / KEY</div><div id="rootBig" class="rootBig">C</div><div class="rootSub">青＝今弾く音　／　白＝正解済み</div><div class="bars"><div class="bar"><div class="barTitle">1小節目</div><div id="bar1" class="degrees"></div></div><div class="bar"><div class="barTitle">2小節目</div><div id="bar2" class="degrees"></div></div></div><div class="detect">検出：<b id="detNote">—</b>　<span id="detFreq">— Hz</span>　<span id="detDegree">—</span></div><div class="meter"><div id="level"></div></div><div id="diag" class="small">入力レベル 0% ／ 検出待ち</div><div id="wrongMsg" class="wrongMsg"></div><div class="progress"><div id="progressBar"></div></div><div id="doneMsg" class="doneMsg">2小節クリア ✓</div></div>
<div class="panel"><div class="label">テスト用フレーズ（度数）</div><div class="editor"><input id="seqInput" value="R △2 △3 P5 | △6 P5 △3 R"><button id="applyBtn" class="ctl">反映</button></div></div></div>
<script>(()=>{'use strict';const NOTES=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],DL=['R','m2','△2','m3','△3','P4','♭5','P5','m6','△6','m7','△7'],DM={'R':0,'1':0,'m2':1,'♭2':1,'b2':1,'△2':2,'2':2,'m3':3,'♭3':3,'b3':3,'△3':4,'3':4,'P4':5,'4':5,'♭5':6,'b5':6,'P5':7,'5':7,'m6':8,'♭6':8,'b6':8,'△6':9,'6':9,'m7':10,'♭7':10,'b7':10,'△7':11,'7':11},$=id=>document.getElementById(id),root=$('root');NOTES.forEach((n,i)=>root.add(new Option(n,i)));let seq=[],split=0,index=0,ctx,analyser,stream,buf,raf=0,currentDevice='',match=0,armed=true,lastPc=-1,lastRawF=-1,lastConfidence=0,wrongTimer=0,calCents=Number(localStorage.getItem('guitarPitchCalCents')||0);const el={btn:$('inputBtn'),dev:$('device'),active:$('activeInput'),status:$('status'),b1:$('bar1'),b2:$('bar2'),big:$('rootBig'),dn:$('detNote'),df:$('detFreq'),dd:$('detDegree'),diag:$('diag'),level:$('level'),wrong:$('wrongMsg'),prog:$('progressBar'),done:$('doneMsg'),seq:$('seqInput'),cv:$('calValue'),cm:$('calMsg')};function updateCal(){el.cv.textContent=(calCents>=0?'+':'')+Math.round(calCents)+' cent'}updateCal();
function parse(){const p=el.seq.value.trim().split('|'),a=(p[0]||'').trim().split(/\s+/).filter(Boolean),b=(p[1]||'').trim().split(/\s+/).filter(Boolean),all=[...a,...b];if(!all.length||all.some(x=>DM[x]===undefined)){el.status.textContent='度数記号を確認してください';return}seq=all.map(x=>({label:x,semi:DM[x]}));split=a.length;reset()}function draw(){el.b1.innerHTML='';el.b2.innerHTML='';seq.forEach((x,i)=>{let s=document.createElement('span');s.className='deg'+(i<index?' done':i===index?' current':'');s.textContent=x.label;(i<split?el.b1:el.b2).appendChild(s)});el.prog.style.width=(seq.length?Math.min(100,index/seq.length*100):0)+'%';el.done.classList.toggle('show',index>=seq.length);if(index>=seq.length)el.prog.style.width='100%'}function reset(){index=0;match=0;armed=true;el.wrong.textContent='';draw()}function target(){return index<seq.length?(+root.value+seq[index].semi)%12:null}function wrong(pc){clearTimeout(wrongTimer);el.wrong.textContent='違う音：'+NOTES[pc]+'（'+DL[(pc-root.value+12)%12]+'）';wrongTimer=setTimeout(()=>el.wrong.textContent='',450)}function accept(pc){if(index>=seq.length||!armed)return;if(pc===target()){if(++match>=4){index++;match=0;armed=false;el.wrong.textContent='';draw()}}else{match=0;wrong(pc)}}
function yin(x,sr){let n=x.length,mean=0;for(let v of x)mean+=v;mean/=n;let rms=0,y=new Float32Array(n);for(let i=0;i<n;i++){y[i]=x[i]-mean;rms+=y[i]*y[i]}rms=Math.sqrt(rms/n);if(rms<.0005)return{f:-1,r:rms,p:0};let min=Math.floor(sr/1400),max=Math.min(Math.floor(sr/75),n>>1),d=new Float32Array(max+1),c=new Float32Array(max+1),run=0,best=-1,bv=1;for(let t=1;t<=max;t++){let s=0;for(let i=0;i<n-t;i++){let q=y[i]-y[i+t];s+=q*q}d[t]=s}for(let t=1;t<=max;t++){run+=d[t];c[t]=run?d[t]*t/run:1;if(t>=min&&c[t]<.18){while(t+1<=max&&c[t+1]<c[t])t++;best=t;bv=c[t];break}if(t>=min&&c[t]<bv){best=t;bv=c[t]}}if(best<0||bv>.38)return{f:-1,r:rms,p:1-bv};let tau=best;if(best>1&&best<max){let a=c[best-1],b=c[best],z=c[best+1],den=a+z-2*b;if(Math.abs(den)>1e-9)tau=best+(a-z)/(2*den)}return{f:sr/tau,r:rms,p:1-bv}}
function loop(){if(!analyser)return;analyser.getFloatTimeDomainData(buf);let p=yin(buf,ctx.sampleRate),pct=Math.min(100,p.r*2500);el.level.style.width=pct+'%';if(p.r<.0012){armed=true;lastPc=-1;match=0}if(p.f>0&&p.f>=75&&p.f<=1400){lastRawF=p.f;lastConfidence=p.p;let corrected=p.f*Math.pow(2,calCents/1200),m=69+12*Math.log2(corrected/440),mr=Math.round(m),pc=(mr%12+12)%12,cent=Math.round(100*(m-mr));el.dn.textContent=NOTES[pc];el.df.textContent=corrected.toFixed(1)+' Hz';el.dd.textContent=DL[(pc-root.value+12)%12];el.diag.textContent='入力 '+pct.toFixed(0)+'% ／ 信頼 '+Math.round(p.p*100)+'% ／ '+cent+' cent ／ 生 '+p.f.toFixed(1)+'Hz';if(!armed&&lastPc!==-1&&pc!==lastPc)armed=true;lastPc=pc;if(p.p>.55&&Math.abs(cent)<48)accept(pc)}else el.diag.textContent='入力 '+pct.toFixed(0)+'% ／ 検出待ち';raf=requestAnimationFrame(loop)}
async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');el.dev.innerHTML='';ds.forEach((d,i)=>el.dev.add(new Option(d.label||'入力 '+(i+1),d.deviceId)));el.dev.disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))el.dev.value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};currentDevice=set.deviceId||id||'';el.active.textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();let src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=4096;buf=new Float32Array(analyser.fftSize);src.connect(analyser);cancelAnimationFrame(raf);loop();await list(currentDevice)}async function start(){try{await open('');el.btn.textContent='ギター入力 OFF';el.btn.classList.add('on');el.status.textContent='単音を順番に弾いてください'}catch(e){el.status.textContent='入力エラー '+e.message}}async function stop(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;analyser=null;if(ctx){await ctx.close();ctx=null}el.btn.textContent='ギター入力 ON';el.btn.classList.remove('on')}
$('calBtn').onclick=()=>{if(lastRawF<=0||lastConfidence<.55){el.cm.textContent='まず基準音を安定して鳴らしてください';return}let midi=+$('calNote').value,targetF=440*Math.pow(2,(midi-69)/12);calCents=1200*Math.log2(targetF/lastRawF);localStorage.setItem('guitarPitchCalCents',String(calCents));updateCal();el.cm.textContent='✓ 保存しました（生 '+lastRawF.toFixed(1)+'Hz → '+targetF.toFixed(1)+'Hz）';el.cm.className='ok'};$('calReset').onclick=()=>{calCents=0;localStorage.removeItem('guitarPitchCalCents');updateCal();el.cm.textContent='補正を解除しました'};el.btn.onclick=()=>stream?stop():start();el.dev.onchange=()=>open(el.dev.value);root.onchange=()=>{el.big.textContent=NOTES[+root.value];reset()};$('resetBtn').onclick=reset;$('applyBtn').onclick=parse;parse()})();</script></body></html>
