<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Weak MPM Tuner v3</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.a{max-width:760px;margin:auto;padding:16px}.p{background:#0d0d0d;border:1px solid #333;border-radius:16px;padding:16px;margin-bottom:12px}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{background:#181818;color:#fff;border:1px solid #444;border-radius:10px;min-height:48px;padding:10px;font:inherit}.n{text-align:center;font-size:82px;font-weight:900;margin:16px 0 0}.sub,.st{text-align:center;color:#aaa}.hz{text-align:center;font-size:22px;margin:8px}.c{text-align:center;font-size:34px;font-weight:800}.g{color:#6ee787}.o{color:#ffb86c}.b{color:#58a6ff}.meter{height:12px;background:#222;border-radius:10px;overflow:hidden;margin:12px 0}.meter div{height:100%;background:#999}.small{font-size:13px;color:#aaa}.needle{height:48px;position:relative;margin:6px 12px}.needle:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:#555}.needle i{position:absolute;top:6px;bottom:6px;width:4px;background:#fff;border-radius:3px;left:50%;transform:translateX(-50%)}</style></head><body><div class="a"><div class="p"><div class="r"><b style="font-size:23px">Chromatic Tuner <span class="b">WEAK FAST v3</span></b><button id="on" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:10px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ <b id="sr" class="b">—</b> Hz</div></div><div class="p"><div class="meter"><div id="lev" style="width:0"></div></div><div class="small">RMS <b id="rms">—</b> ／ モード <b id="mode">—</b> ／ clarity <b id="clar">—</b></div><div id="note" class="n">—</div><div id="oct" class="sub">—</div><div id="hz" class="hz">— Hz</div><div class="needle"><i id="needle"></i></div><div id="cent" class="c">— cent</div><div id="status" class="st">入力待ち</div></div><div class="p small">弱音は8192サンプルで解析。RMS 0.00020以上では、同じ音が連続2回かつcent差24以内なら即確定します。clarityは検出値を保持表示します。無音・極端に弱い信号は判定しません。</div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),NN=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];let ctx,an,buf,stream,raf=0,hist=[],sil=0,lastClar=null;function prep(x){let n=x.length,m=0;for(let v of x)m+=v;m/=n;let y=new Float32Array(n),r=0;for(let i=0;i<n;i++){y[i]=x[i]-m;r+=y[i]*y[i]}return{y,r:Math.sqrt(r/n)}}function nsdf(y,t){let ac=0,m=0,lim=y.length-t;for(let i=0;i<lim;i++){let a=y[i],b=y[i+t];ac+=a*b;m+=a*a+b*b}return m?2*ac/m:0}function mpm(y,sr,weak){let min=Math.max(2,Math.floor(sr/700)),max=Math.min(Math.floor(sr/70),Math.floor(y.length/2)),vals=new Float32Array(max+1),maxv=-1;for(let t=min;t<=max;t++){let v=nsdf(y,t);vals[t]=v;if(v>maxv)maxv=v}let floor=weak?.34:.45;if(maxv<floor)return null;let cutoff=Math.max(weak?.50:.62,maxv*(weak?.80:.86)),peaks=[];for(let t=min+1;t<max;t++)if(vals[t]>vals[t-1]&&vals[t]>=vals[t+1]&&vals[t]>=cutoff)peaks.push(t);if(!peaks.length)return null;let t=peaks[0],a=vals[t-1],b=vals[t],c=vals[t+1],den=a-2*b+c,sh=den?0.5*(a-c)/den:0,lag=t+Math.max(-.5,Math.min(.5,sh)),f=sr/lag;if(f<70||f>700)return null;return{f,clar:b}}function info(f){let mf=69+12*Math.log2(f/440),m=Math.round(mf),c=100*(mf-m);return{m,c,pc:(m%12+12)%12,oct:Math.floor(m/12)-1}}function med(a){let z=[...a].sort((a,b)=>a-b);return z[Math.floor(z.length/2)]}function render(f,label){let z=info(f);$('note').textContent=NN[z.pc];$('oct').textContent=NN[z.pc]+z.oct;$('hz').textContent=f.toFixed(2)+' Hz';$('cent').textContent=(z.c>=0?'+':'')+Math.round(z.c)+' cent';$('cent').className='c '+(Math.abs(z.c)<=20?'g':'o');$('needle').style.left=(50+Math.max(-48,Math.min(48,z.c*.96)))+'%';$('status').textContent=Math.abs(z.c)<=35?label:'音程差が大きい';$('status').className='st '+(Math.abs(z.c)<=35?'g':'o')}function clear(s){$('status').textContent=s;$('note').textContent='—';$('oct').textContent='—';$('hz').textContent='— Hz';$('cent').textContent='— cent';$('needle').style.left='50%'}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let q=prep(buf),weak=q.r<.00050;$('rms').textContent=q.r.toFixed(5);$('mode').textContent=weak?'弱音':'通常';$('mode').className=weak?'o':'g';$('lev').style.width=Math.min(100,q.r/.0012*100)+'%';if(q.r<.00010){sil++;if(sil>5){hist=[];lastClar=null;$('clar').textContent='—';clear('入力待ち')}raf=requestAnimationFrame(loop);return}sil=0;let y=weak?q.y:q.y.subarray(q.y.length-4096),p=mpm(y,ctx.sampleRate,weak);if(p){lastClar=p.clar;$('clar').textContent=p.clar.toFixed(2)}else if(lastClar!==null){$('clar').textContent=lastClar.toFixed(2)}if(!p||p.clar<(weak?.40:.58)){$('status').textContent='不安定・無視';raf=requestAnimationFrame(loop);return}let i=info(p.f);hist.push({f:p.f,pc:i.pc,c:i.c,clar:p.clar});if(hist.length>6)hist.shift();if(weak){let n=hist.length;if(n<2){$('status').textContent='弱音確認中…';raf=requestAnimationFrame(loop);return}let a=hist[n-2],b=hist[n-1];if(a.pc!==b.pc||Math.abs(a.c-b.c)>24){$('status').textContent='弱音確認中…';raf=requestAnimationFrame(loop);return}let f=med([a.f,b.f]);render(f,q.r>=.00020?'弱音 ✓ 2回で確定':'弱音 ✓ 安定')}else{let same=hist.filter(x=>x.pc===i.pc);if(same.length<3){$('status').textContent='確認中…';raf=requestAnimationFrame(loop);return}render(med(same.slice(-4).map(x=>x.f)),'✓ 安定')}raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('dev').innerHTML='';ds.forEach((d,i)=>$('dev').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('dev').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('dev').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('sr').textContent=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=8192;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);loop();await list(set.deviceId||id||'')}$('on').onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}$('on').textContent='ギター入力 ON';clear('入力待ち')}else try{await open('');$('on').textContent='ギター入力 OFF'}catch(e){clear('入力エラー '+e.message)}};$('dev').onchange=()=>open($('dev').value)})();</script></body></html>
