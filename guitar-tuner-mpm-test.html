<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Guitar Tuner MPM Test</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:820px;margin:auto;padding:16px}.p{background:#0d0d0d;border:1px solid #333;border-radius:16px;padding:16px;margin-bottom:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:10px;min-height:48px;padding:10px;font:inherit}.note{text-align:center;font-size:82px;font-weight:900;margin:18px 0 2px}.oct{text-align:center;font-size:22px;color:#aaa}.hz{text-align:center;font-size:22px;margin:8px}.cent{text-align:center;font-size:34px;font-weight:800}.ok{color:#6ee787}.warn{color:#ffb86c}.blue{color:#58a6ff}.small{font-size:14px;color:#aaa}.meter{height:12px;background:#222;border-radius:10px;overflow:hidden;margin:14px 0}.meter div{height:100%;background:#999}.needle{height:54px;position:relative;margin:8px 12px}.needle:before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:#555}.needle i{position:absolute;top:8px;bottom:8px;width:4px;background:#fff;border-radius:3px;left:50%;transform:translateX(-50%)}.status{text-align:center;font-size:18px;color:#aaa}</style></head><body><div class="app"><div class="p"><div class="row"><b style="font-size:24px">Chromatic Guitar Tuner</b><button id="on" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:12px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ sampleRate <b id="sr" class="blue">—</b> Hz</div></div><div class="p"><div class="meter"><div id="lev" style="width:0"></div></div><div class="small">RMS <b id="rms">—</b></div><div id="note" class="note">—</div><div id="oct" class="oct">弾いた音をそのまま判定</div><div id="hz" class="hz">— Hz</div><div class="needle"><i id="needle"></i></div><div id="cent" class="cent">— cent</div><div id="status" class="status">入力待ち</div></div><div class="p small">正解音・コード・TAB情報は一切使いません。普通のクロマチックチューナーと同じ考え方で、現在鳴っている音を先に判定します。音が弱い／不安定な時は無理に音名を出さず「不安定」にします。</div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),NN=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];let ctx,an,buf,stream,raf=0,last=[],sil=0;function prep(x){let n=x.length,m=0;for(let v of x)m+=v;m/=n;let y=new Float32Array(n),r=0;for(let i=0;i<n;i++){y[i]=x[i]-m;r+=y[i]*y[i]}return{y,r:Math.sqrt(r/n)}}function nsdf(y,t){let ac=0,m=0,lim=y.length-t;for(let i=0;i<lim;i++){let a=y[i],b=y[i+t];ac+=a*b;m+=a*a+b*b}return m?2*ac/m:0}function mpm(y,sr){let min=Math.max(2,Math.floor(sr/700)),max=Math.min(Math.floor(sr/70),Math.floor(y.length/2)),vals=new Float32Array(max+1);let maxv=-1;for(let t=min;t<=max;t++){let v=nsdf(y,t);vals[t]=v;if(v>maxv)maxv=v}if(maxv<.45)return null;let cutoff=Math.max(.62,maxv*.86),peaks=[];for(let t=min+1;t<max;t++)if(vals[t]>vals[t-1]&&vals[t]>=vals[t+1]&&vals[t]>=cutoff)peaks.push(t);if(!peaks.length)return null;let t=peaks[0];let y1=vals[t-1],y2=vals[t],y3=vals[t+1],den=y1-2*y2+y3,shift=den?0.5*(y1-y3)/den:0;let lag=t+Math.max(-.5,Math.min(.5,shift)),f=sr/lag;if(f<70||f>700)return null;return{f,clar:y2}}function info(f){let mf=69+12*Math.log2(f/440),m=Math.round(mf),c=100*(mf-m),pc=(m%12+12)%12,oct=Math.floor(m/12)-1;return{m,c,pc,oct}}function median(a){let z=[...a].sort((a,b)=>a-b);return z[Math.floor(z.length/2)]}function showNone(txt){$('status').textContent=txt;$('status').className='status warn';$('note').textContent='—';$('hz').textContent='— Hz';$('cent').textContent='— cent';$('needle').style.left='50%'}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let q=prep(buf);$('rms').textContent=q.r.toFixed(5);$('lev').style.width=Math.min(100,q.r/.0012*100)+'%';if(q.r<.00013){sil++;if(sil>5){last=[];showNone('入力待ち')}raf=requestAnimationFrame(loop);return}sil=0;let p=mpm(q.y,ctx.sampleRate);if(!p||p.clar<.58){showNone('不安定');raf=requestAnimationFrame(loop);return}let i=info(p.f);last.push({f:p.f,pc:i.pc,c:i.c,clar:p.clar});if(last.length>5)last.shift();let same=last.filter(x=>x.pc===i.pc);if(same.length<3){$('status').textContent='確認中…';raf=requestAnimationFrame(loop);return}let f=median(same.slice(-4).map(x=>x.f)),z=info(f);$('note').textContent=NN[z.pc];$('oct').textContent=NN[z.pc]+z.oct;$('hz').textContent=f.toFixed(2)+' Hz';$('cent').textContent=(z.c>=0?'+':'')+Math.round(z.c)+' cent';$('cent').className='cent '+(Math.abs(z.c)<=15?'ok':'warn');$('needle').style.left=(50+Math.max(-48,Math.min(48,z.c*.96)))+'%';$('status').textContent=Math.abs(z.c)<=35?'安定':'音程差が大きい';$('status').className='status '+(Math.abs(z.c)<=35?'ok':'warn');raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('dev').innerHTML='';ds.forEach((d,i)=>$('dev').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('dev').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('dev').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('sr').textContent=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);loop();await list(set.deviceId||id||'')}$('on').onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}$('on').textContent='ギター入力 ON';showNone('入力待ち')}else try{await open('');$('on').textContent='ギター入力 OFF'}catch(e){showNone('入力エラー '+e.message)}};$('dev').onchange=()=>open($('dev').value)})();</script></body></html>
