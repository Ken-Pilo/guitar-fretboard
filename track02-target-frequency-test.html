<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Track02 Target Frequency Test</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.a{max-width:760px;margin:auto;padding:14px}.p{background:#0d0d0d;border:1px solid #333;border-radius:16px;padding:15px;margin-bottom:11px}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{background:#181818;color:#fff;border:1px solid #444;border-radius:10px;min-height:46px;padding:9px;font:inherit}.blue{color:#58a6ff}.green{color:#6ee787}.orange{color:#ffb86c}.small{font-size:13px;color:#aaa}.bars{display:grid;grid-template-columns:1fr 1fr;gap:9px}.bar{border:1px solid #333;border-radius:13px;padding:12px;text-align:center}.ch{font-size:25px;font-weight:900}.deg{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.d{font-size:25px;font-weight:900;color:#555}.d.now{color:#168bff;transform:scale(1.15)}.d.ok{color:#fff}.target{text-align:center;font-size:25px;font-weight:900;margin:10px}.meter{height:10px;background:#222;border-radius:10px;overflow:hidden}.meter div{height:100%;background:#aaa}.diag{text-align:center;line-height:1.7;margin-top:10px}</style></head><body><div class="a"><div class="p"><div class="r"><b style="font-size:22px">Track 02 <span class="blue">TARGET FREQUENCY TEST</span></b><button id="on" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:9px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ sampleRate <b id="sr" class="blue">—</b> Hz</div></div><div class="p"><div class="bars"><div class="bar"><div>1小節目</div><div class="ch">CMaj7</div><div class="small blue">R = C</div><div id="b1" class="deg"></div></div><div class="bar"><div>2小節目</div><div class="ch">A7(E♭m7)</div><div class="small blue">R = A</div><div id="b2" class="deg"></div></div></div><div id="target" class="target"></div><div class="meter"><div id="lev" style="width:0"></div></div><div class="diag small">RMS <b id="rms">—</b> ／ exact <b id="exact">—</b> ／ octave <b id="oct">—</b> ／ best <b id="best">—</b><br><span id="st">入力待ち</span></div><div class="r" style="margin-top:10px"><button id="back">←1音</button><button id="reset">最初から</button></div></div><div class="p small">最初の8音だけの検証版です。正解音をチューナーのように全探索せず、印刷TABで分かっている実音周波数を直接調べます。正解周波数を最優先し、±1オクターブは補助証拠としてだけ使います。</div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x);const T=[{n:'D5',f:587.33,d:'△2'},{n:'B4',f:493.88,d:'△7'},{n:'G4',f:392.00,d:'P5'},{n:'E4',f:329.63,d:'△3'},{n:'E♭4',f:311.13,d:'♭5(R)'},{n:'F♯4',f:369.99,d:'△6(m3)'},{n:'B♭3',f:233.08,d:'m2(P5)'},{n:'C♯4',f:277.18,d:'△3(m7)'}];let idx=0,ctx,an,buf,stream,raf=0,hit=0,armed=true,quiet=0;function draw(){for(let k=1;k<=2;k++)$('b'+k).innerHTML='';T.forEach((x,i)=>{let s=document.createElement('span');s.className='d'+(i<idx?' ok':i===idx?' now':'');s.textContent=x.d;(i<4?$('b1'):$('b2')).appendChild(s)});if(idx<T.length)$('target').innerHTML='次：<span class="blue">'+T[idx].d+'</span>　'+T[idx].n+' <span class="small">'+T[idx].f.toFixed(2)+'Hz</span>';else $('target').innerHTML='<span class="green">✓ 8音完了</span>'}function prep(x){let m=0;for(let v of x)m+=v;m/=x.length;let y=new Float32Array(x.length),r=0;for(let i=0;i<x.length;i++){y[i]=x[i]-m;r+=y[i]*y[i]}return{y,r:Math.sqrt(r/x.length)}}function nsdf(y,lag){let t=Math.round(lag),ac=0,m=0,lim=y.length-t;if(t<2||lim<100)return 0;for(let i=0;i<lim;i++){let a=y[i],b=y[i+t];ac+=a*b;m+=a*a+b*b}return m?2*ac/m:0}function around(y,sr,f){let lag=sr/f,b=-1,bf=f;for(let d=-3;d<=3;d+=.5){let l=lag+d,v=nsdf(y,l);if(v>b){b=v;bf=sr/l}}return{v:b,f:bf}}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let q=prep(buf);$('rms').textContent=q.r.toFixed(5);$('lev').style.width=Math.min(100,q.r/.0012*100)+'%';if(q.r<.00010){quiet++;if(quiet>4){armed=true;hit=0;$('st').textContent='入力待ち'}raf=requestAnimationFrame(loop);return}quiet=0;if(idx>=T.length){raf=requestAnimationFrame(loop);return}let t=T[idx],e=around(q.y,ctx.sampleRate,t.f),lo=around(q.y,ctx.sampleRate,t.f/2),hi=t.f*2<=700?around(q.y,ctx.sampleRate,t.f*2):{v:0,f:0};$('exact').textContent=e.v.toFixed(2);$('oct').textContent=Math.max(lo.v,hi.v).toFixed(2);let best=e.v,bf=e.f,kind='exact';if(lo.v>best*.98&&lo.v>.62){best=lo.v;bf=lo.f;kind='−oct'}if(hi.v>best*.98&&hi.v>.62){best=hi.v;bf=hi.f;kind='+oct'}$('best').textContent=best.toFixed(2)+' '+kind;if(!armed){$('st').textContent='次のピッキング待ち';raf=requestAnimationFrame(loop);return}let exactGood=e.v>=.52, familyGood=best>=.68 && e.v>=.34;if(exactGood||familyGood){hit++;$('st').innerHTML='<span class="orange">正解成分確認 '+hit+'/2</span>　'+bf.toFixed(1)+'Hz';if(hit>=2){$('st').innerHTML='<span class="green">✓ '+t.n+' OK</span>';idx++;hit=0;armed=false;draw()}}else{hit=0;$('st').textContent='正解音成分なし・無視'}raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('dev').innerHTML='';ds.forEach((d,i)=>$('dev').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('dev').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('dev').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('sr').textContent=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=8192;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);loop();await list(set.deviceId||id||'')}$('on').onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}$('on').textContent='ギター入力 ON'}else try{await open('');$('on').textContent='ギター入力 OFF'}catch(e){$('st').textContent='入力エラー '+e.message}};$('dev').onchange=()=>open($('dev').value);$('reset').onclick=()=>{idx=0;hit=0;armed=true;draw()};$('back').onclick=()=>{idx=Math.max(0,idx-1);hit=0;armed=true;draw()};draw()})();</script></body></html>
