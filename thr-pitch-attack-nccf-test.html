<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>THR Attack NCCF Test</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:820px;margin:auto;padding:12px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:14px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:44px;padding:8px;font:inherit}.blue{color:#58a6ff}.small{font-size:12px;color:#aaa}.big{text-align:center;font-size:46px;font-weight:900}.sub{text-align:center;font-size:22px;font-weight:800}.meter{height:9px;background:#222;border-radius:8px;overflow:hidden;margin-top:8px}.meter div{height:100%;background:#aaa}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{font-weight:800}.good{color:#6ee787}.warn{color:#ffb86c}.bad{color:#ff7b72}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 4px;border-bottom:1px solid #292929;text-align:center}th:first-child,td:first-child{text-align:left}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.big{font-size:38px}}</style></head><body><div class="app"><div class="p"><div class="row"><b style="font-size:21px">THR アタック→120ms待ち→NCCF</b><button id="on" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:8px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ sampleRate：<b id="sr" class="blue">—</b> Hz ／ キャリブレーションなし</div></div><div class="p"><div class="small" style="text-align:center">確定音</div><div class="big" id="note">—</div><div class="sub"><span id="hz">—</span> Hz　<span id="cent" class="blue">—</span></div><div class="small" style="text-align:center">NCCF score <span id="score">—</span>% ／ 候補補正 <span id="oct">—</span></div><div class="meter"><div id="lev" style="width:0"></div></div><div id="status" class="small" style="text-align:center;margin-top:8px">入力をONにしてください。</div></div><div class="p"><div class="small" style="margin-bottom:8px">弦を選び、普通に1回弾いてください。ピッキング検出後120ms待ち、約100msのNCCF中央値で1音だけ確定します。サステイン中は再判定しません。</div><div class="grid" id="strings"></div><div class="row" style="margin-top:9px"><button id="clear" class="btn">記録クリア</button><span class="small">各弦2〜3回試してください。</span></div></div><div class="p"><table><thead><tr><th>対象</th><th>確定Hz</th><th>cent</th><th>判定</th><th>補正</th></tr></thead><tbody id="rows"></tbody></table><div class="small" style="margin-top:8px">オクターブ補正は、選択した開放弦の基準周波数に対して f, 2f, f/2, 4f, f/4 を比較し、最も近い候補を採用します。これは診断用です。</div></div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),S=[{s:'6弦',n:'E2',f:82.4069},{s:'5弦',n:'A2',f:110},{s:'4弦',n:'D3',f:146.8324},{s:'3弦',n:'G3',f:195.9977},{s:'2弦',n:'B3',f:246.9417},{s:'1弦',n:'E4',f:329.6276}],NN=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];let ctx,an,buf,stream,raf=0,target=-1,prevR=0,lastQuiet=0,locked=false,capture=null,rows=[];function prep(x){let n=x.length,m=0;for(let v of x)m+=v;m/=n;let y=new Float32Array(n),r=0;for(let i=0;i<n;i++){y[i]=x[i]-m;r+=y[i]*y[i]}return{y,r:Math.sqrt(r/n)}}function nccf(y,sr,r){if(r<.00025)return{f:-1,p:0};let n=y.length,min=Math.floor(sr/1400),max=Math.min(Math.floor(sr/70),n>>1),best=-1,bs=-1,scores=new Float32Array(max+1);for(let t=min;t<=max;t++){let xy=0,aa=0,bb=0,lim=n-t;for(let i=0;i<lim;i++){let a=y[i],b=y[i+t];xy+=a*b;aa+=a*a;bb+=b*b}let s=(aa>0&&bb>0)?xy/Math.sqrt(aa*bb):0;scores[t]=s;if(s>bs){bs=s;best=t}}if(best<0||bs<.35)return{f:-1,p:bs};let tau=best;if(best>min&&best<max){let a=scores[best-1],b=scores[best],c=scores[best+1],den=a-2*b+c;if(Math.abs(den)>1e-9)tau=best+.5*(a-c)/den}return{f:sr/tau,p:bs}}function cents(f,t){return 1200*Math.log2(f/t)}function nearest(f){let m=Math.round(69+12*Math.log2(f/440));return NN[(m%12+12)%12]+(Math.floor(m/12)-1)}function chooseOct(f,t){let cand=[{f,k:'×1'},{f:f*2,k:'×2'},{f:f/2,k:'÷2'},{f:f*4,k:'×4'},{f:f/4,k:'÷4'}].filter(x=>x.f>=60&&x.f<=1400);cand.sort((a,b)=>Math.abs(cents(a.f,t))-Math.abs(cents(b.f,t)));return cand[0]}function med(a){let z=a.filter(Number.isFinite).sort((x,y)=>x-y);return z.length?z[Math.floor(z.length/2)]:null}function cl(c){c=Math.abs(c);return c<=20?'good':c<=50?'warn':'bad'}function draw(){let b=$('strings');b.innerHTML='';S.forEach((x,i)=>{let q=document.createElement('button');q.className='btn card';q.innerHTML=`${x.s} ${x.n}<br><span class="small">${x.f.toFixed(2)}Hz</span>`;if(i===target)q.style.borderColor='#58a6ff';q.onclick=()=>{target=i;locked=false;capture=null;$('status').textContent=x.s+' '+x.n+' を1回弾いてください。';draw()};b.appendChild(q)});$('rows').innerHTML=rows.slice(-18).map(r=>`<tr><td>${r.s} ${r.n}</td><td>${r.f.toFixed(1)}</td><td class="${cl(r.c)}">${r.c>=0?'+':''}${Math.round(r.c)}c</td><td>${r.note}</td><td>${r.k}</td></tr>`).join('')}function finalize(){if(!capture||target<0)return;let raw=med(capture.fs);if(!raw){$('status').textContent='測定失敗。もう一度弾いてください。';capture=null;locked=false;return}let t=S[target],o=chooseOct(raw,t.f),c=cents(o.f,t.f),note=nearest(o.f);$('note').textContent=note;$('hz').textContent=o.f.toFixed(2);$('cent').textContent=(c>=0?'+':'')+Math.round(c)+' cent';$('score').textContent=Math.round((capture.ps.length?med(capture.ps):0)*100);$('oct').textContent=o.k;rows.push({s:t.s,n:t.n,f:o.f,c,note,k:o.k});$('status').textContent='確定しました。次のピッキング待ち。';capture=null;locked=true;draw()}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let now=performance.now(),pr=prep(buf),n=nccf(pr.y,ctx.sampleRate,pr.r);$('lev').style.width=Math.min(100,pr.r*2500)+'%';if(pr.r<.0004){lastQuiet=now;if(locked&&now-(capture?.t||0)>0)locked=false}let attack=target>=0&&!locked&&!capture&&pr.r>.00055&&(now-lastQuiet<220||pr.r>prevR*1.55);if(attack){capture={t:now,fs:[],ps:[]};$('status').textContent='ピッキング検出。120ms待機中…'}if(capture){let dt=now-capture.t;if(dt>=120&&dt<=230&&n.f>60&&n.f<1400&&n.p>.35){capture.fs.push(n.f);capture.ps.push(n.p);$('status').textContent='NCCF測定中…'}if(dt>240)finalize()}prevR=pr.r;raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('dev').innerHTML='';ds.forEach((d,i)=>$('dev').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('dev').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('dev').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('sr').textContent=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);lastQuiet=performance.now();loop();await list(set.deviceId||id||'')}$('on').onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}$('on').textContent='ギター入力 ON';$('status').textContent='入力OFF'}else try{await open('');$('on').textContent='ギター入力 OFF';$('status').textContent='弦を選んでください。'}catch(e){$('status').textContent='入力エラー '+e.message}};$('dev').onchange=()=>open($('dev').value);$('clear').onclick=()=>{rows=[];locked=false;capture=null;draw()};draw()})();</script></body></html>
