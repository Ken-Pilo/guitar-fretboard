<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>1625 Chord Degree Quiz NEW</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:800px;margin:auto;padding:10px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:13px;margin-bottom:9px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:43px;padding:8px;font:inherit}.song{font-size:21px;font-weight:900}.small{font-size:12px;color:#aaa}.key{text-align:center;font-size:42px;font-weight:900}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{border:1px solid #333;border-radius:12px;padding:10px;min-height:135px}.chord{text-align:center;font-size:30px;font-weight:900}.root{text-align:center;color:#58a6ff;font-size:13px;font-weight:800}.degs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}.d{font-size:26px;font-weight:850;color:#555;min-width:31px;text-align:center}.d.now{color:#168bff;transform:scale(1.15)}.d.ok{color:#fff}.detect{text-align:center;margin-top:14px;font-size:17px}.meter,.prog{height:8px;background:#222;border-radius:9px;overflow:hidden;margin-top:9px}.meter div{height:100%;background:#888}.prog div{height:100%;background:#fff}.nav{display:flex;gap:6px;margin-top:10px}.nav button{flex:1}@media(max-width:560px){.d{font-size:23px}.bar{padding:8px}}</style></head><body><div class="app"><div class="p"><div class="row"><div class="song">1625 コード基準度数練習 <span style="color:#58a6ff">NEW</span></div><button id="ib" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:8px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ <span id="st">入力OFF</span></div></div><div class="p"><div id="pg" class="small" style="text-align:center"></div><div class="key">Key C</div><div class="small" style="text-align:center;margin-bottom:8px">表示・正誤判定とも各コードのRoot基準</div><div class="bars"><div class="bar"><div id="bt1" class="small"></div><div id="c1" class="chord"></div><div id="r1" class="root"></div><div id="b1" class="degs"></div></div><div class="bar"><div id="bt2" class="small"></div><div id="c2" class="chord"></div><div id="r2" class="root"></div><div id="b2" class="degs"></div></div></div><div class="detect">検出：<b id="note">—</b>　Chord:<b id="cd">—</b></div><div class="meter"><div id="lev" style="width:0"></div></div><div id="diag" class="small" style="text-align:center;margin-top:6px">入力待ち</div><div class="prog"><div id="pr" style="width:0"></div></div><div class="nav"><button id="prev" class="btn">← 前</button><button id="retry" class="btn">やり直し</button><button id="next" class="btn">次 →</button></div></div></div><script>(()=>{'use strict';const N=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],D=['R','m2','△2','m3','△3','P4','♭5','P5','m6','△6','m7','△7'],M={'R':0,'m2':1,'△2':2,'m3':3,'△3':4,'P4':5,'♭5':6,'P5':7,'m6':8,'△6':9,'m7':10,'△7':11},$=x=>document.getElementById(x);const chs=['C','Am','Dm','G'],bars=[['△3','P5','△6','P5'],['P5','m3','△2','R'],['m3','P5','m7','P5'],['△3','△2','R','P5']].map(a=>a.map(l=>({l,s:M[l]})));let page=0,seq=[],split=0,idx=0,ctx,an,stream,buf,raf=0,match=0,armed=true,last=-1,cal=0;try{cal=Number(localStorage.getItem('guitarPitchCalCentsV3')||0)}catch(e){}function chordPc(s){let m=s.match(/^([A-G])([#♯b♭]?)/),pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='#'||m[2]==='♯')pc++;if(m[2]==='b'||m[2]==='♭')pc--;return(pc+12)%12}function load(){let a=bars[page*2]||[],b=bars[page*2+1]||[];seq=[...a,...b];split=a.length;idx=0;match=0;armed=true;pg.textContent=(page*2+1)+'–'+Math.min(page*2+2,bars.length)+'小節';bt1.textContent=(page*2+1)+'小節目';bt2.textContent=(page*2+2)+'小節目';c1.textContent=chs[page*2]||'—';c2.textContent=chs[page*2+1]||'—';r1.textContent=chs[page*2]?'R = '+N[chordPc(chs[page*2])]:' ';r2.textContent=chs[page*2+1]?'R = '+N[chordPc(chs[page*2+1])]:' ';draw()}function draw(){b1.innerHTML='';b2.innerHTML='';seq.forEach((x,i)=>{let s=document.createElement('span');s.className='d'+(i<idx?' ok':i===idx?' now':'');s.textContent=x.l;(i<split?b1:b2).appendChild(s)});pr.style.width=(seq.length?idx/seq.length*100:0)+'%';if(seq.length&&idx>=seq.length&&(page+1)*2<bars.length){page++;load();return}prev.disabled=page===0;next.disabled=(page+1)*2>=bars.length}function cp(){return chordPc(chs[idx<split?page*2:page*2+1])}function accept(pc){if(idx>=seq.length||!armed)return;if(pc===(cp()+seq[idx].s)%12){if(++match>=4){idx++;match=0;armed=false;draw()}}else match=0}function yin(x,sr){let n=x.length,mean=0;for(let v of x)mean+=v;mean/=n;let rms=0,y=new Float32Array(n);for(let i=0;i<n;i++){y[i]=x[i]-mean;rms+=y[i]*y[i]}rms=Math.sqrt(rms/n);if(rms<.0005)return{f:-1,r:rms,p:0};let min=Math.floor(sr/1400),max=Math.min(Math.floor(sr/75),n>>1),d=new Float32Array(max+1),c=new Float32Array(max+1);for(let t=1;t<=max;t++){let s=0;for(let i=0;i<n-t;i++){let q=y[i]-y[i+t];s+=q*q}d[t]=s}let run=0,b=-1,bv=1;for(let t=1;t<=max;t++){run+=d[t];c[t]=run?d[t]*t/run:1;if(t>=min&&c[t]<.18){while(t+1<=max&&c[t+1]<c[t])t++;b=t;bv=c[t];break}if(t>=min&&c[t]<bv){b=t;bv=c[t]}}if(b<0||bv>.4)return{f:-1,r:rms,p:1-bv};let tau=b;if(b>1&&b<max){let a=c[b-1],z=c[b+1],den=a+z-2*c[b];if(Math.abs(den)>1e-9)tau=b+(a-z)/(2*den)}return{f:sr/tau,r:rms,p:1-bv}}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let p=yin(buf,ctx.sampleRate),pct=Math.min(100,p.r*2500);lev.style.width=pct+'%';if(p.r<.0012){armed=true;last=-1;match=0}if(p.f>75&&p.f<1400){let f=p.f*Math.pow(2,cal/1200),m=69+12*Math.log2(f/440),mr=Math.round(m),pc=(mr%12+12)%12,cent=Math.round(100*(m-mr));note.textContent=N[pc];cd.textContent=D[(pc-cp()+12)%12];diag.textContent=f.toFixed(1)+' Hz ／ '+cent+' cent ／ 信頼 '+Math.round(p.p*100)+'%';if(!armed&&last!==-1&&pc!==last)armed=true;last=pc;if(p.p>.55&&Math.abs(cent)<48)accept(pc)}else diag.textContent='入力 '+pct.toFixed(0)+'% ／ 検出待ち';raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');dev.innerHTML='';ds.forEach((d,i)=>dev.add(new Option(d.label||'入力 '+(i+1),d.deviceId)));dev.disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))dev.value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};active.textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);loop();await list(set.deviceId||id||'')}ib.onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}ib.textContent='ギター入力 ON';st.textContent='入力OFF'}else try{await open('');ib.textContent='ギター入力 OFF';st.textContent='入力中'}catch(e){st.textContent='入力エラー '+e.message}};dev.onchange=()=>open(dev.value);retry.onclick=load;prev.onclick=()=>{if(page){page--;load()}};next.onclick=()=>{if((page+1)*2<bars.length){page++;load()}};load()})();</script></body></html>
