<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Track 02 Degree Quiz v4</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:800px;margin:auto;padding:10px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:13px;margin-bottom:9px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:43px;padding:8px;font:inherit}.song{font-size:21px;font-weight:900}.small{font-size:12px;color:#aaa}.ok{color:#6ee787}.warn{color:#ff7b72}.calval{color:#58a6ff;font-weight:800}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{border:1px solid #333;border-radius:12px;padding:10px;min-height:135px}.chord{text-align:center;font-size:25px;font-weight:900}.root{text-align:center;color:#58a6ff;font-size:12px;font-weight:800}.degs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}.d{font-size:23px;font-weight:850;color:#555;min-width:40px;text-align:center}.d.now{color:#168bff}.d.ok{color:#fff}.detect{text-align:center;margin-top:14px;font-size:17px}.meter,.prog{height:8px;background:#222;border-radius:9px;overflow:hidden;margin-top:9px}.meter div{height:100%;background:#888}.prog div{height:100%;background:#fff}.nav{display:flex;gap:6px;margin-top:10px}.nav button{flex:1}</style></head><body><div class="app"><div class="p"><div class="row"><div class="song">Track 02 度数テスト v4</div><button id="inputBtn" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="device" style="width:100%;margin-top:8px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ <span id="inputStatus">入力OFF</span></div><div class="row" style="margin-top:10px"><select id="calNote"><option value="48">C3（5弦3F）</option><option value="40">E2（6弦開放）</option><option value="45">A2（5弦開放）</option><option value="50">D3（4弦開放）</option><option value="55">G3（3弦開放）</option><option value="59">B3（2弦開放）</option><option value="64">E4（1弦開放）</option></select><button id="calBtn" class="btn">1秒測って補正</button><button id="clearBtn" class="btn">補正解除</button></div><div class="small">現在の補正：<span id="calValue" class="calval">0 cent</span></div><div id="calMsg" class="small">基準音を鳴らし続けながら補正してください。</div></div><div class="p"><div id="pageInfo" class="small" style="text-align:center"></div><div class="bars"><div class="bar"><div id="barNo1" class="small"></div><div id="chord1" class="chord"></div><div id="root1" class="root"></div><div id="deg1" class="degs"></div></div><div class="bar"><div id="barNo2" class="small"></div><div id="chord2" class="chord"></div><div id="root2" class="root"></div><div id="deg2" class="degs"></div></div></div><div class="detect">検出：<b id="note">—</b>　Chord:<b id="degreeNow">—</b></div><div class="meter"><div id="level" style="width:0"></div></div><div id="diag" class="small" style="text-align:center;margin-top:6px">入力待ち</div><div class="prog"><div id="progress" style="width:0"></div></div><div class="nav"><button id="prev" class="btn">← 前</button><button id="retry" class="btn">やり直し</button><button id="next" class="btn">次 →</button></div></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),N=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],D=['R','m2','△2','m3','△3','P4','♭5','P5','m6','△6','m7','△7'];const el={inputBtn:$('inputBtn'),device:$('device'),active:$('active'),inputStatus:$('inputStatus'),calNote:$('calNote'),calBtn:$('calBtn'),clearBtn:$('clearBtn'),calValue:$('calValue'),calMsg:$('calMsg'),pageInfo:$('pageInfo'),barNo1:$('barNo1'),barNo2:$('barNo2'),chord1:$('chord1'),chord2:$('chord2'),root1:$('root1'),root2:$('root2'),deg1:$('deg1'),deg2:$('deg2'),note:$('note'),degreeNow:$('degreeNow'),level:$('level'),diag:$('diag'),progress:$('progress'),prev:$('prev'),retry:$('retry'),next:$('next')};const CH=['CMaj7','A7(E♭m7)','Dm7','G7(D♭m7)','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7(FMaj7♯5)','G7','CMaj7(G)','A7','Dm7','G7','CMaj7','A7(E♭)','Dm7','G7(D♭dim7)'];const TAB=[[[1,10],[1,7],[2,8],[3,9]],[[3,8],[2,7],[1,6],[1,9]],[[1,8],[1,5],[2,6],[3,7]],[[3,6],[2,5],[1,4],[1,7]],[[1,8],[1,7],[2,8],[2,6]],[[2,5],[3,7],[3,6],[2,5]],[[3,7],[2,5],[2,6],[2,8]],[[2,9],[2,7],[2,8],[2,6]],[[2,5],[2,6],[2,7],[1,5]],[[2,8],[2,6],[3,8],[3,6]],[[3,7],[4,7],[3,5],[4,7]],[[3,4],[4,7],[4,6],[4,4]],[[4,5],[5,8],[5,7],[5,5]],[[5,4],[5,6],[5,7],[4,5]],[[5,8],[4,7],[3,6],[2,5]],[[3,7],[2,6],[2,9],[2,7]],[[2,8],[1,7],[1,10],[1,8]],[[1,9],[1,6],[1,5],[2,8]],[[2,6],[1,5],[1,8],[1,6]],[[1,7],[2,9],[2,8],[3,10]],[[3,9],[2,8],[1,7],[2,10]],[[1,6],[2,8],[2,6],[3,8]],[[3,7],[2,6],[1,5],[1,8]],[[1,9],[2,8],[1,6],[1,9]]];const OPEN=[0,4,9,2,7,11,4];function rootPc(s){const m=s.match(/^([A-G])([♯#♭b]?)/);let p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='♯'||m[2]==='#')p++;if(m[2]==='♭'||m[2]==='b')p--;return(p+12)%12}function altRootPc(s){const m=s.match(/\(([A-G])([♯#♭b]?)/);if(!m)return null;let p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='♯'||m[2]==='#')p++;if(m[2]==='♭'||m[2]==='b')p--;return(p+12)%12}const BARS=TAB.map((bar,i)=>bar.map(([s,f])=>{const pc=(OPEN[s]+f)%12,r=rootPc(CH[i]),ar=altRootPc(CH[i]),main=D[(pc-r+12)%12];return{pc,label:ar===null?main:main+'('+D[(pc-ar+12)%12]+')'}}));let page=0,seq=[],split=0,index=0,ctx=null,analyser=null,stream=null,buf=null,raf=0,match=0,armed=true,lastPc=-1,calibrating=false,calSamples=[],calCents=0;try{calCents=Number(localStorage.getItem('guitarPitchCalCentsV3')||0)}catch(e){}function showCal(){el.calValue.textContent=(calCents>=0?'+':'')+Math.round(calCents)+' cent'}showCal();function load(){const a=BARS[page*2]||[],b=BARS[page*2+1]||[];seq=[...a,...b];split=a.length;index=0;match=0;armed=true;el.pageInfo.textContent=(page*2+1)+'–'+Math.min(page*2+2,BARS.length)+'小節 ／ 全24小節';el.barNo1.textContent=(page*2+1)+'小節目';el.barNo2.textContent=(page*2+2)+'小節目';el.chord1.textContent=CH[page*2]||'—';el.chord2.textContent=CH[page*2+1]||'—';el.root1.textContent=CH[page*2]?'R = '+N[rootPc(CH[page*2])]:' ';el.root2.textContent=CH[page*2+1]?'R = '+N[rootPc(CH[page*2+1])]:' ';draw()}function draw(){el.deg1.innerHTML='';el.deg2.innerHTML='';seq.forEach((x,i)=>{const s=document.createElement('span');s.className='d'+(i<index?' ok':i===index?' now':'');s.textContent=x.label;(i<split?el.deg1:el.deg2).appendChild(s)});el.progress.style.width=((page*8+index)/(BARS.length*4)*100)+'%';if(index>=seq.length&&(page+1)*2<BARS.length){page++;load();return}el.prev.disabled=page===0;el.next.disabled=(page+1)*2>=BARS.length}function currentBar(){return index<split?page*2:page*2+1}function accept(pc){if(index>=seq.length||!armed||calibrating)return;if(pc===seq[index].pc){if(++match>=4){index++;match=0;armed=false;draw()}}else match=0}function yin(x,sr){const n=x.length;let mean=0;for(let i=0;i<n;i++)mean+=x[i];mean/=n;let rms=0,y=new Float32Array(n);for(let i=0;i<n;i++){y[i]=x[i]-mean;rms+=y[i]*y[i]}rms=Math.sqrt(rms/n);if(rms<.0005)return{f:-1,r:rms,p:0};const min=Math.floor(sr/1400),max=Math.min(Math.floor(sr/75),n>>1),d=new Float32Array(max+1),c=new Float32Array(max+1);for(let t=1;t<=max;t++){let s=0;for(let i=0;i<n-t;i++){const q=y[i]-y[i+t];s+=q*q}d[t]=s}let run=0,best=-1,bv=1;for(let t=1;t<=max;t++){run+=d[t];c[t]=run?d[t]*t/run:1;if(t>=min&&c[t]<.18){while(t+1<=max&&c[t+1]<c[t])t++;best=t;bv=c[t];break}if(t>=min&&c[t]<bv){best=t;bv=c[t]}}if(best<0||bv>.4)return{f:-1,r:rms,p:1-bv};let tau=best;if(best>1&&best<max){const a=c[best-1],b=c[best],z=c[best+1],den=a+z-2*b;if(Math.abs(den)>1e-9)tau=best+(a-z)/(2*den)}return{f:sr/tau,r:rms,p:1-bv}}function loop(){if(!analyser)return;analyser.getFloatTimeDomainData(buf);const p=yin(buf,ctx.sampleRate),pct=Math.min(100,p.r*2500);el.level.style.width=pct+'%';if(p.r<.0012){armed=true;lastPc=-1;match=0}if(p.f>75&&p.f<1400){if(calibrating&&p.p>.5)calSamples.push(p.f);const f=p.f*Math.pow(2,calCents/1200),m=69+12*Math.log2(f/440),mr=Math.round(m),pc=(mr%12+12)%12,cent=Math.round(100*(m-mr));el.note.textContent=N[pc];const bi=currentBar(),r=rootPc(CH[bi]),ar=altRootPc(CH[bi]);el.degreeNow.textContent=D[(pc-r+12)%12]+(ar===null?'':'('+D[(pc-ar+12)%12]+')');el.diag.textContent=f.toFixed(1)+' Hz ／ '+cent+' cent ／ 信頼 '+Math.round(p.p*100)+'% ／ 生 '+p.f.toFixed(1)+'Hz';if(!armed&&lastPc!==-1&&pc!==lastPc)armed=true;lastPc=pc;if(p.p>.55&&Math.abs(cent)<48)accept(pc)}else el.diag.textContent='入力 '+pct.toFixed(0)+'% ／ 検出待ち';raf=requestAnimationFrame(loop)}async function listDevices(id){const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');el.device.innerHTML='';ds.forEach((d,i)=>el.device.add(new Option(d.label||'入力 '+(i+1),d.deviceId)));el.device.disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))el.device.value=id}async function openInput(id){if(stream)stream.getTracks().forEach(t=>t.stop());const audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});const tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};el.active.textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();const src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=4096;buf=new Float32Array(analyser.fftSize);src.connect(analyser);cancelAnimationFrame(raf);loop();await listDevices(set.deviceId||id||'')}el.inputBtn.onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;analyser=null;if(ctx){await ctx.close();ctx=null}el.inputBtn.textContent='ギター入力 ON';el.inputStatus.textContent='入力OFF';return}try{await openInput('');el.inputBtn.textContent='ギター入力 OFF';el.inputStatus.textContent='入力中'}catch(err){el.inputStatus.textContent='入力エラー '+err.message}};el.device.onchange=()=>openInput(el.device.value);el.calBtn.onclick=async()=>{if(!stream){el.calMsg.textContent='先にギター入力をONにしてください。';el.calMsg.className='small warn';return}calSamples=[];calibrating=true;el.calMsg.textContent='測定中…基準音を1秒鳴らし続けてください';el.calMsg.className='small';await new Promise(r=>setTimeout(r,1000));calibrating=false;if(calSamples.length<5){el.calMsg.textContent='測定できません。もう一度試してください。';el.calMsg.className='small warn';return}calSamples.sort((a,b)=>a-b);const raw=calSamples[Math.floor(calSamples.length/2)],midi=+el.calNote.value,target=440*Math.pow(2,(midi-69)/12);calCents=1200*Math.log2(target/raw);try{localStorage.setItem('guitarPitchCalCentsV3',String(calCents))}catch(e){}showCal();el.calMsg.textContent='✓ 補正完了：生 '+raw.toFixed(1)+'Hz → '+target.toFixed(1)+'Hz';el.calMsg.className='small ok'};el.clearBtn.onclick=()=>{calCents=0;try{localStorage.removeItem('guitarPitchCalCentsV3')}catch(e){}showCal();el.calMsg.textContent='補正を解除しました';el.calMsg.className='small'};el.retry.onclick=load;el.prev.onclick=()=>{if(page){page--;load()}};el.next.onclick=()=>{if((page+1)*2<BARS.length){page++;load()}};load()})();</script></body></html>
