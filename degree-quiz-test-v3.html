<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Degree Quiz v3</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:760px;margin:auto;padding:10px}.panel{background:#0c0c0c;border:1px solid #303030;border-radius:16px;padding:14px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ctl{min-height:44px;border:1px solid #444;background:#171717;color:#fff;border-radius:10px;padding:0 12px;font:inherit}.ctl.on{background:#fff;color:#000}.field{display:flex;flex-direction:column;gap:4px}.field span,.small{font-size:12px;color:#aaa}.wide{width:100%}.wide select{width:100%}.root{text-align:center;font-size:64px;font-weight:900}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{border:1px solid #333;border-radius:12px;padding:10px;min-height:110px}.title{font-size:12px;color:#888}.degrees{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.deg{font-size:28px;font-weight:800;color:#555}.deg.current{color:#168bff}.deg.done{color:#fff}.detect{text-align:center;font-size:18px;margin-top:16px}.meter{height:8px;background:#222;border-radius:999px;overflow:hidden;margin-top:10px}.meter>div{height:100%;background:#888;width:0}.status{text-align:center;color:#aaa;font-size:12px;margin-top:8px;line-height:1.6}.calbox{border-color:#46566b}.calval{color:#58a6ff;font-weight:800}.ok{color:#6ee787}.warn{color:#ff7b72}.progress{height:8px;background:#222;border-radius:999px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:#fff;width:0}.done{display:none;text-align:center;font-size:24px;font-weight:900;margin-top:12px}.done.show{display:block}@media(max-width:560px){.bars{grid-template-columns:1fr 1fr}.deg{font-size:25px}.root{font-size:56px}}</style></head><body><div class="app"><div class="panel"><div class="row"><button id="inputBtn" class="ctl">ギター入力 ON</button><label class="field"><span>Root</span><select id="root" class="ctl"></select></label><button id="resetBtn" class="ctl">最初から</button></div><label class="field wide" style="margin-top:8px"><span>入力デバイス</span><select id="device" class="ctl" disabled><option>入力ON後に取得</option></select></label><div class="small" style="margin-top:8px">使用中：<b id="active">—</b>　<span id="inputStatus">入力OFF</span></div></div><div class="panel calbox"><div style="font-weight:800">キャリブレーション v3</div><div class="row" style="margin-top:8px"><label class="field"><span>基準音</span><select id="calNote" class="ctl"><option value="48">C3（5弦3F）</option><option value="40">E2（6弦開放）</option><option value="45">A2（5弦開放）</option><option value="50">D3（4弦開放）</option><option value="55">G3（3弦開放）</option><option value="59">B3（2弦開放）</option><option value="64">E4（1弦開放）</option></select></label><button id="calBtn" class="ctl">1秒測って補正</button><button id="clearBtn" class="ctl">補正解除</button></div><div class="small">現在の補正：<span id="calValue" class="calval">0 cent</span></div><div id="calMsg" class="small">基準音を鳴らし続けながら「1秒測って補正」を押してください。</div></div><div class="panel"><div style="text-align:center;color:#aaa;font-size:12px">ROOT / KEY</div><div id="rootBig" class="root">C</div><div class="bars"><div class="bar"><div class="title">1小節目</div><div id="bar1" class="degrees"></div></div><div class="bar"><div class="title">2小節目</div><div id="bar2" class="degrees"></div></div></div><div class="detect">検出：<b id="detNote">—</b> <span id="detFreq">— Hz</span> <span id="detDeg">—</span></div><div class="meter"><div id="level"></div></div><div id="diag" class="status">入力レベル 0%</div><div class="progress"><div id="progress"></div></div><div id="done" class="done">2小節クリア ✓</div></div></div><script>(()=>{'use strict';const NOTES=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],DEG=['R','m2','△2','m3','△3','P4','♭5','P5','m6','△6','m7','△7'],SEQ=[0,2,4,7,9,7,4,0],$=id=>document.getElementById(id),root=$('root');NOTES.forEach((n,i)=>root.add(new Option(n,i)));let ctx,analyser,stream,buf,raf=0,currentDevice='',lastRaw=-1,lastConf=0,calSamples=[],calibrating=false,index=0,match=0,armed=true,lastPc=-1;let calCents=0;try{calCents=Number(localStorage.getItem('guitarPitchCalCentsV3')||0)}catch(e){}const e={btn:$('inputBtn'),dev:$('device'),active:$('active'),st:$('inputStatus'),cv:$('calValue'),cm:$('calMsg'),dn:$('detNote'),df:$('detFreq'),dd:$('detDeg'),level:$('level'),diag:$('diag'),prog:$('progress'),done:$('done')};function setCal(){e.cv.textContent=(calCents>=0?'+':'')+Math.round(calCents)+' cent'}setCal();function draw(){for(const id of ['bar1','bar2'])$(id).innerHTML='';SEQ.forEach((semi,i)=>{const s=document.createElement('span');s.className='deg'+(i<index?' done':i===index?' current':'');s.textContent=DEG[semi];$(i<4?'bar1':'bar2').appendChild(s)});e.prog.style.width=(index/SEQ.length*100)+'%';e.done.classList.toggle('show',index>=SEQ.length)}draw();function reset(){index=0;match=0;armed=true;draw()}function yin(x,sr){const n=x.length;let mean=0;for(let i=0;i<n;i++)mean+=x[i];mean/=n;let rms=0,y=new Float32Array(n);for(let i=0;i<n;i++){y[i]=x[i]-mean;rms+=y[i]*y[i]}rms=Math.sqrt(rms/n);if(rms<.0005)return{f:-1,r:rms,p:0};const min=Math.floor(sr/1400),max=Math.min(Math.floor(sr/75),n>>1),d=new Float32Array(max+1),c=new Float32Array(max+1);for(let t=1;t<=max;t++){let s=0;for(let i=0;i<n-t;i++){const q=y[i]-y[i+t];s+=q*q}d[t]=s}let run=0,best=-1,bv=1;for(let t=1;t<=max;t++){run+=d[t];c[t]=run?d[t]*t/run:1;if(t>=min&&c[t]<.18){while(t+1<=max&&c[t+1]<c[t])t++;best=t;bv=c[t];break}if(t>=min&&c[t]<bv){best=t;bv=c[t]}}if(best<0||bv>.4)return{f:-1,r:rms,p:1-bv};let tau=best;if(best>1&&best<max){const a=c[best-1],b=c[best],z=c[best+1],den=a+z-2*b;if(Math.abs(den)>1e-9)tau=best+(a-z)/(2*den)}return{f:sr/tau,r:rms,p:1-bv}}function accept(pc){if(index>=SEQ.length||!armed)return;const target=(+root.value+SEQ[index])%12;if(pc===target){if(++match>=4){index++;match=0;armed=false;draw()}}else match=0}function loop(){if(!analyser)return;analyser.getFloatTimeDomainData(buf);const p=yin(buf,ctx.sampleRate),pct=Math.min(100,p.r*2500);e.level.style.width=pct+'%';if(p.r<.0012){armed=true;lastPc=-1;match=0}if(p.f>75&&p.f<1400){lastRaw=p.f;lastConf=p.p;if(calibrating&&p.p>.5)calSamples.push(p.f);const corrected=p.f*Math.pow(2,calCents/1200),m=69+12*Math.log2(corrected/440),mr=Math.round(m),pc=(mr%12+12)%12,cent=Math.round(100*(m-mr));e.dn.textContent=NOTES[pc];e.df.textContent=corrected.toFixed(1)+' Hz';e.dd.textContent=DEG[(pc-root.value+12)%12];e.diag.textContent='入力 '+pct.toFixed(0)+'% ／ 信頼 '+Math.round(p.p*100)+'% ／ '+cent+' cent ／ 生 '+p.f.toFixed(1)+'Hz';if(!armed&&lastPc!==-1&&pc!==lastPc)armed=true;lastPc=pc;if(!calibrating&&p.p>.55&&Math.abs(cent)<48)accept(pc)}else e.diag.textContent='入力 '+pct.toFixed(0)+'% ／ 検出待ち';raf=requestAnimationFrame(loop)}async function list(id){const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');e.dev.innerHTML='';ds.forEach((d,i)=>e.dev.add(new Option(d.label||'入力 '+(i+1),d.deviceId)));e.dev.disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))e.dev.value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());const audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});const tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};currentDevice=set.deviceId||id||'';e.active.textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();const src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=4096;buf=new Float32Array(analyser.fftSize);src.connect(analyser);cancelAnimationFrame(raf);loop();await list(currentDevice)}e.btn.onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;analyser=null;if(ctx){await ctx.close();ctx=null}e.btn.textContent='ギター入力 ON';e.btn.classList.remove('on');e.st.textContent='入力OFF';return}try{await open('');e.btn.textContent='ギター入力 OFF';e.btn.classList.add('on');e.st.textContent='入力中'}catch(err){e.st.textContent='入力エラー '+err.message}};e.dev.onchange=()=>open(e.dev.value);$('calBtn').onclick=async()=>{if(!stream){e.cm.textContent='先にギター入力をONにしてください。';e.cm.className='small warn';return}calSamples=[];calibrating=true;e.cm.textContent='測定中…基準音を1秒鳴らし続けてください';e.cm.className='small';await new Promise(r=>setTimeout(r,1000));calibrating=false;if(calSamples.length<5){e.cm.textContent='測定できません。もう一度、音を鳴らしながら押してください。';e.cm.className='small warn';return}calSamples.sort((a,b)=>a-b);const raw=calSamples[Math.floor(calSamples.length/2)],midi=+$('calNote').value,target=440*Math.pow(2,(midi-69)/12);calCents=1200*Math.log2(target/raw);try{localStorage.setItem('guitarPitchCalCentsV3',String(calCents))}catch(err){}setCal();e.cm.textContent='✓ 補正完了：生 '+raw.toFixed(1)+'Hz → '+target.toFixed(1)+'Hz';e.cm.className='small ok'};$('clearBtn').onclick=()=>{calCents=0;try{localStorage.removeItem('guitarPitchCalCentsV3')}catch(err){}setCal();e.cm.textContent='補正を解除しました';e.cm.className='small'};root.onchange=()=>{$('rootBig').textContent=NOTES[+root.value];reset()};$('resetBtn').onclick=reset;})();</script></body></html>
