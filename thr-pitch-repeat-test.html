<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>THR A/D/G Repeat Test</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:820px;margin:auto;padding:12px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:14px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:44px;padding:8px;font:inherit}.blue{color:#58a6ff}.small{font-size:12px;color:#aaa}.big{text-align:center;font-size:38px;font-weight:900}.meter{height:9px;background:#222;border-radius:8px;overflow:hidden;margin-top:8px}.meter div{height:100%;background:#aaa}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:1px solid #333;border-radius:11px;padding:10px;text-align:center}.card.active{border-color:#58a6ff}.good{color:#6ee787}.warn{color:#ffb86c}.bad{color:#ff7b72}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 4px;border-bottom:1px solid #292929;text-align:right}th:first-child,td:first-child{text-align:left}.done{color:#6ee787;font-weight:800}@media(max-width:560px){.big{font-size:32px}table{font-size:12px}}</style></head><body><div class="app"><div class="p"><div class="row"><b style="font-size:21px">THR A/D/G 3回テスト</b><button id="on" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:8px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ sampleRate：<b id="sr" class="blue">—</b> Hz</div><div class="small">補正なし。5弦A2→4弦D3→3弦G3を各3回測ります。</div></div><div class="p"><div class="big"><span id="target">5弦 A2</span> <span id="count" class="blue">1/3</span></div><div class="small" style="text-align:center">基準 <span id="ref">110.00</span> Hz ／ 普通に1回弾いて約1.2秒伸ばす</div><div class="grid" id="cards" style="margin-top:10px"></div><div class="meter"><div id="lev" style="width:0"></div></div><div class="small" style="text-align:center;margin-top:6px">現在：<b id="note">—</b> ／ <span id="hz">—</span> Hz ／ confidence <span id="conf">—</span>%</div><div id="status" class="small" style="text-align:center;margin-top:8px">入力をONにしてください。</div></div><div class="p"><table><thead><tr><th>対象 / 回</th><th>Attack</th><th>+0.3s</th><th>+1.0s</th></tr></thead><tbody id="rows"></tbody></table><div id="summary" class="small" style="margin-top:10px">A・D・G各3回が終わると平均を表示します。</div><div class="row" style="margin-top:10px"><button id="reset" class="btn">最初から</button></div></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id);const T=[{s:'5弦',n:'A2',f:110},{s:'4弦',n:'D3',f:146.8324},{s:'3弦',n:'G3',f:195.9977}];let ctx,an,buf,stream,raf=0,ti=0,trial=null,records=T.map(()=>[]),prevR=0,lastQuiet=0;function yin(x,sr){let n=x.length,mean=0;for(let v of x)mean+=v;mean/=n;let rms=0,y=new Float32Array(n);for(let i=0;i<n;i++){y[i]=x[i]-mean;rms+=y[i]*y[i]}rms=Math.sqrt(rms/n);if(rms<.00025)return{f:-1,r:rms,p:0};let min=Math.floor(sr/1400),max=Math.min(Math.floor(sr/70),n>>1),d=new Float32Array(max+1),c=new Float32Array(max+1);for(let t=1;t<=max;t++){let z=0;for(let i=0;i<n-t;i++){let q=y[i]-y[i+t];z+=q*q}d[t]=z}let run=0,b=-1,bv=1;for(let t=1;t<=max;t++){run+=d[t];c[t]=run?d[t]*t/run:1;if(t>=min&&c[t]<.18){while(t+1<=max&&c[t+1]<c[t])t++;b=t;bv=c[t];break}if(t>=min&&c[t]<bv){b=t;bv=c[t]}}if(b<0||bv>.45)return{f:-1,r:rms,p:1-bv};let tau=b;if(b>1&&b<max){let a=c[b-1],z=c[b+1],den=a+z-2*c[b];if(Math.abs(den)>1e-9)tau=b+(a-z)/(2*den)}return{f:sr/tau,r:rms,p:1-bv}}function cents(f,t){return 1200*Math.log2(f/t)}function cls(c){c=Math.abs(c);return c<=20?'good':c<=50?'warn':'bad'}function fmt(v,t){if(!v)return'—';let c=cents(v,t);return `<span class="${cls(c)}">${v.toFixed(1)}<br><small>${c>=0?'+':''}${Math.round(c)}c</small></span>`}function nearest(f){let m=Math.round(69+12*Math.log2(f/440)),N=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];return N[(m%12+12)%12]+(Math.floor(m/12)-1)}function avg(a,k){let v=a.map(x=>x[k]).filter(Boolean);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null}function draw(){let t=T[ti]||T[T.length-1],done=records.every(x=>x.length>=3);$('target').textContent=done?'測定完了':t.s+' '+t.n;$('count').textContent=done?'':(records[ti].length+1)+'/3';$('ref').textContent=t.f.toFixed(2);$('cards').innerHTML=T.map((x,i)=>`<div class="card ${i===ti&&!done?'active':''}"><b>${x.s} ${x.n}</b><br><span class="small">${x.f.toFixed(2)} Hz</span><br><span class="${records[i].length>=3?'done':'small'}">${records[i].length}/3</span></div>`).join('');let rows='';T.forEach((x,i)=>{for(let j=0;j<3;j++){let r=records[i][j]||{};rows+=`<tr><td>${x.n} ${j+1}回目</td><td>${fmt(r.a,x.f)}</td><td>${fmt(r.b,x.f)}</td><td>${fmt(r.c,x.f)}</td></tr>`}});$('rows').innerHTML=rows;if(done){let s=T.map((x,i)=>{let A=avg(records[i],'a'),B=avg(records[i],'b'),C=avg(records[i],'c');return `${x.n}平均：Attack ${A?A.toFixed(1):'—'}Hz (${A?Math.round(cents(A,x.f)):'—'}c) ／ 0.3s ${B?B.toFixed(1):'—'}Hz (${B?Math.round(cents(B,x.f)):'—'}c) ／ 1.0s ${C?C.toFixed(1):'—'}Hz (${C?Math.round(cents(C,x.f)):'—'}c)`}).join('<br>');$('summary').innerHTML=s;$('status').textContent='完了。画面をスクリーンショットしてください。'}else $('summary').textContent='A・D・G各3回が終わると平均を表示します。'}function saveTrial(){records[ti].push({a:trial.a,b:trial.b,c:trial.c});trial=null;if(records[ti].length>=3&&ti<T.length-1)ti++;draw();if(records.every(x=>x.length>=3))return;$('status').textContent=T[ti].s+' '+T[ti].n+' を弾いてください。'}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let p=yin(buf,ctx.sampleRate),now=performance.now(),r=p.r;$('lev').style.width=Math.min(100,r*2500)+'%';if(r<.0004)lastQuiet=now;if(p.f>65&&p.f<1400){$('note').textContent=nearest(p.f);$('hz').textContent=p.f.toFixed(2);$('conf').textContent=Math.round(p.p*100)}let done=records.every(x=>x.length>=3);let attack=!done&&!trial&&r>.00055&&(now-lastQuiet<220||r>prevR*1.55);if(attack){trial={t:now,s:[],a:null,b:null,c:null};$('status').textContent='測定中…そのまま1秒伸ばしてください。'}if(trial&&p.f>65&&p.f<1400&&p.p>.35){let dt=now-trial.t;trial.s.push({dt,f:p.f});function med(lo,hi){let a=trial.s.filter(x=>x.dt>=lo&&x.dt<=hi).map(x=>x.f).sort((a,b)=>a-b);return a.length?a[Math.floor(a.length/2)]:null}if(dt>130&&!trial.a)trial.a=med(40,130);if(dt>420&&!trial.b)trial.b=med(260,420);if(dt>1120&&!trial.c){trial.c=med(900,1120);saveTrial()}}if(trial&&now-trial.t>1400)saveTrial();prevR=r;raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('dev').innerHTML='';ds.forEach((d,i)=>$('dev').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('dev').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('dev').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('sr').textContent=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);lastQuiet=performance.now();loop();await list(set.deviceId||id||'')} $('on').onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}$('on').textContent='ギター入力 ON';$('status').textContent='入力OFF'}else try{await open('');$('on').textContent='ギター入力 OFF';$('status').textContent=T[ti].s+' '+T[ti].n+' を弾いてください。'}catch(e){$('status').textContent='入力エラー：'+e.message}};$('dev').onchange=()=>open($('dev').value);$('reset').onclick=()=>{ti=0;trial=null;records=T.map(()=>[]);draw();$('status').textContent='5弦 A2から始めます。'};draw()})();</script></body></html>
