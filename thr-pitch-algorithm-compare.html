<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>THR Pitch Algorithm Compare</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:820px;margin:auto;padding:12px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:14px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:44px;padding:8px;font:inherit}.blue{color:#58a6ff}.small{font-size:12px;color:#aaa}.alg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{border:1px solid #333;border-radius:12px;padding:12px;text-align:center}.name{font-size:16px;color:#aaa}.note{font-size:38px;font-weight:900}.hz{font-size:21px;font-weight:800}.meter{height:9px;background:#222;border-radius:8px;overflow:hidden;margin-top:8px}.meter div{height:100%;background:#aaa}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{font-weight:800}.good{color:#6ee787}.warn{color:#ffb86c}.bad{color:#ff7b72}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px 3px;border-bottom:1px solid #292929;text-align:center}th:first-child,td:first-child{text-align:left}@media(max-width:560px){.note{font-size:31px}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="app"><div class="p"><div class="row"><b style="font-size:21px">THR 検出方式 比較</b><button id="on" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:8px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ sampleRate：<b id="sr" class="blue">—</b> Hz ／ 補正なし</div></div><div class="p"><div class="alg"><div class="box"><div class="name">現在の YIN</div><div class="note" id="yn">—</div><div class="hz"><span id="yf">—</span> Hz</div><div id="yc" class="blue">—</div><div class="small">confidence <span id="yp">—</span>%</div></div><div class="box"><div class="name">正規化自己相関 NCCF</div><div class="note" id="an">—</div><div class="hz"><span id="af">—</span> Hz</div><div id="ac" class="blue">—</div><div class="small">score <span id="ap">—</span>%</div></div></div><div class="small" style="text-align:center;margin-top:8px">RMS <span id="rms">—</span></div><div class="meter"><div id="lev" style="width:0"></div></div></div><div class="p"><div class="small" style="margin-bottom:8px">弦を選び、普通に1回弾いて約1秒伸ばしてください。YINとNCCFを同じ波形で同時測定します。</div><div class="grid" id="strings"></div><div class="row" style="margin-top:9px"><button id="clear" class="btn">記録クリア</button><span id="status" class="small">弦を選んでください。</span></div></div><div class="p"><table><thead><tr><th>対象</th><th>時点</th><th>YIN</th><th>NCCF</th><th>差</th></tr></thead><tbody id="rows"></tbody></table><div class="small" style="margin-top:8px">各セルは Hz / 基準音からのcent。両方式が同時に同じ方向へズレるか、YINだけ誤るかを確認します。</div></div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),S=[{s:'6弦',n:'E2',f:82.4069},{s:'5弦',n:'A2',f:110},{s:'4弦',n:'D3',f:146.8324},{s:'3弦',n:'G3',f:195.9977},{s:'2弦',n:'B3',f:246.9417},{s:'1弦',n:'E4',f:329.6276}],NN=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];let ctx,an,buf,stream,raf=0,target=-1,trial=null,prevR=0,lastQuiet=0,rows=[];function prep(x){let n=x.length,m=0;for(let v of x)m+=v;m/=n;let y=new Float32Array(n),r=0;for(let i=0;i<n;i++){y[i]=x[i]-m;r+=y[i]*y[i]}return{y,r:Math.sqrt(r/n)}}function yin(y,sr,r){if(r<.00025)return{f:-1,p:0};let n=y.length,min=Math.floor(sr/1400),max=Math.min(Math.floor(sr/70),n>>1),d=new Float32Array(max+1),c=new Float32Array(max+1);for(let t=1;t<=max;t++){let z=0;for(let i=0;i<n-t;i++){let q=y[i]-y[i+t];z+=q*q}d[t]=z}let run=0,b=-1,bv=1;for(let t=1;t<=max;t++){run+=d[t];c[t]=run?d[t]*t/run:1;if(t>=min&&c[t]<.18){while(t+1<=max&&c[t+1]<c[t])t++;b=t;bv=c[t];break}if(t>=min&&c[t]<bv){b=t;bv=c[t]}}if(b<0||bv>.45)return{f:-1,p:1-bv};let tau=b;if(b>1&&b<max){let a=c[b-1],z=c[b+1],den=a+z-2*c[b];if(Math.abs(den)>1e-9)tau=b+(a-z)/(2*den)}return{f:sr/tau,p:1-bv}}function nccf(y,sr,r){if(r<.00025)return{f:-1,p:0};let n=y.length,min=Math.floor(sr/1400),max=Math.min(Math.floor(sr/70),n>>1),best=-1,bs=-1,scores=new Float32Array(max+1);for(let t=min;t<=max;t++){let xy=0,aa=0,bb=0,lim=n-t;for(let i=0;i<lim;i++){let a=y[i],b=y[i+t];xy+=a*b;aa+=a*a;bb+=b*b}let s=(aa>0&&bb>0)?xy/Math.sqrt(aa*bb):0;scores[t]=s;if(s>bs){bs=s;best=t}}if(best<0||bs<.35)return{f:-1,p:bs};let tau=best;if(best>min&&best<max){let a=scores[best-1],b=scores[best],c=scores[best+1],den=a-2*b+c;if(Math.abs(den)>1e-9)tau=best+.5*(a-c)/den}return{f:sr/tau,p:bs}}function cents(f,t){return 1200*Math.log2(f/t)}function nearest(f){let m=Math.round(69+12*Math.log2(f/440));return NN[(m%12+12)%12]+(Math.floor(m/12)-1)}function cl(c){c=Math.abs(c);return c<=20?'good':c<=50?'warn':'bad'}function fmt(f,t){if(!f||f<0)return'—';let c=cents(f,t);return`<span class="${cl(c)}">${f.toFixed(1)}<br>${c>=0?'+':''}${Math.round(c)}c</span>`}function draw(){let b=$('strings');b.innerHTML='';S.forEach((x,i)=>{let q=document.createElement('button');q.className='btn card';q.innerHTML=`${x.s} ${x.n}<br><span class="small">${x.f.toFixed(2)}Hz</span>`;if(i===target)q.style.borderColor='#58a6ff';q.onclick=()=>{target=i;trial=null;$('status').textContent=x.s+' '+x.n+' を弾いてください。';draw()};b.appendChild(q)});$('rows').innerHTML=rows.slice(-18).map(r=>{let t=S[r.i].f,d=(r.y>0&&r.a>0)?1200*Math.log2(r.y/r.a):null;return`<tr><td>${S[r.i].s} ${S[r.i].n}</td><td>${r.when}</td><td>${fmt(r.y,t)}</td><td>${fmt(r.a,t)}</td><td>${d==null?'—':(d>=0?'+':'')+Math.round(d)+'c'}</td></tr>`}).join('')}function live(id,f,p){if(f>0){$(id+'n').textContent=nearest(f);$(id+'f').textContent=f.toFixed(2);let c=100*(69+12*Math.log2(f/440)-Math.round(69+12*Math.log2(f/440)));$(id+'c').textContent=(c>=0?'+':'')+Math.round(c)+' cent';$(id+'p').textContent=Math.round(p*100)}}function med(a,k){let z=a.map(x=>x[k]).filter(f=>f>0).sort((x,y)=>x-y);return z.length?z[Math.floor(z.length/2)]:null}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let now=performance.now(),pr=prep(buf),y=yin(pr.y,ctx.sampleRate,pr.r),a=nccf(pr.y,ctx.sampleRate,pr.r);$('rms').textContent=pr.r.toFixed(5);$('lev').style.width=Math.min(100,pr.r*2500)+'%';live('y',y.f,y.p);live('a',a.f,a.p);if(pr.r<.0004)lastQuiet=now;let attack=target>=0&&!trial&&pr.r>.00055&&(now-lastQuiet<220||pr.r>prevR*1.55);if(attack){trial={t:now,s:[],done:{}};$('status').textContent='測定中…1秒伸ばしてください。'}if(trial){let dt=now-trial.t;if(y.f>65&&y.f<1400||a.f>65&&a.f<1400)trial.s.push({dt,y:y.f,a:a.f});let marks=[['Attack',40,150,170],['+0.3s',250,430,460],['+1.0s',880,1130,1160]];for(let [name,lo,hi,at] of marks)if(dt>at&&!trial.done[name]){trial.done[name]=1;let z=trial.s.filter(x=>x.dt>=lo&&x.dt<=hi);rows.push({i:target,when:name,y:med(z,'y'),a:med(z,'a')});draw()}if(dt>1200){trial=null;$('status').textContent='記録しました。同じ弦または次の弦を弾いてください。'}}prevR=pr.r;raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('dev').innerHTML='';ds.forEach((d,i)=>$('dev').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('dev').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('dev').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('sr').textContent=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);lastQuiet=performance.now();loop();await list(set.deviceId||id||'')}$('on').onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}$('on').textContent='ギター入力 ON'}else try{await open('');$('on').textContent='ギター入力 OFF'}catch(e){$('status').textContent='入力エラー '+e.message}};$('dev').onchange=()=>open($('dev').value);$('clear').onclick=()=>{rows=[];trial=null;draw()};draw()})();</script></body></html>
