<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Track 02 Degree Quiz Majority</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:820px;margin:auto;padding:10px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:13px;margin-bottom:9px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:43px;padding:8px;font:inherit}.song{font-size:21px;font-weight:900}.small{font-size:12px;color:#aaa}.blue{color:#58a6ff}.green{color:#6ee787}.orange{color:#ffb86c}.red{color:#ff7b72}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{border:1px solid #333;border-radius:12px;padding:10px;min-height:140px}.chord{text-align:center;font-size:26px;font-weight:900}.root{text-align:center;color:#58a6ff;font-size:13px;font-weight:800}.degs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}.d{font-size:23px;font-weight:850;color:#555;min-width:34px;text-align:center}.d.now{color:#168bff;transform:scale(1.15)}.d.ok{color:#fff}.meter,.prog{height:9px;background:#222;border-radius:9px;overflow:hidden;margin-top:9px}.meter div{height:100%;background:#999}.prog div{height:100%;background:#fff}.calmsg{text-align:center;font-size:22px;font-weight:900;margin-top:7px}.detect{text-align:center;margin-top:12px;font-size:18px}.nav{display:flex;gap:6px;margin-top:10px}.nav button{flex:1}@media(max-width:560px){.d{font-size:19px}.chord{font-size:21px}.bar{padding:8px}}</style></head><body><div class="app"><div class="p"><div class="row"><div class="song">Track 02 コード基準度数クイズ <span class="blue">Majority NCCF</span></div><button id="on" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:8px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ sampleRate <b id="sr" class="blue">—</b> Hz</div></div><div class="p"><div class="row"><b>入力感度</b><button id="cal" class="btn">測定開始</button><button id="resetcal" class="btn">感度リセット</button><span class="small">RMS <b id="rms">—</b></span></div><div class="small">普段の強さで5回ピッキングすると、その強さに合わせて判定感度を自動設定します。</div><div class="meter"><div id="lev" style="width:0"></div></div><div id="calmsg" class="calmsg">未測定</div><div class="small">基準RMS <b id="base">—</b> ／ ピッキング閾値 <b id="thr">—</b> ／ 無音閾値 <b id="quiet">—</b></div></div><div class="p"><div id="pg" class="small" style="text-align:center"></div><div class="bars"><div class="bar"><div id="bt1" class="small"></div><div id="c1" class="chord"></div><div id="r1" class="root"></div><div id="b1" class="degs"></div></div><div class="bar"><div id="bt2" class="small"></div><div id="c2" class="chord"></div><div id="r2" class="root"></div><div id="b2" class="degs"></div></div></div><div class="detect">検出：<b id="note">—</b>　Chord:<b id="cd">—</b></div><div class="small" style="text-align:center">Hz <span id="hz">—</span> ／ cent <span id="cent">—</span> ／ 多数決 <span id="vote">—</span></div><div id="status" class="small" style="text-align:center;margin-top:7px">入力ON後、感度測定してから弾いてください。</div><div class="prog"><div id="pr" style="width:0"></div></div><div class="nav"><button id="prev" class="btn">← 前</button><button id="retry" class="btn">やり直し</button><button id="next" class="btn">次 →</button></div></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),N=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],D=['R','m2','△2','m3','△3','P4','♭5','P5','m6','△6','m7','△7'];const CH=['CMaj7','A7(E♭m7)','Dm7','G7(D♭m7)','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7(FMaj7♯5)','G7','CMaj7(G)','A7','Dm7','G7','CMaj7','A7(E♭)','Dm7','G7(D♭dim7)'];const PCS=[[2,11,7,4],[3,6,10,1],[10,9,5,2],[1,4,8,11],[0,11,7,5],[4,2,1,4],[2,4,5,7],[8,6,7,5],[4,5,6,9],[7,5,3,1],[2,9,0,9],[11,9,8,6],[7,5,4,2],[1,3,4,7],[5,9,1,4],[2,5,8,6],[7,11,2,0],[1,10,9,7],[5,9,0,10],[11,8,7,5],[4,7,11,9],[10,7,5,3],[2,5,9,0],[1,7,10,1]];function rootPc(s){let m=s.match(/^([A-G])([#♯b♭]?)/),p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='#'||m[2]==='♯')p++;if(m[2]==='b'||m[2]==='♭')p--;return(p+12)%12}function altPc(s){let m=s.match(/\(([A-G])([#♯b♭]?)/);if(!m)return null;let p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='#'||m[2]==='♯')p++;if(m[2]==='b'||m[2]==='♭')p--;return(p+12)%12}const BARS=PCS.map((a,i)=>a.map(pc=>{let r=rootPc(CH[i]),ar=altPc(CH[i]),main=D[(pc-r+12)%12];return{pc,l:ar==null?main:main+'('+D[(pc-ar+12)%12]+')'}}));let page=0,seq=[],split=0,idx=0,ctx,an,buf,stream,raf=0,trial=null,prevR=0,env=.0001,lastQuiet=0,calMode=false,calPeaks=[],calLastPeak=0,base=+(localStorage.getItem('guitarInputRmsBase')||0),attackThr=base?Math.max(.00018,base*.28):.00055,quietThr=base?Math.max(.00008,base*.10):.0004;function saveBase(v){base=v;attackThr=Math.max(.00018,v*.28);quietThr=Math.max(.00008,v*.10);localStorage.setItem('guitarInputRmsBase',v);showCal()}function showCal(){if(!base){$('base').textContent=$('thr').textContent=$('quiet').textContent='—';$('calmsg').textContent='未測定';$('calmsg').className='calmsg';return}$('base').textContent=base.toFixed(5);$('thr').textContent=attackThr.toFixed(5);$('quiet').textContent=quietThr.toFixed(5);$('calmsg').textContent='✓ 感度設定済み';$('calmsg').className='calmsg green'}function load(){let a=BARS[page*2]||[],b=BARS[page*2+1]||[];seq=[...a,...b];split=a.length;idx=0;trial=null;$('pg').textContent=(page*2+1)+'–'+Math.min(page*2+2,24)+'小節 ／ 全24小節';$('bt1').textContent=(page*2+1)+'小節目';$('bt2').textContent=(page*2+2)+'小節目';$('c1').textContent=CH[page*2]||'—';$('c2').textContent=CH[page*2+1]||'—';$('r1').textContent='R = '+N[rootPc(CH[page*2])];$('r2').textContent='R = '+N[rootPc(CH[page*2+1])];draw()}function draw(){$('b1').innerHTML='';$('b2').innerHTML='';seq.forEach((x,i)=>{let s=document.createElement('span');s.className='d'+(i<idx?' ok':i===idx?' now':'');s.textContent=x.l;(i<split?$('b1'):$('b2')).appendChild(s)});$('pr').style.width=((page*8+idx)/(24*4)*100)+'%';$('prev').disabled=page===0;$('next').disabled=page>=11;if(idx>=seq.length&&page<11){page++;load();$('status').textContent='次の2小節へ';}}function currentBar(){return idx<split?page*2:page*2+1}function prep(x){let n=x.length,m=0;for(let v of x)m+=v;m/=n;let y=new Float32Array(n),r=0;for(let i=0;i<n;i++){y[i]=x[i]-m;r+=y[i]*y[i]}return{y,r:Math.sqrt(r/n)}}function nccf(y,sr,r){if(r<.00015)return{f:-1,p:0};let n=y.length,min=Math.floor(sr/1400),max=Math.min(Math.floor(sr/65),n>>1),best=-1,bs=-1,s=new Float32Array(max+1);for(let t=min;t<=max;t++){let xy=0,aa=0,bb=0,lim=n-t;for(let i=0;i<lim;i++){let a=y[i],b=y[i+t];xy+=a*b;aa+=a*a;bb+=b*b}let v=aa&&bb?xy/Math.sqrt(aa*bb):0;s[t]=v;if(v>bs){bs=v;best=t}}if(best<0||bs<.35)return{f:-1,p:bs};let tau=best;if(best>min&&best<max){let a=s[best-1],b=s[best],c=s[best+1],den=a-2*b+c;if(Math.abs(den)>1e-9)tau=best+.5*(a-c)/den}return{f:sr/tau,p:bs}}function nearest(f){let m=Math.round(69+12*Math.log2(f/440));return{pc:(m%12+12)%12,n:N[(m%12+12)%12],m}}function med(a){let z=a.filter(x=>x>0).sort((x,y)=>x-y);return z.length?z[Math.floor(z.length/2)]:null}function majority(samples){if(samples.length<4)return null;let counts=Array(12).fill(0);for(let s of samples)counts[s.pc]++;let max=Math.max(...counts),pc=counts.indexOf(max),ratio=max/samples.length;if(ratio<.60)return null;return{pc,count:max,total:samples.length,ratio,raws:samples.filter(s=>s.pc===pc).map(s=>s.f)}}function corrected(raw,pc){let a=[];for(let k of [.25,.5,1,2,4]){let f=raw*k;if(f<65||f>700)continue;let m=69+12*Math.log2(f/440),mr=Math.round(m),npc=(mr%12+12)%12,cent=100*(m-mr);if(npc===pc)a.push({f,k,cent})}if(!a.length)return null;return a.sort((x,y)=>Math.abs(x.cent)-Math.abs(y.cent))[0]}function degreeFor(pc){let bi=currentBar(),r=rootPc(CH[bi]),ar=altPc(CH[bi]),main=D[(pc-r+12)%12];return ar==null?main:main+'('+D[(pc-ar+12)%12]+')'}function feedback(r){if(!base)return;let m=$('calmsg');if(calMode)return;if(r<base*.35){m.textContent='弱すぎる → もう少し強く';m.className='calmsg orange'}else if(r>base*2.2){m.textContent='強すぎる → 少し弱く';m.className='calmsg red'}else{m.textContent='✓ 適正';m.className='calmsg green'}}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let now=performance.now(),pr=prep(buf),p=nccf(pr.y,ctx.sampleRate,pr.r);$('rms').textContent=pr.r.toFixed(5);$('lev').style.width=Math.min(100,pr.r/(base||.004)*55)+'%';env=env*.94+pr.r*.06;if(calMode){let rise=pr.r>Math.max(.00018,env*1.45)&&pr.r>prevR*1.18;if(rise&&now-calLastPeak>220){calPeaks.push(pr.r);calLastPeak=now;$('calmsg').textContent='測定 '+calPeaks.length+'/5';$('calmsg').className='calmsg blue';if(calPeaks.length>=5){saveBase(med(calPeaks));calMode=false;$('cal').textContent='測定開始';$('status').textContent='感度設定完了。青い度数の音を弾いてください。'}}}else if(base&&idx<seq.length){feedback(pr.r);if(pr.r<quietThr)lastQuiet=now;let dynamic=Math.max(attackThr,env*1.30),attack=!trial&&pr.r>dynamic&&(pr.r>prevR*1.12||now-lastQuiet<240);if(attack){trial={t:now,s:[]};$('status').textContent='ピッキング検出…多数決中';}if(trial){let dt=now-trial.t;if(dt>=105&&dt<=285&&p.f>65&&p.f<1400&&p.p>.35){let nn=nearest(p.f);trial.s.push({f:p.f,pc:nn.pc})}if(dt>290){let mv=majority(trial.s);if(!mv){$('status').textContent='不安定な検出を無視。もう一度';$('vote').textContent=trial.s.length?'一致不足':'測定不足';trial=null;prevR=pr.r;raf=requestAnimationFrame(loop);return}let raw=med(mv.raws),z=corrected(raw,mv.pc);$('vote').textContent=mv.count+'/'+mv.total+' ('+Math.round(mv.ratio*100)+'%)';if(!z){$('status').textContent='オクターブ候補不成立。もう一度';trial=null;prevR=pr.r;raf=requestAnimationFrame(loop);return}$('note').textContent=N[mv.pc];$('hz').textContent=z.f.toFixed(2);$('cent').textContent=(z.cent>=0?'+':'')+Math.round(z.cent)+'c';$('cd').textContent=degreeFor(mv.pc);if(mv.pc===seq[idx].pc&&Math.abs(z.cent)<=35){idx++;$('status').textContent='✓ OK';draw()}else if(mv.pc===seq[idx].pc){$('status').textContent='音名一致・cent不安定。もう一度'}else{$('status').textContent='別音として安定検出：'+N[mv.pc]+'。もう一度'}trial=null}}}prevR=pr.r;raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('dev').innerHTML='';ds.forEach((d,i)=>$('dev').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('dev').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('dev').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('sr').textContent=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);lastQuiet=performance.now();loop();await list(set.deviceId||id||'')}$('on').onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}$('on').textContent='ギター入力 ON'}else try{await open('');$('on').textContent='ギター入力 OFF'}catch(e){$('status').textContent='入力エラー '+e.message}};$('dev').onchange=()=>open($('dev').value);$('cal').onclick=()=>{if(!stream){$('calmsg').textContent='先に入力ON';return}calMode=true;calPeaks=[];calLastPeak=0;$('cal').textContent='測定中…';$('calmsg').textContent='普段の強さで5回弾く';$('calmsg').className='calmsg blue'};$('resetcal').onclick=()=>{localStorage.removeItem('guitarInputRmsBase');base=0;attackThr=.00055;quietThr=.0004;showCal()};$('prev').onclick=()=>{if(page>0){page--;load()}};$('next').onclick=()=>{if(page<11){page++;load()}};$('retry').onclick=()=>load();showCal();load()})();</script></body></html>
