<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Target Lock FAST Test</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:820px;margin:auto;padding:14px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:15px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:45px;padding:9px;font:inherit}.blue{color:#58a6ff}.green{color:#6ee787}.orange{color:#ffb86c}.small{font-size:13px;color:#aaa}.big{text-align:center;font-size:42px;font-weight:900;margin:12px}.target{display:flex;gap:8px;justify-content:center}.target button{font-size:22px;min-width:70px}.target button.on{border-color:#58a6ff;color:#58a6ff}.meter{height:10px;background:#222;border-radius:10px;overflow:hidden;margin-top:10px}.meter div{height:100%;background:#999}.log{font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap;line-height:1.5}</style></head><body><div class="app"><div class="p"><div class="row"><b style="font-size:22px">FAST Target Lock v2</b><button id="on" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:10px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ sampleRate <b id="sr" class="blue">—</b> Hz</div></div><div class="p"><div class="small">F / G / A を普通〜弱めでテスト</div><div class="target"><button class="btn" data-pc="5">F</button><button class="btn on" data-pc="7">G</button><button class="btn" data-pc="9">A</button></div><div class="meter"><div id="lev" style="width:0"></div></div><div class="small">RMS <b id="rms">—</b> ／ 保存基準 <b id="base">—</b></div><div id="note" class="big">—</div><div id="detail" style="text-align:center">選んだ音を弾いてください</div></div><div class="p"><b>判定ログ</b><div id="log" class="log"></div></div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),NN=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];let target=7,ctx,an,buf,stream,raf=0,prev=.0001,env=.0001,trial=null,lock=0,base=+(localStorage.getItem('guitarInputRmsBase')||.0009);$('base').textContent=base.toFixed(5);document.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-pc]').forEach(x=>x.classList.remove('on'));b.classList.add('on');target=+b.dataset.pc;$('note').textContent='—';$('detail').textContent=NN[target]+'を弾いてください'});function prep(x){let n=x.length,m=0;for(let v of x)m+=v;m/=n;let y=new Float32Array(n),r=0;for(let i=0;i<n;i++){y[i]=x[i]-m;r+=y[i]*y[i]}return{y,r:Math.sqrt(r/n)}}function corr(y,t){let xy=0,aa=0,bb=0,lim=y.length-t;for(let i=0;i<lim;i++){let a=y[i],b=y[i+t];xy+=a*b;aa+=a*a;bb+=b*b}return aa&&bb?xy/Math.sqrt(aa*bb):0}function candidates(y,sr,p){let out=[];for(let midi=40;midi<=91;midi++){if((midi%12+12)%12!==p)continue;let nominal=440*Math.pow(2,(midi-69)/12);if(nominal<65||nominal>900)continue;let t0=sr/nominal,b={score:-1,f:nominal};for(let d=-4;d<=4;d++){let t=Math.round(t0+d);if(t<3||t>=y.length/2)continue;let c=corr(y,t);if(c>b.score)b={score:c,f:sr/t}}out.push(b)}return out.sort((a,b)=>b.score-a.score)}function globalPeak(y,sr){let min=Math.floor(sr/1000),max=Math.min(Math.floor(sr/65),y.length>>1),b={score:-1,f:0};for(let t=min;t<=max;t+=2){let c=corr(y,t);if(c>b.score)b={score:c,f:sr/t}}return b}function cent(f){let m=69+12*Math.log2(f/440),mr=Math.round(m);return 100*(m-mr)}function evidence(y,sr){let tc=candidates(y,sr,target),b=tc[0],g=globalPeak(y,sr);if(!b)return null;let ratio=g.score>0?b.score/g.score:0;let h2=Math.max(0,corr(y,Math.max(3,Math.round(sr/(b.f*2))))),h3=Math.max(0,corr(y,Math.max(3,Math.round(sr/(b.f*3)))));let strength=b.score*.78+h2*.07+h3*.05;return{f:b.f,score:b.score,ratio,strength}}function med(a){let z=[...a].sort((x,y)=>x-y);return z[Math.floor(z.length/2)]}function accept(s,peak,early=false){let good=s.filter(x=>x.score>=.31&&x.ratio>=.64&&x.strength>=.36);if(!good.length)return false;let top=[...good].sort((a,b)=>b.strength-a.strength);let strong=top.filter(x=>x.strength>=.40);let need=early?3:Math.min(3,Math.ceil(s.length*.28));if(strong.length<need)return false;let f=med(strong.slice(0,Math.max(need,5)).map(x=>x.f)),ce=cent(f);$('note').textContent=NN[target];$('note').className='big green';$('detail').textContent=f.toFixed(2)+' Hz / '+(ce>=0?'+':'')+Math.round(ce)+'c / 証拠 '+strong.length+'/'+s.length+(early?' / EARLY':'')+' / RMS '+peak.toFixed(5);log('✓ '+NN[target]+' '+f.toFixed(1)+'Hz '+Math.round(ce)+'c evidence '+strong.length+'/'+s.length+(early?' EARLY':'')+' RMS '+peak.toFixed(5));return true}function reject(s,peak){$('note').textContent='—';$('note').className='big orange';$('detail').textContent='不安定・無視　証拠不足';log('× '+NN[target]+' 無視 samples '+s.length+' RMS '+peak.toFixed(5))}function log(x){$('log').textContent=x+'\n'+$('log').textContent}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let now=performance.now(),q=prep(buf);$('rms').textContent=q.r.toFixed(5);$('lev').style.width=Math.min(100,q.r/(base||.001)*70)+'%';env=env*.94+q.r*.06;let attack=!trial&&now>lock&&q.r>Math.max(.00011,env*1.12)&&q.r>prev*1.05;if(attack)trial={t:now,s:[],peak:q.r};if(trial){trial.peak=Math.max(trial.peak,q.r);let dt=now-trial.t;if(dt>=55&&dt<=210&&q.r>.00009){let e=evidence(q.y,ctx.sampleRate);if(e)trial.s.push(e);if(dt>=95&&trial.s.length>=3&&accept(trial.s,trial.peak,true)){trial=null;lock=now+65}}if(trial&&dt>215){if(!accept(trial.s,trial.peak,false))reject(trial.s,trial.peak);trial=null;lock=now+70}}prev=q.r;raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('dev').innerHTML='';ds.forEach((d,i)=>$('dev').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('dev').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('dev').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('sr').textContent=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);loop();await list(set.deviceId||id||'')}$('on').onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}$('on').textContent='ギター入力 ON'}else try{await open('');$('on').textContent='ギター入力 OFF'}catch(e){$('detail').textContent='入力エラー '+e.message}};$('dev').onchange=()=>open($('dev').value)})();</script></body></html>
