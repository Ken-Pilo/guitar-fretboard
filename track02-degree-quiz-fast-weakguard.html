<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track 02 FAST Weak Guard</title></head><body style="margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif"><div style="padding:20px;text-align:center">FAST弱音対策版を読み込み中…</div><script>(async()=>{let h=await (await fetch('track02-degree-quiz-fast.html?src=weakguard1',{cache:'no-store'})).text();h=h.replace('Track 02 Degree Quiz FAST</title>','Track 02 Degree Quiz FAST Weak Guard</title>');h=h.replace('<span class="blue">FAST</span>','<span class="blue">FAST・弱音対策</span>');h=h.replace("if(attack){trial={t:now,s:[]};$('status').textContent='検出中…'}","if(attack){trial={t:now,s:[],weak:!!base&&pr.r<base*.90};$('status').textContent=trial.weak?'弱音：少し待って判定…':'検出中…'}");h=h.replace("if(trial){let dt=now-trial.t;if(dt>=45&&dt<=145){let p=nccf(pr.y,ctx.sampleRate,pr.r);if(p.f>65&&p.f<1400&&p.p>.33){let nn=nearest(p.f);trial.s.push({f:p.f,pc:nn.pc});let v=voteNow(trial.s);if(v){finishVote(v);trial=null;lockedUntil=now+70}}}if(trial&&dt>155){let v=voteNow(trial.s);if(v)finishVote(v);else $('status').textContent='不安定・無視';trial=null;lockedUntil=now+60}}","if(trial){let dt=now-trial.t,start=trial.weak?90:45,end=trial.weak?210:145,timeout=trial.weak?220:155;if(dt>=start&&dt<=end){let p=nccf(pr.y,ctx.sampleRate,pr.r);if(p.f>65&&p.f<1400&&p.p>.33){let nn=nearest(p.f);trial.s.push({f:p.f,pc:nn.pc});let v=voteNow(trial.s);if(v&&(!trial.weak||v.count>=4)){finishVote(v);trial=null;lockedUntil=now+70}}}if(trial&&dt>timeout){let v=voteNow(trial.s);if(v&&(!trial.weak||v.count>=4))finishVote(v);else $('status').textContent=trial.weak?'弱音・判定保留':'不安定・無視';trial=null;lockedUntil=now+60}}}");document.open();document.write(h);document.close()})().catch(e=>document.body.innerHTML='<div style="padding:20px">読み込みエラー '+e.message+'</div>')</script></body></html>
