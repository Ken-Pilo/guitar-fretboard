<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Track 02 Tuner Quiz</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:820px;margin:auto;padding:10px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:13px;margin-bottom:9px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:43px;padding:8px;font:inherit}.song{font-size:21px;font-weight:900}.small{font-size:12px;color:#aaa}.blue{color:#58a6ff}.green{color:#6ee787}.orange{color:#ffb86c}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{border:1px solid #333;border-radius:12px;padding:10px;min-height:140px}.chord{text-align:center;font-size:25px;font-weight:900}.root{text-align:center;color:#58a6ff;font-size:13px;font-weight:800}.degs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}.d{font-size:23px;font-weight:850;color:#555;min-width:34px;text-align:center}.d.now{color:#168bff;transform:scale(1.15)}.d.ok{color:#fff}.prog{height:9px;background:#222;border-radius:9px;overflow:hidden;margin-top:9px}.prog div{height:100%;background:#fff}.detect{text-align:center;margin-top:12px;font-size:18px}.nav{display:flex;gap:6px;margin-top:10px}.nav button{flex:1}@media(max-width:560px){.d{font-size:19px}.chord{font-size:20px}.bar{padding:8px}}</style></head><body><div class="app"><div class="p"><div class="row"><div class="song">Track 02 コード基準度数クイズ <span class="green">TUNER</span></div><button id="on" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:8px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ sampleRate <b id="sr" class="blue">—</b> Hz</div></div><div class="p"><div id="pg" class="small" style="text-align:center"></div><div class="bars"><div class="bar"><div id="bt1" class="small"></div><div id="c1" class="chord"></div><div id="r1" class="root"></div><div id="b1" class="degs"></div></div><div class="bar"><div id="bt2" class="small"></div><div id="c2" class="chord"></div><div id="r2" class="root"></div><div id="b2" class="degs"></div></div></div><div class="detect">検出：<b id="note">—</b>　Chord:<b id="cd">—</b></div><div class="small" style="text-align:center">Hz <span id="hz">—</span> ／ cent <span id="cent">—</span> ／ RMS <span id="rms">—</span></div><div id="status" class="small" style="text-align:center;margin-top:7px">入力ON後、青い度数を弾いてください。</div><div class="prog"><div id="pr" style="width:0"></div></div><div class="nav"><button id="prev" class="btn">← 前</button><button id="retry" class="btn">やり直し</button><button id="next" class="btn">次 →</button></div></div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),N=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],D=['R','m2','△2','m3','△3','P4','♭5','P5','m6','△6','m7','△7'];const CH=['CMaj7','A7(E♭m7)','Dm7','G7(D♭m7)','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7(FMaj7♯5)','G7','CMaj7(G)','A7','Dm7','G7','CMaj7','A7(E♭)','Dm7','G7(D♭dim7)'];const PCS=[[2,11,7,4],[3,6,10,1],[10,9,5,2],[1,4,8,11],[0,11,7,5],[4,2,1,4],[2,4,5,7],[8,6,7,5],[4,5,6,9],[7,5,3,1],[2,9,0,9],[11,9,8,6],[7,5,4,2],[1,3,4,7],[5,9,1,4],[2,5,8,6],[7,11,2,0],[1,10,9,7],[5,9,0,10],[11,8,7,5],[4,7,11,9],[10,7,5,3],[2,5,9,0],[1,7,10,1]];function rootPc(s){let m=s.match(/^([A-G])([#♯b♭]?)/),p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='#'||m[2]==='♯')p++;if(m[2]==='b'||m[2]==='♭')p--;return(p+12)%12}function altPc(s){let m=s.match(/\(([A-G])([#♯b♭]?)/);if(!m)return null;let p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='#'||m[2]==='♯')p++;if(m[2]==='b'||m[2]==='♭')p--;return(p+12)%12}const BARS=PCS.map((a,i)=>a.map(pc=>{let r=rootPc(CH[i]),ar=altPc(CH[i]),main=D[(pc-r+12)%12];return{pc,l:ar==null?main:main+'('+D[(pc-ar+12)%12]+')'}}));let page=0,seq=[],split=0,idx=0,ctx,an,buf,stream,raf=0,last=[],sil=0,armed=true,lastPc=null;function load(){let a=BARS[page*2]||[],b=BARS[page*2+1]||[];seq=[...a,...b];split=a.length;idx=0;last=[];armed=true;$('pg').textContent=(page*2+1)+'–'+Math.min(page*2+2,24)+'小節 ／ 全24小節';$('bt1').textContent=(page*2+1)+'小節目';$('bt2').textContent=(page*2+2)+'小節目';$('c1').textContent=CH[page*2]||'—';$('c2').textContent=CH[page*2+1]||'—';$('r1').textContent='R = '+N[rootPc(CH[page*2])];$('r2').textContent='R = '+N[rootPc(CH[page*2+1])];draw()}function draw(){$('b1').innerHTML='';$('b2').innerHTML='';seq.forEach((x,i)=>{let s=document.createElement('span');s.className='d'+(i<idx?' ok':i===idx?' now':'');s.textContent=x.l;(i<split?$('b1'):$('b2')).appendChild(s)});$('pr').style.width=((page*8+idx)/(24*4)*100)+'%';$('prev').disabled=page===0;$('next').disabled=page>=11;if(idx>=seq.length&&page<11){page++;load();$('status').textContent='次の2小節へ'}}function currentBar(){return idx<split?page*2:page*2+1}function degreeFor(pc){let bi=currentBar(),r=rootPc(CH[bi]),ar=altPc(CH[bi]),main=D[(pc-r+12)%12];return ar==null?main:main+'('+D[(pc-ar+12)%12]+')'}function prep(x){let n=x.length,m=0;for(let v of x)m+=v;m/=n;let y=new Float32Array(n),r=0;for(let i=0;i<n;i++){y[i]=x[i]-m;r+=y[i]*y[i]}return{y,r:Math.sqrt(r/n)}}function nsdf(y,t){let ac=0,m=0,lim=y.length-t;for(let i=0;i<lim;i++){let a=y[i],b=y[i+t];ac+=a*b;m+=a*a+b*b}return m?2*ac/m:0}function mpm(y,sr){let min=Math.max(2,Math.floor(sr/700)),max=Math.min(Math.floor(sr/70),Math.floor(y.length/2)),vals=new Float32Array(max+1),maxv=-1;for(let t=min;t<=max;t++){let v=nsdf(y,t);vals[t]=v;if(v>maxv)maxv=v}if(maxv<.45)return null;let cutoff=Math.max(.62,maxv*.86),peaks=[];for(let t=min+1;t<max;t++)if(vals[t]>vals[t-1]&&vals[t]>=vals[t+1]&&vals[t]>=cutoff)peaks.push(t);if(!peaks.length)return null;let t=peaks[0],a=vals[t-1],b=vals[t],c=vals[t+1],den=a-2*b+c,sh=den?0.5*(a-c)/den:0,lag=t+Math.max(-.5,Math.min(.5,sh)),f=sr/lag;if(f<70||f>700)return null;return{f,clar:b}}function info(f){let mf=69+12*Math.log2(f/440),m=Math.round(mf),c=100*(mf-m),pc=(m%12+12)%12,oct=Math.floor(m/12)-1;return{m,c,pc,oct}}function median(a){let z=[...a].sort((a,b)=>a-b);return z[Math.floor(z.length/2)]}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let q=prep(buf);$('rms').textContent=q.r.toFixed(5);if(q.r<.00013){sil++;if(sil>4){last=[];armed=true;lastPc=null;$('status').textContent='入力待ち'}raf=requestAnimationFrame(loop);return}sil=0;let p=mpm(q.y,ctx.sampleRate);if(!p||p.clar<.58){$('status').textContent='不安定・無視';raf=requestAnimationFrame(loop);return}let i=info(p.f);last.push({f:p.f,pc:i.pc,c:i.c});if(last.length>5)last.shift();let same=last.filter(x=>x.pc===i.pc);if(same.length<3){$('status').textContent='確認中…';raf=requestAnimationFrame(loop);return}let f=median(same.slice(-4).map(x=>x.f)),z=info(f);$('note').textContent=N[z.pc]+z.oct;$('hz').textContent=f.toFixed(2);$('cent').textContent=(z.c>=0?'+':'')+Math.round(z.c)+'c';$('cd').textContent=degreeFor(z.pc);if(!armed){if(z.pc!==lastPc){armed=true;last=[]}else{raf=requestAnimationFrame(loop);return}}if(Math.abs(z.c)<=35&&idx<seq.length){if(z.pc===seq[idx].pc){lastPc=z.pc;armed=false;idx++;$('status').textContent='✓ OK';draw()}else $('status').textContent='別音：'+N[z.pc]}else $('status').textContent='cent不安定';raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('dev').innerHTML='';ds.forEach((d,i)=>$('dev').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('dev').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('dev').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('sr').textContent=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);loop();await list(set.deviceId||id||'')}$('on').onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}$('on').textContent='ギター入力 ON'}else try{await open('');$('on').textContent='ギター入力 OFF'}catch(e){$('status').textContent='入力エラー '+e.message}};$('dev').onchange=()=>open($('dev').value);$('prev').onclick=()=>{if(page>0){page--;load()}};$('next').onclick=()=>{if(page<11){page++;load()}};$('retry').onclick=load;load()})();</script></body></html>
