function rootPc(c){let m=c.match(/^([A-G])([♯#♭b]?)/);if(!m)return 0;let base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]],a=m[2];return(base+(a==='♯'||a==='#'?1:a==='♭'||a==='b'?-1:0)+12)%12}

async function listInputs(selectedId){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');dev.innerHTML='';ds.forEach((d,i)=>dev.add(new Option(d.label||('入力 '+(i+1)),d.deviceId)));dev.disabled=!ds.length;if(selectedId&&ds.some(d=>d.deviceId===selectedId))dev.value=selectedId}
