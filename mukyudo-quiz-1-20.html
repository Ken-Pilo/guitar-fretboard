<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:820px;margin:auto;padding:9px}
.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:12px;margin-bottom:9px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:42px;padding:8px;font:inherit}
.btn{font-weight:750}
.song{font-size:20px;font-weight:900}
.small{font-size:12px;color:#aaa}
.key{text-align:center;font-size:46px;font-weight:900;line-height:1}
.trackSel{min-width:125px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bar{border:1px solid #333;border-radius:12px;padding:10px;min-height:134px}
.chord{text-align:center;font-size:25px;font-weight:900;margin:4px}
.sub{text-align:center;font-size:11px;color:#999}
.degs{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.d{font-size:25px;font-weight:850;color:#555;min-width:32px;text-align:center}
.d.now{color:#168bff;transform:scale(1.15)}
.d.ok{color:#fff}
.kind{font-size:10px;display:block;color:#888;margin-top:2px}
.d.now .kind{color:#65b7ff} .d.ok .kind{color:#ccc}
.detect{text-align:center;margin-top:14px;font-size:16px}
.meter,.prog{height:8px;background:#222;border-radius:9px;overflow:hidden;margin-top:9px}
.meter div{height:100%;background:#888} .prog div{height:100%;background:#fff}
.nav{display:flex;gap:6px;margin-top:10px} .nav button{flex:1}
.rule{line-height:1.6;font-size:13px;color:#bbb}
.badge{display:inline-block;border:1px solid #444;border-radius:999px;padding:3px 7px;margin:2px;font-size:11px}
@media(max-width:560px){.d{font-size:22px}.key{font-size:40px}.bar{padding:8px}.song{font-size:17px}}
</style>
</head>

for(let i=1;i<=20;i++) tr.add(new Option('Track '+String(i).padStart(2,'0'),i));

function chordInfo(s){
  const m=(s||'').match(/^([A-G])([♯♭]?)(Maj7|m7|7)/);
  if(!m)return null;
  const root=(NOTE_PC[m[1]+(m[2]||'')]??0);
  const q=m[3];
  let tones;
  if(q==='Maj7') tones={0:'R',4:'△3',7:'P5',11:'△7'};
  else if(q==='m7') tones={0:'R',3:'m3',7:'P5',10:'m7'};
  else tones={0:'R',4:'△3',7:'P5',10:'m7'};
  return{root,q,tones};
}
function contextualLabel(pc,chord){
  const ci=chordInfo(chord); if(!ci)return{label:'?',kind:''};
  const d=(pc-ci.root+12)%12;
  if(ci.tones[d]) return{label:ci.tones[d],kind:'Chord Tone'};
  const tension={1:'♭9',2:'9',3:'♯9',5:'11',6:'♯11',8:'♭13',9:'13'};
  if(tension[d]) return{label:tension[d],kind:'Tension'};
  const fallback={10:'m7',11:'△7',4:'△3',7:'P5'}[d]||'?';
  return{label:fallback,kind:'Outside'};
}
function noteName(pc){return N[(pc+12)%12]}

let track=1,page=0,seq=[],split=0,idx=0,ctx=null,an=null,stream=null,buf=null,raf=0,hist=[],sil=0,armed=true,lastAcceptedPc=null;

function current(){return DATA[String(track)]}
function load(){
  const d=current(), a=d.bars[page*2]||[], b=d.bars[page*2+1]||[];
  const cA=d.chords[page*2]||'', cB=d.chords[page*2+1]||'';
  seq=[
    ...a.map(pc=>({pc,...contextualLabel(pc,cA),bar:page*2})),
    ...b.map(pc=>({pc,...contextualLabel(pc,cB),bar:page*2+1}))
  ];
  split=a.length; idx=0; hist=[]; sil=0; armed=true; lastAcceptedPc=null;
  key.textContent=d.key;
  pg.textContent='Track '+String(track).padStart(2,'0')+' ／ '+(page*2+1)+'–'+Math.min(page*2+2,d.bars.length)+'小節';
  bt1.textContent=(page*2+1)+'小節目'; bt2.textContent=(page*2+2<=d.bars.length?(page*2+2)+'小節目':'');
  c1.textContent=cA||'—'; c2.textContent=cB||'—';
  draw();
}
function draw(){
  b1.innerHTML='';b2.innerHTML='';
  seq.forEach((x,i)=>{
    const s=document.createElement('span');
    s.className='d'+(i<idx?' ok':i===idx?' now':'');
    s.innerHTML='<span>'+x.label+'</span><span class="kind">'+x.kind+'</span>';
    (i<split?b1:b2).appendChild(s);
  });
  pr.style.width=(seq.length?Math.min(100,idx/seq.length*100):0)+'%';
  if(seq.length&&idx>=seq.length&&(page+1)*2<current().bars.length){page++;load();return}
  prev.disabled=page===0;
  next.disabled=(page+1)*2>=current().bars.length;
}
function currentBar(){return idx<split?page*2:page*2+1}
function currentChord(){return current().chords[currentBar()]||''}
function prep(x){
  let n=x.length,m=0;for(let v of x)m+=v;m/=n;
  let y=new Float32Array(n),r=0;for(let i=0;i<n;i++){y[i]=x[i]-m;r+=y[i]*y[i]}
  return{y,r:Math.sqrt(r/n)};
}
function nsdf(y,t){
  let ac=0,m=0,lim=y.length-t;
  for(let i=0;i<lim;i++){let a=y[i],b=y[i+t];ac+=a*b;m+=a*a+b*b}
  return m?2*ac/m:0;
}
function mpm(y,sr,weak){
  let min=Math.max(2,Math.floor(sr/700)),max=Math.min(Math.floor(sr/70),Math.floor(y.length/2)),vals=new Float32Array(max+1),maxv=-1;
  for(let t=min;t<=max;t++){let v=nsdf(y,t);vals[t]=v;if(v>maxv)maxv=v}
  let floor=weak?.34:.45;if(maxv<floor)return null;
  let cutoff=Math.max(weak?.50:.62,maxv*(weak?.80:.86)),peaks=[];
  for(let t=min+1;t<max;t++)if(vals[t]>vals[t-1]&&vals[t]>=vals[t+1]&&vals[t]>=cutoff)peaks.push(t);
  if(!peaks.length)return null;
  let t=peaks[0],a=vals[t-1],b=vals[t],c=vals[t+1],den=a-2*b+c,sh=den?0.5*(a-c)/den:0,
      lag=t+Math.max(-.5,Math.min(.5,sh)),f=sr/lag;
  if(f<70||f>700)return null;
  return{f,clar:b};
}
function info(f){
  let mf=69+12*Math.log2(f/440),m=Math.round(mf),c=100*(mf-m);
  return{pc:(m%12+12)%12,n:N[(m%12+12)%12],oct:Math.floor(m/12)-1,c};
}
function med(a){let z=[...a].sort((a,b)=>a-b);return z[Math.floor(z.length/2)]}
function loop(){
  if(!an)return;
  an.getFloatTimeDomainData(buf);
  let q=prep(buf),weak=q.r<.00050,short=q.r>=.00025;
  lev.style.width=Math.min(100,q.r/.0012*100)+'%';
  if(q.r<.00010){
    sil++;
    if(sil>4){hist=[];armed=true;lastAcceptedPc=null;diag.textContent=idx<seq.length?'入力待ち':'完了'}
    raf=requestAnimationFrame(loop);return;
  }
  sil=0;
  let y=short?q.y.subarray(q.y.length-4096):q.y,p=mpm(y,ctx.sampleRate,weak);
  if(!p||p.clar<(weak?.40:.58)){
    diag.textContent='不安定・無視 ／ RMS '+q.r.toFixed(5)+' ／ window '+(short?'4096':'8192');
    raf=requestAnimationFrame(loop);return;
  }
  let i=info(p.f);
  note.textContent=i.n+i.oct+'（'+i.n+'）';
  cd.textContent=contextualLabel(i.pc,currentChord()).label;
  diag.textContent='RMS '+q.r.toFixed(5)+' ／ window '+(short?'4096':'8192')+' ／ clarity '+p.clar.toFixed(2)+' ／ '+p.f.toFixed(2)+' Hz ／ '+(i.c>=0?'+':'')+Math.round(i.c)+' cent';
  hist.push({pc:i.pc,f:p.f,c:i.c});if(hist.length>5)hist.shift();
  if(!armed){
    if(i.pc!==lastAcceptedPc){armed=true;hist=[]}
    else{raf=requestAnimationFrame(loop);return}
  }
  if(idx<seq.length){
    let same=hist.filter(x=>x.pc===i.pc),need=weak?2:3;
    if(same.length>=need){
      let use=same.slice(-need),cspread=Math.max(...use.map(x=>x.c))-Math.min(...use.map(x=>x.c));
      if(cspread<=30&&Math.abs(med(use.map(x=>x.c)))<=40){
        if(i.pc===seq[idx].pc){lastAcceptedPc=i.pc;armed=false;idx++;hist=[];draw()}
      }
    }
  }
  raf=requestAnimationFrame(loop);
}
async function openInput(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  let at=stream.getAudioTracks()[0]; active.textContent=at.label||'入力';
  ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=8192;buf=new Float32Array(an.fftSize);src.connect(an);
  cancelAnimationFrame(raf);loop();
}
ib.onclick=async()=>{
  if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}ib.textContent='ギター入力 ON';st.textContent='入力OFF';active.textContent='—'}
  else try{await openInput();ib.textContent='ギター入力 OFF';st.textContent='入力中'}catch(e){st.textContent='入力エラー '+e.message}
};
tr.onchange=()=>{track=Number(tr.value);page=0;load()};
retry.onclick=load;
prev.onclick=()=>{if(page){page--;load()}};
next.onclick=()=>{if((page+1)*2<current().bars.length){page++;load()}};
tr.value='1';load();
})();
</script>
</body>
