<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Track 02 Attack 2</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:800px;margin:auto;padding:10px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:13px;margin-bottom:9px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:43px;padding:8px;font:inherit}.song{font-size:21px;font-weight:900}.small{font-size:12px;color:#aaa}.blue{color:#58a6ff;font-weight:800}.oktxt{color:#6ee787}.warn{color:#ff7b72}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{border:1px solid #333;border-radius:12px;padding:10px;min-height:135px}.chord{text-align:center;font-size:28px;font-weight:900}.root{text-align:center;color:#58a6ff;font-size:13px;font-weight:800}.degs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}.d{font-size:24px;font-weight:850;color:#555;min-width:34px;text-align:center}.d.now{color:#168bff;transform:scale(1.15)}.d.ok{color:#fff}.detect{text-align:center;margin-top:14px;font-size:17px}.meter,.prog{height:8px;background:#222;border-radius:9px;overflow:hidden;margin-top:9px}.meter div{height:100%;background:#888}.prog div{height:100%;background:#fff}.nav{display:flex;gap:6px;margin-top:10px}.nav button{flex:1}@media(max-width:560px){.d{font-size:20px}.bar{padding:8px}.chord{font-size:22px}}</style></head><body><div class="app"><div class="p"><div class="row"><div class="song">Track 02 コード基準度数テスト <span class="blue">ATTACK 2</span></div><button id="ib" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:8px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ <span id="st">入力OFF</span></div><div class="row" style="margin-top:10px"><select id="calNote"><option value="130.8128">C3（5弦3F）</option><option value="82.4069">E2（6弦開放）</option><option value="110">A2（5弦開放）</option><option value="146.8324">D3（4弦開放）</option><option value="195.9977">G3（3弦開放）</option><option value="246.9417">B3（2弦開放）</option><option value="329.6276">E4（1弦開放）</option></select><button id="calBtn" class="btn">安定値で補正</button><button id="clearBtn" class="btn">補正解除</button></div><div class="small">生Hz：<span id="rawHz" class="blue">—</span> ／ 安定Hz：<span id="stableHz" class="blue">—</span> ／ 補正：<span id="calVal" class="blue">0 cent</span></div><div id="calMsg" class="small">C3なら5弦3Fを1秒ほど伸ばし、安定Hzが出たら補正。</div></div><div class="p"><div id="pg" class="small" style="text-align:center"></div><div class="small" style="text-align:center;margin-bottom:8px">各ピッキングの立ち上がりだけ判定。伸びている音は再判定しません。</div><div class="bars"><div class="bar"><div id="bt1" class="small"></div><div id="c1" class="chord"></div><div id="r1" class="root"></div><div id="b1" class="degs"></div></div><div class="bar"><div id="bt2" class="small"></div><div id="c2" class="chord"></div><div id="r2" class="root"></div><div id="b2" class="degs"></div></div></div><div class="detect">検出：<b id="note">—</b>　Chord:<b id="cd">—</b></div><div class="meter"><div id="lev" style="width:0"></div></div><div id="diag" class="small" style="text-align:center;margin-top:6px">入力をONにして弾いてください。</div><div class="prog"><div id="pr" style="width:0"></div></div><div class="nav"><button id="prev" class="btn">← 前</button><button id="retry" class="btn">やり直し</button><button id="next" class="btn">次 →</button></div></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),N=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],D=['R','m2','△2','m3','△3','P4','♭5','P5','m6','△6','m7','△7'];const E={ib:$('ib'),dev:$('dev'),active:$('active'),st:$('st'),calNote:$('calNote'),calBtn:$('calBtn'),clearBtn:$('clearBtn'),calVal:$('calVal'),calMsg:$('calMsg'),rawHz:$('rawHz'),stableHz:$('stableHz'),pg:$('pg'),bt1:$('bt1'),bt2:$('bt2'),c1:$('c1'),c2:$('c2'),r1:$('r1'),r2:$('r2'),b1:$('b1'),b2:$('b2'),note:$('note'),cd:$('cd'),lev:$('lev'),diag:$('diag'),pr:$('pr'),prev:$('prev'),retry:$('retry'),next:$('next')};const CH=['CMaj7','A7(E♭m7)','Dm7','G7(D♭m7)','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7(FMaj7♯5)','G7','CMaj7(G)','A7','Dm7','G7','CMaj7','A7(E♭)','Dm7','G7(D♭dim7)'];const PCS=[[2,11,7,4],[3,6,10,1],[10,9,5,2],[1,4,8,11],[0,11,7,5],[4,2,1,4],[2,4,5,7],[8,6,7,5],[4,5,6,9],[7,5,3,1],[2,9,0,9],[11,9,8,6],[7,5,4,2],[1,3,4,7],[5,9,1,4],[2,5,8,6],[7,11,2,0],[1,10,9,7],[5,9,0,10],[11,8,7,5],[4,7,11,9],[10,7,5,3],[2,5,9,0],[1,7,10,1]];function rootPc(s){let m=s.match(/^([A-G])([#♯b♭]?)/),p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='#'||m[2]==='♯')p++;if(m[2]==='b'||m[2]==='♭')p--;return(p+12)%12}function altPc(s){let m=s.match(/\(([A-G])([#♯b♭]?)/);if(!m)return null;let p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='#'||m[2]==='♯')p++;if(m[2]==='b'||m[2]==='♭')p--;return(p+12)%12}const BARS=PCS.map((a,i)=>a.map(pc=>{let r=rootPc(CH[i]),ar=altPc(CH[i]),main=D[(pc-r+12)%12];return{pc,l:ar==null?main:main+'('+D[(pc-ar+12)%12]+')'}}));let page=0,seq=[],split=0,idx=0,ctx=null,an=null,stream=null,buf=null,raf=0,cal=0,recent=[],env=0,lastAttack=0,pendingUntil=0,pending=false;try{cal=Number(localStorage.getItem('guitarPitchCalCentsV3')||0)}catch(e){}function showCal(){E.calVal.textContent=(cal>=0?'+':'')+Math.round(cal)+' cent'}function load(){let a=BARS[page*2]||[],b=BARS[page*2+1]||[];seq=[...a,...b];split=a.length;idx=0;pending=false;pendingUntil=0;E.pg.textContent=(page*2+1)+'–'+Math.min(page*2+2,BARS.length)+'小節 ／ 全24小節';E.bt1.textContent=(page*2+1)+'小節目';E.bt2.textContent=(page*2+2)+'小節目';E.c1.textContent=CH[page*2]||'—';E.c2.textContent=CH[page*2+1]||'—';E.r1.textContent='R = '+N[rootPc(CH[page*2])];E.r2.textContent='R = '+N[rootPc(CH[page*2+1])];draw()}function draw(){E.b1.innerHTML='';E.b2.innerHTML='';seq.forEach((x,i)=>{let s=document.createElement('span');s.className='d'+(i<idx?' ok':i===idx?' now':'');s.textContent=x.l;(i<split?E.b1:E.b2).appendChild(s)});E.pr.style.width=((page*8+idx)/(BARS.length*4)*100)+'%';if(idx>=seq.length&&(page+1)*2<BARS.length){page++;load();return}E.prev.disabled=page===0;E.next.disabled=(page+1)*2>=BARS.length}function currentBar(){return idx<split?page*2:page*2+1}function accept(pc){if(idx>=seq.length)return;if(pc===seq[idx].pc){idx++;E.diag.textContent='✓ OK：'+N[pc];draw()}else E.diag.textContent='× '+N[pc]+'（もう一度）'}function yin(x,sr){let n=x.length,mean=0;for(let v of x)mean+=v;mean/=n;let rms=0,y=new Float32Array(n);for(let i=0;i<n;i++){y[i]=x[i]-mean;rms+=y[i]*y[i]}rms=Math.sqrt(rms/n);if(rms<.00035)return{f:-1,r:rms,p:0};let min=Math.floor(sr/1400),max=Math.min(Math.floor(sr/75),n>>1),d=new Float32Array(max+1),c=new Float32Array(max+1);for(let t=1;t<=max;t++){let s=0;for(let i=0;i<n-t;i++){let q=y[i]-y[i+t];s+=q*q}d[t]=s}let run=0,b=-1,bv=1;for(let t=1;t<=max;t++){run+=d[t];c[t]=run?d[t]*t/run:1;if(t>=min&&c[t]<.18){while(t+1<=max&&c[t+1]<c[t])t++;b=t;bv=c[t];break}if(t>=min&&c[t]<bv){b=t;bv=c[t]}}if(b<0||bv>.45)return{f:-1,r:rms,p:1-bv};let tau=b;if(b>1&&b<max){let a=c[b-1],z=c[b+1],den=a+z-2*c[b];if(Math.abs(den)>1e-9)tau=b+(a-z)/(2*den)}return{f:sr/tau,r:rms,p:1-bv}}function stableFor(target){let now=performance.now(),arr=recent.filter(x=>now-x.t<1600&&x.p>.45).map(x=>x.f).filter(f=>Math.abs(1200*Math.log2(f/target))<=100);if(arr.length<2)return null;arr.sort((a,b)=>a-b);return arr[Math.floor(arr.length/2)]}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let p=yin(buf,ctx.sampleRate),r=p.r,now=performance.now(),pct=Math.min(100,r*2500);E.lev.style.width=pct+'%';if(env===0)env=r;let baseline=env;env=env*.88+r*.12;let onset=r>.00042&&r>baseline*1.18&&(r-baseline)>.00006&&now-lastAttack>110;if(onset){pending=true;pendingUntil=now+220;lastAttack=now;E.diag.textContent='ピッキング検出…'}if(p.f>75&&p.f<1400){recent.push({t:now,f:p.f,p:p.p});recent=recent.filter(x=>now-x.t<1800);E.rawHz.textContent=p.f.toFixed(1);let sv=stableFor(+E.calNote.value);E.stableHz.textContent=sv?sv.toFixed(1):'—';let f=p.f*Math.pow(2,cal/1200),m=69+12*Math.log2(f/440),mr=Math.round(m),pc=(mr%12+12)%12,cent=Math.round(100*(m-mr));E.note.textContent=N[pc];let bi=currentBar(),rr=rootPc(CH[bi]),ar=altPc(CH[bi]),main=D[(pc-rr+12)%12];E.cd.textContent=ar==null?main:main+'('+D[(pc-ar+12)%12]+')';if(pending&&now<=pendingUntil&&p.p>.38&&Math.abs(cent)<50){pending=false;accept(pc)}else if(pending&&now>pendingUntil){pending=false;E.diag.textContent='判定できず。もう一度ピッキング'}else if(!pending&&now-lastAttack>240){E.diag.textContent='次のピッキング待ち'}}else if(pending&&now>pendingUntil){pending=false;E.diag.textContent='判定できず。もう一度ピッキング'}raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');E.dev.innerHTML='';ds.forEach((d,i)=>E.dev.add(new Option(d.label||'入力 '+(i+1),d.deviceId)));E.dev.disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))E.dev.value=id}async function openInput(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};E.active.textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);src.connect(an);recent=[];env=0;lastAttack=0;pending=false;cancelAnimationFrame(raf);loop();await list(set.deviceId||id||'')}E.ib.onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}E.ib.textContent='ギター入力 ON';E.st.textContent='入力OFF'}else try{await openInput('');E.ib.textContent='ギター入力 OFF';E.st.textContent='入力中'}catch(err){E.st.textContent='入力エラー '+err.message}};E.dev.onchange=()=>openInput(E.dev.value);E.calBtn.onclick=()=>{if(!stream){E.calMsg.textContent='先にギター入力をONにしてください。';E.calMsg.className='small warn';return}let target=+E.calNote.value,sv=stableFor(target);if(!sv){E.calMsg.textContent='安定Hzがまだありません。基準音を1秒ほど伸ばしてから押してください。';E.calMsg.className='small warn';return}let cents=1200*Math.log2(target/sv);if(Math.abs(cents)>100){E.calMsg.textContent='基準音から離れすぎています。選択音を確認してください。';E.calMsg.className='small warn';return}cal=cents;try{localStorage.setItem('guitarPitchCalCentsV3',String(cal))}catch(e){}showCal();E.calMsg.textContent='✓ 補正完了：安定 '+sv.toFixed(1)+'Hz → '+target.toFixed(1)+'Hz（'+Math.round(cal)+' cent）';E.calMsg.className='small oktxt'};E.clearBtn.onclick=()=>{cal=0;try{localStorage.removeItem('guitarPitchCalCentsV3')}catch(e){}showCal();E.calMsg.textContent='補正解除';E.calMsg.className='small'};E.retry.onclick=load;E.prev.onclick=()=>{if(page){page--;load()}};E.next.onclick=()=>{if((page+1)*2<BARS.length){page++;load()}};showCal();load()})();</script></body></html>
