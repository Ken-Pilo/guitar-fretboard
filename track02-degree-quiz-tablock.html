<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Track 02 TAB Lock Quiz</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:820px;margin:auto;padding:10px}.p{background:#0d0d0d;border:1px solid #333;border-radius:15px;padding:13px;margin-bottom:9px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{background:#181818;color:#fff;border:1px solid #444;border-radius:9px;min-height:43px;padding:8px;font:inherit}.song{font-size:21px;font-weight:900}.small{font-size:12px;color:#aaa}.blue{color:#58a6ff}.green{color:#6ee787}.orange{color:#ffb86c}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{border:1px solid #333;border-radius:12px;padding:10px;min-height:140px}.chord{text-align:center;font-size:26px;font-weight:900}.root{text-align:center;color:#58a6ff;font-size:13px;font-weight:800}.degs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}.d{font-size:23px;font-weight:850;color:#555;min-width:34px;text-align:center}.d.now{color:#168bff;transform:scale(1.15)}.d.ok{color:#fff}.detect{text-align:center;margin-top:12px;font-size:18px}.prog,.meter{height:9px;background:#222;border-radius:9px;overflow:hidden;margin-top:9px}.prog div,.meter div{height:100%;background:#fff}.nav{display:flex;gap:6px;margin-top:10px}.nav button{flex:1}@media(max-width:560px){.d{font-size:19px}.chord{font-size:21px}.bar{padding:8px}}</style></head><body><div class="app"><div class="p"><div class="row"><div class="song">Track 02 コード基準度数クイズ <span class="blue">TAB LOCK</span></div><button id="on" class="btn" style="margin-left:auto">ギター入力 ON</button></div><select id="dev" style="width:100%;margin-top:8px" disabled><option>入力ON後に取得</option></select><div class="small">使用中：<b id="active">—</b> ／ sampleRate <b id="sr" class="blue">—</b> Hz</div><div class="meter"><div id="lev" style="width:0"></div></div><div class="small">RMS <b id="rms">—</b> ／ 基準 <b id="base">—</b></div></div><div class="p"><div id="pg" class="small" style="text-align:center"></div><div class="bars"><div class="bar"><div id="bt1" class="small"></div><div id="c1" class="chord"></div><div id="r1" class="root"></div><div id="b1" class="degs"></div></div><div class="bar"><div id="bt2" class="small"></div><div id="c2" class="chord"></div><div id="r2" class="root"></div><div id="b2" class="degs"></div></div></div><div class="detect">期待音：<b id="exp" class="blue">—</b>　検出：<b id="note">—</b></div><div class="small" style="text-align:center">target <span id="ts">—</span> ／ rival <span id="rs">—</span> ／ 証拠 <span id="ev">—</span></div><div id="status" class="small" style="text-align:center;margin-top:7px">入力ON後、青い度数を弾いてください。</div><div class="prog"><div id="pr" style="width:0"></div></div><div class="nav"><button id="prev" class="btn">← 前</button><button id="retry" class="btn">やり直し</button><button id="next" class="btn">次 →</button></div></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),N=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],D=['R','m2','△2','m3','△3','P4','♭5','P5','m6','△6','m7','△7'];const CH=['CMaj7','A7(E♭m7)','Dm7','G7(D♭m7)','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7','G7','CMaj7','A7','Dm7(FMaj7♯5)','G7','CMaj7(G)','A7','Dm7','G7','CMaj7','A7(E♭)','Dm7','G7(D♭dim7)'];const PCS=[[2,11,7,4],[3,6,10,1],[10,9,5,2],[1,4,8,11],[0,11,7,5],[4,2,1,4],[2,4,5,7],[8,6,7,5],[4,5,6,9],[7,5,3,1],[2,9,0,9],[11,9,8,6],[7,5,4,2],[1,3,4,7],[5,9,1,4],[2,5,8,6],[7,11,2,0],[1,10,9,7],[5,9,0,10],[11,8,7,5],[4,7,11,9],[10,7,5,3],[2,5,9,0],[1,7,10,1]];const MIDI=[[74,71,67,64],[63,66,70,73],[72,69,65,62],[61,64,68,71],[72,71,67,65],[64,62,61,64],[62,64,65,67],[68,66,67,65],[64,65,66,69],[67,65,63,61],[62,57,60,57],[59,57,56,54],[55,53,52,50],[49,51,52,55],[53,57,61,64],[62,65,68,66],[67,71,74,72],[73,70,69,67],[65,69,72,70],[71,68,67,65],[64,67,71,69],[70,67,65,63],[62,65,69,72],[73,67,70,73]];function rootPc(s){let m=s.match(/^([A-G])([#♯b♭]?)/),p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='♯'||m[2]==='#')p++;if(m[2]==='♭'||m[2]==='b')p--;return(p+12)%12}function altPc(s){let m=s.match(/\(([A-G])([#♯b♭]?)/);if(!m)return null;let p={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];if(m[2]==='♯'||m[2]==='#')p++;if(m[2]==='♭'||m[2]==='b')p--;return(p+12)%12}const BARS=PCS.map((a,i)=>a.map((pc,j)=>{let r=rootPc(CH[i]),ar=altPc(CH[i]),main=D[(pc-r+12)%12];return{pc,midi:MIDI[i][j],l:ar==null?main:main+'('+D[(pc-ar+12)%12]+')'}}));let page=0,seq=[],split=0,idx=0,ctx,an,buf,stream,raf=0,trial=null,prevR=.0001,env=.0001,lock=0,base=+(localStorage.getItem('guitarInputRmsBase')||.0009);$('base').textContent=base.toFixed(5);function midiName(m){return N[(m%12+12)%12]+(Math.floor(m/12)-1)}function hz(m){return 440*Math.pow(2,(m-69)/12)}function load(){let a=BARS[page*2]||[],b=BARS[page*2+1]||[];seq=[...a,...b];split=a.length;idx=0;trial=null;$('pg').textContent=(page*2+1)+'–'+Math.min(page*2+2,24)+'小節 ／ 全24小節';$('bt1').textContent=(page*2+1)+'小節目';$('bt2').textContent=(page*2+2)+'小節目';$('c1').textContent=CH[page*2]||'—';$('c2').textContent=CH[page*2+1]||'—';$('r1').textContent='R = '+N[rootPc(CH[page*2])];$('r2').textContent='R = '+N[rootPc(CH[page*2+1])];draw()}function draw(){$('b1').innerHTML='';$('b2').innerHTML='';seq.forEach((x,i)=>{let s=document.createElement('span');s.className='d'+(i<idx?' ok':i===idx?' now':'');s.textContent=x.l;(i<split?$('b1'):$('b2')).appendChild(s)});$('pr').style.width=((page*8+idx)/(24*4)*100)+'%';$('prev').disabled=page===0;$('next').disabled=page>=11;if(idx<seq.length)$('exp').textContent=midiName(seq[idx].midi)+' '+hz(seq[idx].midi).toFixed(1)+'Hz';if(idx>=seq.length&&page<11){page++;load();$('status').textContent='次の2小節へ'}}function prep(x){let n=x.length,m=0;for(let v of x)m+=v;m/=n;let y=new Float32Array(n),r=0;for(let i=0;i<n;i++){y[i]=x[i]-m;r+=y[i]*y[i]}return{y,r:Math.sqrt(r/n)}}function corr(y,t){let xy=0,aa=0,bb=0,lim=y.length-t;for(let i=0;i<lim;i++){let a=y[i],b=y[i+t];xy+=a*b;aa+=a*a;bb+=b*b}return aa&&bb?xy/Math.sqrt(aa*bb):0}function scoreFreq(y,sr,f){let t0=sr/f,b=-1,bf=f;for(let d=-5;d<=5;d++){let t=Math.round(t0+d);if(t<3||t>=y.length/2)continue;let c=corr(y,t);if(c>b){b=c;bf=sr/t}}return{score:b,f:bf}}function frame(y,sr,m){let tf=hz(m),t=scoreFreq(y,sr,tf),rival=-1,rivalMidi=m;for(let d=-6;d<=6;d++){if(!d)continue;let rm=m+d,rf=hz(rm);if(rf<65||rf>1000)continue;let s=scoreFreq(y,sr,rf);if(s.score>rival){rival=s.score;rivalMidi=rm}}let h2=scoreFreq(y,sr,tf*2).score,h3=tf*3<1000?scoreFreq(y,sr,tf*3).score:0;let ev=t.score*.82+Math.max(0,h2)*.06+Math.max(0,h3)*.04;return{target:t.score,rival,rivalMidi,ev,f:t.f}}function med(a){let z=[...a].sort((x,y)=>x-y);return z[Math.floor(z.length/2)]}function tryAccept(s,early){if(s.length<3)return false;let good=s.filter(x=>x.target>=.34&&x.ev>=.36&&x.target>=x.rival*.86);if(good.length<(early?3:Math.max(3,Math.ceil(s.length*.35))))return false;let best=good.sort((a,b)=>b.ev-a.ev).slice(0,5),f=med(best.map(x=>x.f)),m=seq[idx].midi;$('note').textContent=midiName(m);$('ts').textContent=med(best.map(x=>x.target)).toFixed(2);$('rs').textContent=med(best.map(x=>x.rival)).toFixed(2);$('ev').textContent=good.length+'/'+s.length+(early?' EARLY':'');idx++;$('status').textContent='✓ OK';draw();return true}function loop(){if(!an)return;an.getFloatTimeDomainData(buf);let now=performance.now(),q=prep(buf);$('rms').textContent=q.r.toFixed(5);$('lev').style.width=Math.min(100,q.r/(base||.001)*70)+'%';env=env*.94+q.r*.06;let attack=!trial&&now>lock&&q.r>Math.max(.00011,env*1.12)&&q.r>prevR*1.05;if(attack&&idx<seq.length){trial={t:now,s:[],peak:q.r};$('status').textContent='検出中…'}if(trial){trial.peak=Math.max(trial.peak,q.r);let dt=now-trial.t;if(dt>=55&&dt<=210&&q.r>.00009){let e=frame(q.y,ctx.sampleRate,seq[idx].midi);trial.s.push(e);if(dt>=95&&tryAccept(trial.s,true)){trial=null;lock=now+65}}if(trial&&dt>215){if(!tryAccept(trial.s,false)){$('status').textContent='不安定・無視';$('ev').textContent=trial.s.length+' samples'}trial=null;lock=now+70}}prevR=q.r;raf=requestAnimationFrame(loop)}async function list(id){let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');$('dev').innerHTML='';ds.forEach((d,i)=>$('dev').add(new Option(d.label||'入力 '+(i+1),d.deviceId)));$('dev').disabled=!ds.length;if(id&&ds.some(d=>d.deviceId===id))$('dev').value=id}async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());let audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio});let tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};$('active').textContent=tr.label||'入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();$('sr').textContent=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=4096;buf=new Float32Array(an.fftSize);src.connect(an);cancelAnimationFrame(raf);loop();await list(set.deviceId||id||'')}$('on').onclick=async()=>{if(stream){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());stream=null;an=null;if(ctx){await ctx.close();ctx=null}$('on').textContent='ギター入力 ON'}else try{await open('');$('on').textContent='ギター入力 OFF'}catch(e){$('status').textContent='入力エラー '+e.message}};$('dev').onchange=()=>open($('dev').value);$('retry').onclick=()=>{idx=0;trial=null;draw();$('status').textContent='青い度数を弾いてください。'};$('prev').onclick=()=>{if(page>0){page--;load()}};$('next').onclick=()=>{if(page<11){page++;load()}};load()})();</script></body></html>
