<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Guitar Input Test v3</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#202328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:720px;margin:auto;padding:10px}.card{background:#fff;border:1px solid #dcdfe2;border-radius:16px;padding:18px;margin-bottom:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{font:inherit;min-height:44px;border-radius:10px;border:1px solid #ccd0d4;background:#fff;padding:0 14px}button.on{background:#202328;color:#fff}.deviceField{display:flex;flex-direction:column;gap:4px;min-width:100%;flex:1}.deviceField span{font-size:11px;font-weight:700;color:#737980}.deviceField select{width:100%}.status{font-size:13px;color:#737980;margin-top:8px;line-height:1.5}.detected{text-align:center;padding:24px 10px}.note{font-size:68px;font-weight:900;line-height:1}.degree{font-size:40px;font-weight:850;margin-top:10px}.detail{font-size:14px;color:#737980;margin-top:10px}.meter{height:12px;border-radius:999px;background:#e7e9eb;overflow:hidden;margin-top:16px}.meter>div{height:100%;width:0;background:#202328}.diag{margin-top:10px;font-size:12px;line-height:1.7;color:#555}.hint{font-size:13px;line-height:1.6;color:#555}h1{font-size:20px;margin:0 0 12px}.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:#eef0f2;font-size:12px;font-weight:700}.good{color:#238636}.warn{color:#cf222e}.activeInput{font-weight:800;color:#202328}</style></head><body><div class="app">
<div class="card"><h1>🎸 ギター入力テスト v3</h1><div class="row"><button id="inputBtn">ギター入力 ON</button><label>Root <select id="root"></select></label><span id="state" class="badge">OFF</span></div><div class="row" style="margin-top:10px"><label class="deviceField"><span>入力デバイス</span><select id="device" disabled><option>入力ON後に取得</option></select></label><button id="refreshBtn" disabled>再読込</button></div><div id="status" class="status">ONを押してください。</div><div class="status">使用中：<span id="activeInput" class="activeInput">—</span></div></div>
<div class="card detected"><div id="note" class="note">—</div><div id="degree" class="degree">—</div><div class="detail"><span id="freq">— Hz</span> ・ <span id="cents">— cent</span></div><div class="meter"><div id="level"></div></div><div id="diag" class="diag">入力レベル 0% ／ 検出待ち</div></div>
<div class="card hint">v3：THR向けにYIN方式へ変更。まずクリーン音で、6弦開放E → 5弦A → 4弦Dを1本ずつ鳴らしてください。下の診断に「候補 xx.x Hz」が出れば検出器まで信号が届いています。</div></div>
<script>(()=>{'use strict';
const N=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],D=['R','m2','△2','m3','△3','P4','♭5','P5','m6','△6','m7','△7'];
const $=id=>document.getElementById(id),root=$('root');N.forEach((n,i)=>root.add(new Option(n,i)));root.value=0;
const btn=$('inputBtn'),state=$('state'),status=$('status'),dev=$('device'),refresh=$('refreshBtn'),active=$('activeInput'),note=$('note'),degree=$('degree'),freq=$('freq'),cents=$('cents'),level=$('level'),diag=$('diag');
let ctx,analyser,stream,buf,raf=0,current='',hist=[];
function yin(x,sr){
 const n=x.length;let mean=0;for(let v of x)mean+=v;mean/=n;let rms=0;const y=new Float32Array(n);for(let i=0;i<n;i++){y[i]=x[i]-mean;rms+=y[i]*y[i]}rms=Math.sqrt(rms/n);if(rms<0.0005)return{f:-1,r:rms,p:0};
 // Guitar E2..E6-ish: 75-1400 Hz. YIN difference + cumulative mean normalized difference.
 const minTau=Math.floor(sr/1400),maxTau=Math.min(Math.floor(sr/75),Math.floor(n/2));const diff=new Float32Array(maxTau+1),cmnd=new Float32Array(maxTau+1);cmnd[0]=1;
 for(let t=1;t<=maxTau;t++){let s=0;for(let i=0;i<n-t;i++){const q=y[i]-y[i+t];s+=q*q}diff[t]=s}
 let run=0,best=-1,bestVal=1;for(let t=1;t<=maxTau;t++){run+=diff[t];cmnd[t]=run?diff[t]*t/run:1;if(t>=minTau&&cmnd[t]<0.18){while(t+1<=maxTau&&cmnd[t+1]<cmnd[t])t++;best=t;bestVal=cmnd[t];break}if(t>=minTau&&cmnd[t]<bestVal){bestVal=cmnd[t];best=t}}
 if(best<0||bestVal>0.38)return{f:-1,r:rms,p:1-bestVal};let tau=best;if(best>1&&best<maxTau){const a=cmnd[best-1],b=cmnd[best],c=cmnd[best+1],den=a+c-2*b;if(Math.abs(den)>1e-9)tau=best+(a-c)/(2*den)}const f=sr/tau;return{f:(f>=75&&f<=1400)?f:-1,r:rms,p:1-bestVal};
}
function render(){if(!analyser)return;analyser.getFloatTimeDomainData(buf);const p=yin(buf,ctx.sampleRate),pct=Math.min(100,p.r*2500);level.style.width=pct+'%';diag.textContent='入力レベル '+pct.toFixed(0)+'% ／ '+(p.f>0?'候補 '+p.f.toFixed(1)+' Hz・信頼 '+Math.round(p.p*100)+'%':'検出待ち・信頼 '+Math.round(p.p*100)+'%');if(p.f>0){const m=69+12*Math.log2(p.f/440),mr=Math.round(m);hist.push(mr);if(hist.length>5)hist.shift();const same=hist.filter(v=>v===mr).length;if(same>=2){const pc=(mr%12+12)%12;note.textContent=N[pc];degree.textContent=D[(pc-Number(root.value)+12)%12];freq.textContent=p.f.toFixed(1)+' Hz';cents.textContent=Math.round(100*(m-mr))+' cent'}}raf=requestAnimationFrame(render)}
async function listDevices(id){const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');dev.innerHTML='';ds.forEach((d,i)=>dev.add(new Option(d.label||'入力 '+(i+1),d.deviceId)));dev.disabled=!ds.length;refresh.disabled=false;if(id&&ds.some(d=>d.deviceId===id))dev.value=id}
async function open(id){if(stream)stream.getTracks().forEach(t=>t.stop());const audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};if(id)audio.deviceId={exact:id};stream=await navigator.mediaDevices.getUserMedia({audio,video:false});const tr=stream.getAudioTracks()[0],set=tr.getSettings?tr.getSettings():{};current=set.deviceId||id||'';active.textContent=tr.label||'オーディオ入力';if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();const src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=0;buf=new Float32Array(analyser.fftSize);src.connect(analyser);cancelAnimationFrame(raf);render();await listDevices(current)}
async function start(){try{await open('');btn.textContent='ギター入力 OFF';btn.classList.add('on');state.textContent='ON';state.className='badge good';status.textContent='入力中：単音を弾いてください。'}catch(e){state.textContent='ERROR';state.className='badge warn';status.textContent=String(e.message||e)}}
async function stop(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;analyser=null;if(ctx){await ctx.close();ctx=null}btn.textContent='ギター入力 ON';btn.classList.remove('on');state.textContent='OFF';state.className='badge';active.textContent='—'}
btn.onclick=()=>stream?stop():start();dev.onchange=async()=>{try{await open(dev.value);status.textContent='入力切替完了'}catch(e){status.textContent=String(e.message||e)}};refresh.onclick=()=>listDevices(current);
})();</script></body></html>
